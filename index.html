<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MuscleWeb – 3D Anatomie</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #080a0d;
    color: #f4f4f5;
}

button,
input {
    font: inherit;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

#sidebar {
    width: 280px;
    height: 100%;
    background: #101318;
    border-right: 1px solid #252a32;
    display: flex;
    flex-direction: column;
    z-index: 20;
}

.logo {
    padding: 22px 20px 18px;
    border-bottom: 1px solid #252a32;
}

.logo-title {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.logo-subtitle {
    color: #7d8590;
    font-size: 12px;
    margin-top: 5px;
}

.section-title {
    padding: 18px 18px 8px;
    color: #737b87;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.region-list {
    padding: 0 10px;
}

.region-btn {
    width: 100%;
    border: 0;
    background: transparent;
    color: #aeb5bf;
    text-align: left;
    padding: 11px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: 0.15s;
}

.region-btn:hover {
    background: #191e25;
    color: white;
}

.region-btn.active {
    background: #242a33;
    color: white;
}

.sidebar-bottom {
    margin-top: auto;
    padding: 15px;
    border-top: 1px solid #252a32;
}

.small-info {
    color: #666f7b;
    font-size: 11px;
    line-height: 1.5;
}

/* =========================
   MAIN
========================= */

#main {
    flex: 1;
    min-width: 0;
    height: 100%;
    position: relative;
}

#viewer {
    position: absolute;
    inset: 0;
}

canvas {
    display: block;
}

/* =========================
   TOP BAR
========================= */

#topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    z-index: 5;
}

.search-box {
    pointer-events: auto;
    width: min(360px, 45vw);
    height: 42px;
    background: rgba(16,19,24,0.94);
    border: 1px solid #2b313a;
    border-radius: 9px;
    color: white;
    padding: 0 14px;
    outline: none;
}

.search-box:focus {
    border-color: #596372;
}

.top-spacer {
    flex: 1;
}

.top-btn {
    pointer-events: auto;
    border: 1px solid #2b313a;
    background: rgba(16,19,24,0.94);
    color: #dce0e5;
    height: 42px;
    padding: 0 13px;
    border-radius: 8px;
    cursor: pointer;
}

.top-btn:hover {
    background: #1c2128;
}

/* =========================
   VIEW CONTROLS
========================= */

#view-controls {
    position: absolute;
    right: 18px;
    top: 85px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 5;
}

.view-btn {
    width: 43px;
    height: 39px;
    border: 1px solid #2b313a;
    background: rgba(16,19,24,0.94);
    color: #d8dce1;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
}

.view-btn:hover {
    background: #20252d;
}

/* =========================
   MUSCLE PANEL
========================= */

#muscle-panel {
    position: absolute;
    top: 85px;
    left: 18px;
    width: 270px;
    max-height: calc(100% - 105px);
    background: rgba(15,18,23,0.95);
    border: 1px solid #282e37;
    border-radius: 11px;
    overflow: hidden;
    z-index: 6;
}

.panel-header {
    padding: 14px;
    border-bottom: 1px solid #272d35;
}

.panel-title {
    font-size: 15px;
    font-weight: 700;
}

.panel-subtitle {
    color: #717986;
    font-size: 11px;
    margin-top: 4px;
}

#muscle-list {
    overflow-y: auto;
    max-height: 320px;
}

.muscle-item {
    padding: 10px 14px;
    border-bottom: 1px solid #1e232a;
    cursor: pointer;
    color: #aeb5be;
    font-size: 12px;
}

.muscle-item:hover {
    background: #1b2027;
    color: white;
}

.muscle-item.active {
    background: #272e37;
    color: white;
}

/* =========================
   DETAIL PANEL
========================= */

#detail-panel {
    position: absolute;
    right: 18px;
    bottom: 18px;
    width: 290px;
    background: rgba(15,18,23,0.96);
    border: 1px solid #292f38;
    border-radius: 11px;
    padding: 16px;
    z-index: 7;
    display: none;
}

.detail-name {
    font-size: 18px;
    font-weight: 700;
}

.detail-region {
    color: #7f8792;
    font-size: 12px;
    margin-top: 4px;
}

.detail-actions {
    display: flex;
    gap: 7px;
    margin-top: 15px;
}

.detail-btn {
    flex: 1;
    border: 1px solid #343b45;
    background: #1b2027;
    color: #e4e7ea;
    border-radius: 7px;
    padding: 9px 7px;
    cursor: pointer;
    font-size: 11px;
}

.detail-btn:hover {
    background: #272e37;
}

.exercise-title {
    margin-top: 17px;
    font-size: 11px;
    color: #747d89;
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

.exercise {
    margin-top: 7px;
    padding: 8px 9px;
    background: #191e24;
    border-radius: 6px;
    font-size: 12px;
    color: #bfc5cc;
}

/* =========================
   LOADING
========================= */

#loading {
    position: absolute;
    inset: 0;
    background: #080a0d;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 0.4s;
}

.loading-box {
    width: min(420px, 85vw);
    text-align: center;
}

.loading-title {
    font-size: 22px;
    font-weight: 700;
}

.loading-text {
    margin-top: 8px;
    color: #7c8591;
    font-size: 13px;
}

.progress-container {
    width: 100%;
    height: 5px;
    background: #1b2026;
    border-radius: 5px;
    margin-top: 22px;
    overflow: hidden;
}

#progress {
    height: 100%;
    width: 0%;
    background: #d7dce2;
    transition: width 0.15s;
}

/* =========================
   ERROR
========================= */

#error-box {
    display: none;
    margin-top: 20px;
    padding: 13px;
    border: 1px solid #483238;
    background: #21171a;
    color: #d9aeb5;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.5;
}

/* =========================
   MOBILE
========================= */

#mobile-menu {
    display: none;
}

@media (max-width: 850px) {

    #sidebar {
        position: absolute;
        left: -290px;
        top: 0;
        transition: left 0.25s;
        box-shadow: 10px 0 30px rgba(0,0,0,0.4);
    }

    #sidebar.open {
        left: 0;
    }

    #mobile-menu {
        display: block;
        position: absolute;
        left: 15px;
        top: 15px;
        width: 42px;
        height: 42px;
        border: 1px solid #2b313a;
        border-radius: 8px;
        background: rgba(16,19,24,0.94);
        color: white;
        z-index: 30;
        cursor: pointer;
    }

    #topbar {
        left: 67px;
        padding-left: 0;
    }

    .search-box {
        width: min(300px, 42vw);
    }

    #muscle-panel {
        left: 12px;
        top: auto;
        bottom: 12px;
        width: 240px;
        max-height: 250px;
    }

    #detail-panel {
        right: 12px;
        bottom: 12px;
        width: 250px;
    }
}

@media (max-width: 600px) {

    .search-box {
        width: 45vw;
    }

    .top-btn {
        padding: 0 8px;
        font-size: 11px;
    }

    #detail-panel {
        display: none !important;
    }
}
</style>
</head>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   GRUNDSETUP
========================================================= */

const viewer = document.getElementById("viewer");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x080a0d);


/* Kamera */

const camera = new THREE.PerspectiveCamera(
    45,
    viewer.clientWidth / viewer.clientHeight,
    0.01,
    1000
);

camera.position.set(
    0,
    0,
    7
);


/* Renderer */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

viewer.appendChild(renderer.domElement);


/* =========================================================
   LICHT
========================================================= */

const ambientLight = new THREE.HemisphereLight(
    0xffffff,
    0x20242b,
    2.4
);

scene.add(ambientLight);


const keyLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

keyLight.position.set(
    4,
    7,
    6
);

scene.add(keyLight);


const fillLight = new THREE.DirectionalLight(
    0xffffff,
    1.5
);

fillLight.position.set(
    -5,
    3,
    4
);

scene.add(fillLight);


const backLight = new THREE.DirectionalLight(
    0xffffff,
    1.2
);

backLight.position.set(
    0,
    3,
    -6
);

scene.add(backLight);


/* =========================================================
   ORBIT CONTROLS
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.07;

controls.enablePan = true;

controls.screenSpacePanning = true;


/*
   WICHTIG:
   Sehr großer maxDistance,
   damit man wirklich weit herauszoomen kann.
*/

controls.minDistance = 0.1;

controls.maxDistance = 100;

controls.zoomSpeed = 1.2;

controls.rotateSpeed = 0.7;

controls.panSpeed = 0.8;


/* =========================================================
   MODELL
========================================================= */

let model = null;

let modelMeshes = [];

let originalMaterials = new Map();

let selectedMesh = null;

let labelsVisible = false;

let skeletonVisible = false;


/* =========================================================
   REGIONEN
========================================================= */

const REGION_NAMES = {

    all: "Ganzkörper",

    chest: "Brust",

    back: "Rücken",

    shoulders: "Schultern",

    arms: "Arme",

    abs: "Bauch",

    legs: "Beine",

    glutes: "Gesäß"

};


/* =========================================================
   MUSKELNAMEN
========================================================= */

const muscleNames = {

    pectoralis: "Großer Brustmuskel",

    pectoralismajor: "Großer Brustmuskel",

    pectoralisminor: "Kleiner Brustmuskel",

    deltoid: "Deltamuskel",

    deltoideus: "Deltamuskel",

    trapezius: "Trapezmuskel",

    latissimus: "Breiter Rückenmuskel",

    latissimusdorsi: "Breiter Rückenmuskel",

    biceps: "Bizeps",

    bicepsbrachii: "Bizeps",

    triceps: "Trizeps",

    tricepsbrachii: "Trizeps",

    brachialis: "Armbeuger",

    rectusabdominis: "Gerader Bauchmuskel",

    obliquus: "Äußerer schräger Bauchmuskel",

    obliquusexternus: "Äußerer schräger Bauchmuskel",

    obliquusinternus: "Innerer schräger Bauchmuskel",

    transversus: "Querer Bauchmuskel",

    serratus: "Sägezahnmuskel",

    erectorspinae: "Rückenstrecker",

    gluteusmaximus: "Großer Gesäßmuskel",

    gluteusmedius: "Mittlerer Gesäßmuskel",

    gluteusminimus: "Kleiner Gesäßmuskel",

    quadriceps: "Quadrizeps",

    rectusfemoris: "Gerader Oberschenkelmuskel",

    vastuslateralis: "Äußerer Oberschenkelmuskel",

    vastusmedialis: "Innerer Oberschenkelmuskel",

    vastusintermedius: "Mittlerer Oberschenkelmuskel",

    bicepsfemoris: "Bizeps femoris",

    hamstrings: "Oberschenkelrückseite",

    sartorius: "Schneidermuskel",

    gastrocnemius: "Zwillingswadenmuskel",

    soleus: "Schollenmuskel",

    tibialisanterior: "Vorderer Schienbeinmuskel",

    adductor: "Adduktoren",

    adductormagnus: "Großer Adduktor",

    adductorlongus: "Langer Adduktor",

    gracilis: "Schlanker Muskel",

    brachioradialis: "Oberarm-Speichenmuskel",

    pronator: "Pronator",

    supinator: "Supinator",

    masseter: "Kaumuskel",

    temporalis: "Schläfenmuskel"

};


/* =========================================================
   ÜBUNGEN
========================================================= */

const exercises = {

    chest: [
        "Bankdrücken",
        "Schrägbankdrücken",
        "Dips",
        "Liegestütze"
    ],

    back: [
        "Klimmzüge",
        "Latzug",
        "Rudern",
        "Kreuzheben"
    ],

    shoulders: [
        "Schulterdrücken",
        "Seitheben",
        "Frontheben",
        "Reverse Flys"
    ],

    arms: [
        "Bizeps-Curls",
        "Hammer Curls",
        "Trizepsdrücken",
        "Dips"
    ],

    abs: [
        "Crunches",
        "Beinheben",
        "Plank",
        "Cable Crunches"
    ],

    legs: [
        "Kniebeugen",
        "Beinpresse",
        "Beinstrecker",
        "Beinbeuger"
    ],

    glutes: [
        "Hip Thrusts",
        "Bulgarian Split Squats",
        "Ausfallschritte",
        "Kniebeugen"
    ]

};


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function cleanName(name) {

    if (!name) {
        return "Unbekannter Muskel";
    }

    const normalized = name
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");

    for (const key of Object.keys(muscleNames)) {

        if (normalized.includes(key)) {
            return muscleNames[key];
        }

    }

    return name
        .replace(/_/g, " ")
        .replace(/-/g, " ");
}


/* =========================================================
   REGION ERKENNEN
========================================================= */

function detectRegion(mesh) {

    const text = (
        (mesh.name || "") +
        " " +
        (mesh.parent?.name || "")
    ).toLowerCase();

    if (
        text.includes("pector") ||
        text.includes("chest") ||
        text.includes("breast")
    ) {
        return "chest";
    }

    if (
        text.includes("trapez") ||
        text.includes("latiss") ||
        text.includes("rhombo") ||
        text.includes("erector") ||
        text.includes("back") ||
        text.includes("dorsi")
    ) {
        return "back";
    }

    if (
        text.includes("delto") ||
        text.includes("shoulder") ||
        text.includes("supraspin")
    ) {
        return "shoulders";
    }

    if (
        text.includes("biceps") ||
        text.includes("triceps") ||
        text.includes("brach") ||
        text.includes("forearm") ||
        text.includes("pronator") ||
        text.includes("supinator")
    ) {
        return "arms";
    }

    if (
        text.includes("rectusab") ||
        text.includes("obliqu") ||
        text.includes("transvers") ||
        text.includes("serratus")
    ) {
        return "abs";
    }

    if (
        text.includes("glute") ||
        text.includes("buttock")
    ) {
        return "glutes";
    }

    if (
        text.includes("femor") ||
        text.includes("quadriceps") ||
        text.includes("vastus") ||
        text.includes("hamstring") ||
        text.includes("gastrocn") ||
        text.includes("soleus") ||
        text.includes("tibial") ||
        text.includes("adductor") ||
        text.includes("sartorius") ||
        text.includes("leg")
    ) {
        return "legs";
    }

    return "all";
}


/* =========================================================
   MATERIAL
========================================================= */

function createMuscleMaterial() {

    return new THREE.MeshStandardMaterial({

        color: 0xb65f63,

        roughness: 0.72,

        metalness: 0.02,

        transparent: false,

        opacity: 1

    });

}


/* =========================================================
   MODELL LADEN
========================================================= */

function loadModel() {

    const loader = new GLTFLoader();

    const url = "./anatomy.glb";

    loader.load(

        url,

        function(gltf) {

            console.log("anatomy.glb erfolgreich geladen");

            model = gltf.scene;

            /*
                BodyExplorer verwendet eine andere
                Koordinatenorientierung.

                Wir übernehmen diese hier:
                X bleibt X
                Y wird Z
                Z wird -Y

                Das entspricht einer Rotation
                um die X-Achse.
            */

            model.rotation.x = -Math.PI / 2;


            scene.add(model);


            /* Alle Meshes finden */

            model.traverse(function(object) {

                if (!object.isMesh) {
                    return;
                }

                object.frustumCulled = false;

                object.geometry.computeBoundingBox();

                const material = createMuscleMaterial();

                originalMaterials.set(
                    object,
                    material.clone()
                );

                object.material = material;

                object.userData.region =
                    detectRegion(object);

                object.userData.displayName =
                    cleanName(object.name);

                modelMeshes.push(object);

            });


            /*
                Modell zentrieren
            */

            const box = new THREE.Box3().setFromObject(model);

            const center = new THREE.Vector3();

            box.getCenter(center);

            model.position.sub(center);


            /*
                Höhe bestimmen
            */

            const size = new THREE.Vector3();

            box.getSize(size);


            /*
                Modell auf vernünftige Größe bringen.
            */

            const height = Math.max(
                size.x,
                size.y,
                size.z
            );

            const targetHeight = 6;

            if (height > 0) {

                const scale =
                    targetHeight / height;

                model.scale.setScalar(scale);

            }


            /*
                Nach Skalierung erneut zentrieren.
            */

            const finalBox =
                new THREE.Box3().setFromObject(model);

            const finalCenter =
                new THREE.Vector3();

            finalBox.getCenter(finalCenter);

            model.position.sub(finalCenter);


            /*
                Kamera
            */

            camera.position.set(
                0,
                0,
                7
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();


            /*
                Oberfläche aktualisieren
            */

            buildMuscleList();

            hideLoading();

        },

        function(progressEvent) {

            if (progressEvent.lengthComputable) {

                const percent =
                    (progressEvent.loaded /
                    progressEvent.total) * 100;

                document.getElementById(
                    "progress"
                ).style.width =
                    percent + "%";

                document.getElementById(
                    "loadingText"
                ).textContent =
                    "3D-Modell wird geladen... " +
                    Math.round(percent) +
                    "%";

            } else {

                document.getElementById(
                    "loadingText"
                ).textContent =
                    "3D-Modell wird geladen...";

            }

        },

        function(error) {

            console.error(
                "GLB Fehler:",
                error
            );

            document.getElementById(
                "loadingTitle"
            ).textContent =
                "Fehler beim Laden";

            document.getElementById(
                "loadingText"
            ).textContent =
                "Die anatomy.glb konnte nicht verarbeitet werden.";

            const errorBox =
                document.getElementById(
                    "error-box"
                );

            errorBox.style.display = "block";

            errorBox.innerHTML =
                "Die Datei ist auf GitHub Pages erreichbar, " +
                "aber der 3D-Loader konnte sie nicht verarbeiten. " +
                "<br><br>" +
                "Bitte öffne die Browser-Konsole, falls weitere " +
                "Fehlerinformationen benötigt werden.";

        }

    );

}


/* =========================================================
   LOADING AUSBLENDEN
========================================================= */

function hideLoading() {

    const loading =
        document.getElementById("loading");

    loading.style.opacity = "0";

    setTimeout(function() {

        loading.style.display = "none";

    }, 450);

}


/* =========================================================
   MUSKELLISTE
========================================================= */

let currentRegion = "all";

function buildMuscleList() {

    const list =
        document.getElementById("muscle-list");

    list.innerHTML = "";

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const unique = new Map();


    for (const mesh of modelMeshes) {

        const region =
            mesh.userData.region;

        if (
            currentRegion !== "all" &&
            region !== currentRegion
        ) {
            continue;
        }


        const name =
            mesh.userData.displayName;


        if (
            search &&
            !name.toLowerCase().includes(search)
        ) {
            continue;
        }


        /*
            Gleiche Namen nur einmal
            in der Liste anzeigen.
        */

        if (!unique.has(name)) {

            unique.set(name, mesh);

        }

    }


    if (unique.size === 0) {

        const empty =
            document.createElement("div");

        empty.style.padding = "15px";

        empty.style.color = "#6f7782";

        empty.style.fontSize = "12px";

        empty.textContent =
            "Keine Muskeln gefunden.";

        list.appendChild(empty);

        return;

    }


    for (const [name, mesh] of unique) {

        const item =
            document.createElement("div");

        item.className =
            "muscle-item";

        item.textContent =
            name;

        item.addEventListener(
            "click",
            function() {

                selectMesh(mesh);

            }
        );

        list.appendChild(item);

    }

}


/* =========================================================
   MUSKEL AUSWÄHLEN
========================================================= */

function selectMesh(mesh) {

    if (!mesh) {
        return;
    }


    /* alten Muskel zurücksetzen */

    if (selectedMesh) {

        restoreMesh(
            selectedMesh
        );

    }


    selectedMesh = mesh;


    /*
        Material hervorheben
    */

    mesh.material =
        mesh.material.clone();

    mesh.material.color.set(
        0xe7a0a4
    );

    mesh.material.emissive.set(
        0x351518
    );

    mesh.material.emissiveIntensity =
        0.35;


    /*
        Detailpanel
    */

    const panel =
        document.getElementById(
            "detail-panel"
        );

    panel.style.display =
        "block";


    document.getElementById(
        "detail-name"
    ).textContent =
        mesh.userData.displayName;


    document.getElementById(
        "detail-region"
    ).textContent =
        REGION_NAMES[
            mesh.userData.region
        ] || "Ganzkörper";


    /*
        Übungen
    */

    const exerciseList =
        document.getElementById(
            "exercise-list"
        );

    exerciseList.innerHTML = "";

    const region =
        mesh.userData.region;

    const list =
        exercises[region] ||
        exercises["arms"];


    list.forEach(function(exercise) {

        const div =
            document.createElement("div");

        div.className =
            "exercise";

        div.textContent =
            exercise;

        exerciseList.appendChild(div);

    });


    focusOnMesh(mesh);

}


/* =========================================================
   MATERIAL ZURÜCKSETZEN
========================================================= */

function restoreMesh(mesh) {

    const original =
        originalMaterials.get(mesh);

    if (!original) {
        return;
    }

    mesh.material =
        original.clone();

}


/* =========================================================
   AUF MUSKEL FOKUSSIEREN
========================================================= */

function focusOnMesh(mesh) {

    const box =
        new THREE.Box3()
            .setFromObject(mesh);


    const center =
        new THREE.Vector3();

    box.getCenter(center);


    const size =
        new THREE.Vector3();

    box.getSize(size);


    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const distance =
        Math.max(
            maxSize * 3.5,
            1.2
        );


    const direction =
        new THREE.Vector3(
            0,
            0,
            1
        );


    camera.position.copy(
        center.clone().add(
            direction.multiplyScalar(
                distance
            )
        )
    );


    controls.target.copy(
        center
    );


    controls.update();

}


/* =========================================================
   MUSKEL ISOLIEREN
========================================================= */

function isolateSelected() {

    if (!selectedMesh) {
        return;
    }


    for (const mesh of modelMeshes) {

        if (mesh === selectedMesh) {

            mesh.visible = true;

        } else {

            mesh.visible = false;

        }

    }

}


/* =========================================================
   ALLES WIEDER ZEIGEN
========================================================= */

function showAllMeshes() {

    for (const mesh of modelMeshes) {

        mesh.visible = true;

    }

}


/* =========================================================
   LABELS
========================================================= */

function toggleLabels() {

    labelsVisible =
        !labelsVisible;

    /*
        Echte 3D-Labels werden später
        über HTML-Elemente ergänzt.
        Für jetzt wird die Auswahl-
        funktion nicht beeinflusst.
    */

    document.getElementById(
        "labelsBtn"
    ).textContent =
        labelsVisible
            ? "Labels an"
            : "Labels";

}


/* =========================================================
   SKELETT
========================================================= */

function toggleSkeleton() {

    skeletonVisible =
        !skeletonVisible;

    /*
        Das aktuelle Repository enthält
        nur anatomy.glb.

        Deshalb wird hier noch kein
        separates skeleton.glb geladen.
    */

    document.getElementById(
        "skeletonBtn"
    ).textContent =
        skeletonVisible
            ? "Skelett an"
            : "Skelett";

}


/* =========================================================
   KAMERAANSICHTEN
========================================================= */

function frontView() {

    camera.position.set(
        0,
        0,
        7
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


function backView() {

    camera.position.set(
        0,
        0,
        -7
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


function sideView() {

    camera.position.set(
        7,
        0,
        0
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


function resetView() {

    showAllMeshes();

    if (selectedMesh) {

        restoreMesh(
            selectedMesh
        );

    }

    selectedMesh = null;

    document.getElementById(
        "detail-panel"
    ).style.display =
        "none";


    camera.position.set(
        0,
        0,
        7
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


/* =========================================================
   ZOOM
========================================================= */

function zoomIn() {

    const direction =
        new THREE.Vector3();

    direction
        .subVectors(
            camera.position,
            controls.target
        )
        .normalize();


    const distance =
        camera.position.distanceTo(
            controls.target
        );


    const newDistance =
        Math.max(
            distance * 0.7,
            controls.minDistance
        );


    camera.position.copy(
        controls.target
            .clone()
            .add(
                direction.multiplyScalar(
                    newDistance
                )
            )
    );

}


function zoomOut() {

    const direction =
        new THREE.Vector3();

    direction
        .subVectors(
            camera.position,
            controls.target
        )
        .normalize();


    const distance =
        camera.position.distanceTo(
            controls.target
        );


    const newDistance =
        Math.min(
            distance * 1.35,
            controls.maxDistance
        );


    camera.position.copy(
        controls.target
            .clone()
            .add(
                direction.multiplyScalar(
                    newDistance
                )
            )
    );

}


/* =========================================================
   REGION BUTTONS
========================================================= */

document.querySelectorAll(
    ".region-btn"
).forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            document
                .querySelectorAll(

                )
                .forEach(function(btn) {

                    );

            document.getElementById(

    );

document.getElementById(

document.getElementById(

    }

/* =========================================================
   3D MOUSE / TOUCH AUSWAHL
========================================================= */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();


function updatePointer(event) {

    const rect =
        renderer.domElement
            .getBoundingClientRect();


    pointer.x =
        ((event.clientX - rect.left)
        / rect.width) * 2 - 1;


    pointer.y =
        -((event.clientY - rect.top)
        / rect.height) * 2 + 1;

}


renderer.domElement.addEventListener(
    "pointerdown",
    function(event) {

        updatePointer(event);

    }
);


renderer.domElement.addEventListener(
    "dblclick",
    function(event) {

        updatePointer(event);

        raycaster.setFromCamera(
            pointer,
            camera
        );


        const visibleMeshes =
            modelMeshes.filter(
                mesh => mesh.visible
            );


        const hits =
            raycaster.intersectObjects(
                visibleMeshes,
                true
            );


        if (hits.length > 0) {

            let object =
                hits[0].object;


            while (
                object &&
                !object.userData.displayName &&
                object.parent
            ) {

                object =
                    object.parent;

            }


            if (
                object &&
                object.userData.displayName
            ) {

                selectMesh(object);

            }

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        const width =
            viewer.clientWidth;

        const height =
            viewer.clientHeight;


        camera.aspect =
            width / height;

        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );

    }
);


/* =========================================================
   RENDER LOOP
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================================================
   START
========================================================= */

loadModel();

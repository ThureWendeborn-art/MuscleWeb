<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MuscleLab</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#08090b;
    color:#f4f4f5;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

#app{
    width:100%;
    height:100%;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:245px;
    flex-shrink:0;
    background:#0e1013;
    border-right:1px solid #25282d;
    padding:24px 16px;
    z-index:20;
}

.logo{
    font-size:23px;
    font-weight:800;
    letter-spacing:-.5px;
    margin:0 8px 4px;
}

.logo span{
    color:#ef4444;
}

.subtitle{
    color:#717780;
    font-size:12px;
    margin:0 8px 28px;
}

.section-title{
    color:#626871;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:1.4px;
    font-weight:700;
    margin:22px 8px 8px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.nav button{
    width:100%;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#aeb3ba;
    text-align:left;
    padding:10px 11px;
    font-size:13px;
}

.nav button:hover{
    background:#191c21;
    color:white;
}

.nav button.active{
    background:#20242a;
    color:white;
    box-shadow:inset 3px 0 #ef4444;
}

/* MAIN */

.main{
    position:relative;
    flex:1;
    min-width:0;
    min-height:0;
}

#viewer{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
}

/* TOP */

.top{
    position:absolute;
    top:18px;
    left:20px;
    right:20px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.titlebox,
.tools{
    pointer-events:auto;
}

.titlebox{
    background:rgba(12,14,17,.88);
    border:1px solid #292d33;
    border-radius:9px;
    padding:10px 14px;
    backdrop-filter:blur(12px);
}

.titlebox strong{
    font-size:14px;
}

.titlebox small{
    display:block;
    color:#737983;
    margin-top:2px;
    font-size:11px;
}

.tools{
    display:flex;
    gap:6px;
}

.tool{
    border:1px solid #292d33;
    background:rgba(12,14,17,.9);
    color:#ddd;
    border-radius:7px;
    padding:9px 11px;
}

.tool:hover{
    background:#1b1f24;
}

/* RIGHT */

.panel{
    position:absolute;
    right:18px;
    top:82px;
    bottom:18px;
    width:310px;
    background:rgba(13,15,18,.94);
    border:1px solid #292d33;
    border-radius:12px;
    z-index:10;
    padding:16px;
    overflow-y:auto;
    backdrop-filter:blur(14px);
}

.panel::-webkit-scrollbar{
    width:5px;
}

.panel::-webkit-scrollbar-thumb{
    background:#363a40;
    border-radius:5px;
}

.panel-heading{
    font-size:17px;
    font-weight:700;
}

.panel-sub{
    color:#70767e;
    font-size:11px;
    margin-top:3px;
    margin-bottom:14px;
}

/* SEARCH */

.search{
    width:100%;
    border:1px solid #292d33;
    background:#111419;
    color:white;
    border-radius:7px;
    padding:10px 11px;
    outline:none;
    margin-bottom:12px;
}

.search:focus{
    border-color:#ef4444;
}

/* MUSCLES */

.muscles{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.muscle{
    width:100%;
    border:1px solid #292d33;
    background:#15181c;
    color:#cfd2d6;
    border-radius:7px;
    padding:9px 10px;
    text-align:left;
    font-size:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.muscle:hover{
    background:#1d2126;
    border-color:#555b63;
}

.muscle.selected{
    border-color:#ef4444;
    background:#321719;
    color:white;
}

.muscle-dot{
    width:7px;
    height:7px;
    background:#ef4444;
    border-radius:50%;
}

/* INFO */

.info{
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid #292d33;
}

.info h3{
    margin:0;
    font-size:15px;
}

.info p{
    color:#969ca4;
    font-size:12px;
    line-height:1.55;
}

.action-row{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.action{
    flex:1;
    border:1px solid #30343a;
    background:#171a1f;
    color:#ddd;
    border-radius:6px;
    padding:8px;
    font-size:11px;
}

.action:hover{
    background:#22262c;
}

/* EXERCISES */

.exercise-title{
    margin-top:20px;
    font-weight:700;
    font-size:13px;
}

.exercise{
    margin-top:6px;
    padding:9px;
    background:#15181c;
    border:1px solid #292d33;
    border-radius:7px;
}

.exercise strong{
    font-size:12px;
}

.exercise small{
    display:block;
    color:#727881;
    margin-top:3px;
}

/* LOADING */

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#08090b;
    z-index:50;
}

.loading-box{
    width:300px;
    text-align:center;
}

.loading-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:8px;
}

.loading-text{
    color:#747a82;
    font-size:12px;
}

.progress{
    margin-top:18px;
    height:4px;
    background:#22262b;
    border-radius:4px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#ef4444;
    transition:width .15s;
}

/* MOBILE */

.mobile-menu{
    display:none;
}

@media(max-width:900px){

    .sidebar{
        width:205px;
    }

    .panel{
        width:275px;
    }
}

@media(max-width:700px){

    .sidebar{
        position:absolute;
        left:-260px;
        top:0;
        bottom:0;
        transition:.25s;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .panel{
        left:12px;
        right:12px;
        width:auto;
        top:auto;
        bottom:12px;
        max-height:42%;
    }

    .top{
        left:12px;
        right:12px;
    }

    .titlebox{
        margin-left:45px;
    }
}
</style>
</head>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import {
    OrbitControls
} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

import {
    GLTFLoader
} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/*
===========================================================
BODYEXPLORER MODEL
===========================================================

Das Modell stammt aus dem öffentlichen BodyExplorer-Projekt.
Es enthält 467 anatomische Strukturen.
*/

const MODEL_URL =
"https://cdn.jsdelivr.net/gh/JohanBellander/BodyExplorer@main/public/anatomy.glb";


/*
===========================================================
SCENE
===========================================================
*/

const container =
document.getElementById("viewer");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x08090b);


const camera =
new THREE.PerspectiveCamera(
    42,
    container.clientWidth /
    container.clientHeight,
    .01,
    100
);

camera.position.set(
    0,
    1.5,
    5.8
);


const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

container.appendChild(
    renderer.domElement
);


const controls =
new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.08;
controls.target.set(
    0,
    1.4,
    0
);

controls.minDistance=2;
controls.maxDistance=9;


/*
===========================================================
LIGHTS
===========================================================
*/

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x151515,
        2.2
    )
);

const key =
new THREE.DirectionalLight(
    0xffffff,
    3
);

key.position.set(
    4,
    6,
    5
);

scene.add(key);

const fill =
new THREE.DirectionalLight(
    0x9da5b4,
    1.2
);

fill.position.set(
    -4,
    3,
    -5
);

scene.add(fill);


/*
===========================================================
MODEL
===========================================================
*/

let model=null;

let meshes=[];

let selected=[];

let skeletonVisible=false;

const loader =
new GLTFLoader();


function loadModel(){

    loader.load(

        MODEL_URL,

        gltf=>{

            model=gltf.scene;

            model.traverse(
                object=>{

                    if(!object.isMesh)
                        return;

                    meshes.push(object);

                    object.material =
                        object.material.clone();

                    object.material.roughness=.65;

                    object.userData.originalMaterial =
                        object.material;

                    object.userData.originalVisible =
                        object.visible;

                }
            );


            /*
            BodyExplorer's model is already
            centered/scaled for browser viewing.
            */

            const box =
                new THREE.Box3()
                .setFromObject(model);

            const center =
                box.getCenter(
                    new THREE.Vector3()
                );

            const size =
                box.getSize(
                    new THREE.Vector3()
                );

            model.position.sub(center);

            const scale =
                3.9 /
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            model.scale.setScalar(scale);

            model.position.y=-1.3;


            scene.add(model);


            document.getElementById(
                "loading"
            ).style.display="none";

            createMuscleList();

        },

        progress=>{

            if(progress.total){

                const percent =
                    progress.loaded /
                    progress.total *
                    100;

                document.getElementById(
                    "progress"
                ).style.width =
                    percent+"%";
            }

        },

        error=>{

            console.error(error);

            document.querySelector(
                ".loading-text"
            ).textContent =
                "Das 3D-Modell konnte nicht geladen werden.";

        }

    );

}

loadModel();


/*
===========================================================
ANATOMICAL NAME CLEANUP
===========================================================
*/

function germanName(name){

    const n =
        name.toLowerCase();

    const map=[

        ["gluteus maximus",
        "Großer Gesäßmuskel"],

        ["gluteus medius",
        "Mittlerer Gesäßmuskel"],

        ["gluteus minimus",
        "Kleiner Gesäßmuskel"],

        ["latissimus dorsi",
        "Latissimus"],

        ["trapezius",
        "Trapezmuskel"],

        ["pectoralis major",
        "Großer Brustmuskel"],

        ["pectoralis minor",
        "Kleiner Brustmuskel"],

        ["biceps brachii",
        "Bizeps"],

        ["triceps brachii",
        "Trizeps"],

        ["brachialis",
        "Brachialis"],

        ["deltoid",
        "Deltamuskel"],

        ["deltoideus",
        "Deltamuskel"],

        ["rectus abdominis",
        "Gerader Bauchmuskel"],

        ["external oblique",
        "Äußerer schräger Bauchmuskel"],

        ["internal oblique",
        "Innerer schräger Bauchmuskel"],

        ["erector spinae",
        "Rückenstrecker"],

        ["rhomboid",
        "Rhomboiden"],

        ["teres major",
        "Großer Rundmuskel"],

        ["teres minor",
        "Kleiner Rundmuskel"],

        ["quadriceps",
        "Quadrizeps"],

        ["vastus lateralis",
        "Äußerer Oberschenkelmuskel"],

        ["vastus medialis",
        "Innerer Oberschenkelmuskel"],

        ["rectus femoris",
        "Gerader Oberschenkelmuskel"],

        ["hamstring",
        "Oberschenkelrückseite"],

        ["biceps femoris",
        "Bizeps femoris"],

        ["gastrocnemius",
        "Zwillingswadenmuskel"],

        ["soleus",
        "Schollenmuskel"],

        ["tibialis anterior",
        "Vorderer Schienbeinmuskel"]

    ];

    for(
        const [english,german]
        of map
    ){

        if(n.includes(english))
            return german;
    }

    return name
        .replaceAll("_"," ")
        .replaceAll("-"," ");

}


/*
===========================================================
GROUP CLASSIFICATION
===========================================================
*/

function groupOf(name){

    const n =
        name.toLowerCase();

    if(
        /pectoralis|chest/.test(n)
    )
        return "Brust";

    if(
        /latissimus|trapezius|rhomboid|erector|teres|multifidus|back/.test(n)
    )
        return "Rücken";

    if(
        /deltoid|supraspinatus|infraspinatus/.test(n)
    )
        return "Schultern";

    if(
        /biceps brachii|triceps|brachialis|coracobrachialis/.test(n)
    )
        return "Arme";

    if(
        /forearm|flexor|extensor|pronator|supinator/.test(n)
    )
        return "Arme";

    if(
        /rectus abdominis|oblique|transversus abdominis/.test(n)
    )
        return "Bauch";

    if(
        /gluteus|piriformis/.test(n)
    )
        return "Gesäß";

    if(
        /quadriceps|vastus|femoris|hamstring|adductor|sartorius/.test(n)
    )
        return "Beine";

    if(
        /gastrocnemius|soleus|tibialis|calf/.test(n)
    )
        return "Beine";

    return "Ganzkörper";
}


/*
===========================================================
EXERCISES
===========================================================
*/

const exerciseData={

    "Brust":[
        ["Bankdrücken","Brust"],
        ["Schrägbankdrücken","Brust"],
        ["Dips","Brust"],
        ["Butterfly","Brust"]
    ],

    "Rücken":[
        ["Klimmzüge","Rücken"],
        ["Latzug","Rücken"],
        ["Langhantelrudern","Rücken"],
        ["Kabelrudern","Rücken"]
    ],

    "Schultern":[
        ["Schulterdrücken","Schultern"],
        ["Seitheben","Schultern"],
        ["Reverse Flys","Schultern"]
    ],

    "Arme":[
        ["Bizeps-Curls","Arme"],
        ["Hammer Curls","Arme"],
        ["Trizepsdrücken","Arme"],
        ["French Press","Arme"]
    ],

    "Bauch":[
        ["Crunches","Bauch"],
        ["Hanging Leg Raises","Bauch"],
        ["Cable Crunches","Bauch"],
        ["Ab Wheel","Bauch"]
    ],

    "Beine":[
        ["Kniebeugen","Beine"],
        ["Beinpresse","Beine"],
        ["Beinstrecker","Beine"],
        ["Beinbeuger","Beine"],
        ["Wadenheben","Beine"]
    ],

    "Gesäß":[
        ["Hip Thrust","Gesäß"],
        ["Kniebeugen","Gesäß"],
        ["Bulgarian Split Squats","Gesäß"]
    ],

    "Ganzkörper":[
        ["Kniebeugen","Beine"],
        ["Bankdrücken","Brust"],
        ["Klimmzüge","Rücken"],
        ["Schulterdrücken","Schultern"]
    ]

};


/*
===========================================================
MUSCLE LIST
===========================================================
*/

const muscleContainer =
document.getElementById("muscles");

let currentGroup="Ganzkörper";


function getGroupMeshes(group){

    return meshes.filter(
        mesh=>{

            const name =
                mesh.name ||
                mesh.userData?.name ||
                "";

            return group==="Ganzkörper" ||
                groupOf(name)===group;

        }
    );

}


function createMuscleList(){

    renderMuscleList(
        getGroupMeshes(
            currentGroup
        )
    );

    renderExercises(
        currentGroup
    );

}


function renderMuscleList(list){

    muscleContainer.innerHTML="";

    const unique=new Map();

    list.forEach(
        mesh=>{

            const name =
                germanName(
                    mesh.name ||
                    "Unbekannte Struktur"
                );

            if(!unique.has(name))
                unique.set(name,mesh);

        }
    );


    Array.from(
        unique.entries()
    )
    .sort(
        (a,b)=>
            a[0].localeCompare(
                b[0],
                "de"
            )
    )
    .forEach(
        ([name,mesh])=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className="muscle";

            button.innerHTML=`
                <span>${name}</span>
                <span class="muscle-dot"></span>
            `;

            button.onclick=()=>{

                selectMesh(
                    mesh,
                    name
                );

            };

            muscleContainer.appendChild(
                button
            );

        }
    );

}


function renderExercises(group){

    const box =
        document.getElementById(
            "exercises"
        );

    box.innerHTML="";

    (
        exerciseData[group] ||
        exerciseData.Ganzkörper
    ).forEach(
        exercise=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className="exercise";

            div.innerHTML=`
                <strong>${exercise[0]}</strong>
                <small>${exercise[1]}</small>
            `;

            box.appendChild(div);

        }
    );

}


/*
===========================================================
SELECT MUSCLE
===========================================================
*/

const highlightMaterial =
new THREE.MeshStandardMaterial({
    color:0xef4444,
    emissive:0x3d0000,
    emissiveIntensity:1,
    roughness:.5,
    metalness:0
});


function selectMesh(mesh,name){

    selected.forEach(
        m=>{

            if(m.userData.originalMaterial)
                m.material =
                    m.userData.originalMaterial;

        }
    );

    selected=[mesh];

    mesh.material =
        highlightMaterial;

    mesh.visible=true;

    document.getElementById(
        "info"
    ).innerHTML=`

        <h3>${name}</h3>

        <p>
            Anatomische Struktur aus dem
            3D-Modell.
        </p>

        <div class="action-row">

            <button
                class="action"
                id="hideSelected"
            >
                Ausblenden
            </button>

            <button
                class="action"
                id="transparentSelected"
            >
                Transparent
            </button>

        </div>

    `;


    document.getElementById(
        "hideSelected"
    ).onclick=()=>{

        mesh.visible=false;

    };


    document.getElementById(
        "transparentSelected"
    ).onclick=()=>{

        mesh.material =
            mesh.userData.originalMaterial
            .clone();

        mesh.material.transparent=true;
        mesh.material.opacity=.18;

    };


    focusMesh(mesh);

}


/*
===========================================================
CAMERA FOCUS
===========================================================
*/

function focusMesh(mesh){

    const box =
        new THREE.Box3()
        .setFromObject(mesh);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    const distance =
        Math.max(
            2.2,
            max*5
        );

    const direction =
        new THREE.Vector3(
            0,
            .15,
            1
        )
        .normalize();

    camera.position.copy(
        center.clone()
        .add(
            direction.multiplyScalar(
                distance
            )
        )
    );

    controls.target.copy(center);

    controls.update();

}


/*
===========================================================
NAVIGATION
===========================================================
*/

document.querySelectorAll(
    "#groups button"
).forEach(
    button=>{

        button.onclick=()=>{

            document.querySelectorAll(
                "#groups button"
            ).forEach(
                b=>b.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            currentGroup =
                button.dataset.group;

            document.getElementById(
                "currentGroup"
            ).textContent =
                currentGroup;

            createMuscleList();

        };

    }
);


/*
===========================================================
SEARCH
===========================================================
*/

document.getElementById(
    "search"
).addEventListener(
    "input",
    event=>{

        const query =
            event.target.value
            .toLowerCase()
            .trim();

        const list =
            getGroupMeshes(
                currentGroup
            ).filter(
                mesh=>
                    germanName(
                        mesh.name
                    )
                    .toLowerCase()
                    .includes(query) ||
                    mesh.name
                    .toLowerCase()
                    .includes(query)
            );

        renderMuscleList(list);

    }
);


/*
===========================================================
CAMERA VIEWS
===========================================================
*/

function cameraView(
    position
){

    camera.position.set(
        ...position
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


document.getElementById(
    "front"
).onclick=()=>{

    cameraView(
        [0,1.4,6]
    );

};


document.getElementById(
    "back"
).onclick=()=>{

    cameraView(
        [0,1.4,-6]
    );

};


document.getElementById(
    "side"
).onclick=()=>{

    cameraView(
        [6,1.4,0]
    );

};


document.getElementById(
    "reset"
).onclick=()=>{

    cameraView(
        [0,1.5,5.8]
    );

};


/*

ZOOM
===========================================================
*/

document.getElementById(
    "zoomIn"
).onclick=()=>{

    camera.position.multiplyScalar(.82);

};


document.getElementById(
    "zoomOut"
).onclick=()=>{

/*

MOBILE MENU

*/

document.getElementById(

).onclick=()=>{

        "sidebar"
    ).classList.toggle(

    );

};


/*
===========================================================
CLICK ON 3D MODEL
===========================================================
*/

const raycaster =
new THREE.Raycaster();

const mouse =
new THREE.Vector2();


renderer.domElement.addEventListener(
    "pointerdown",
    event=>{

        const rect =
            renderer.domElement
            .getBoundingClientRect();

        mouse.x =
            ((event.clientX -
            rect.left) /
            rect.width)*2-1;

        mouse.y =
            -((event.clientY -
            rect.top) /
            rect.height)*2+1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits =
            raycaster.intersectObjects(
                meshes,
                true
            );

        if(!hits.length)
            return;

        let object =
            hits[0].object;

        while(
            object &&
            !object.isMesh
        ){
            object =
                object.parent;
        }

        if(!object)
            return;

        selectMesh(
            object,
            germanName(
                object.name
            )
        );

    }
);

/*
===========================================================
RESIZE
===========================================================
*/

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            container.clientWidth /
            container.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            container.clientWidth,
            container.clientHeight
        );

    }
);


/*
===========================================================
ANIMATION
===========================================================
*/

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>Muscle3D – Anatomie & Training</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#08090c;
    color:#fff;
    overflow:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

#app{
    width:100vw;
    height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:290px;
    background:#101217;
    border-right:1px solid #242831;
    padding:22px;
    z-index:10;
    overflow-y:auto;
}

.logo{
    font-size:25px;
    font-weight:800;
    margin-bottom:5px;
}

.logo span{
    color:#ff3b30;
}

.subtitle{
    color:#777d88;
    font-size:12px;
    margin-bottom:28px;
}

.menu-title{
    color:#666c77;
    text-transform:uppercase;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
    margin:20px 0 9px;
}

.menu button{
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    color:#bfc3ca;
    padding:11px 13px;
    border-radius:8px;
    margin-bottom:3px;
    font-size:14px;
    transition:.2s;
}

.menu button:hover,
.menu button.active{
    background:#1e222a;
    color:white;
}

.menu button.active{
    border-left:3px solid #ff3b30;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    position:relative;
    height:100vh;
}

#scene{
    width:100%;
    height:100%;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:absolute;
    left:25px;
    right:25px;
    top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
    pointer-events:none;
}

.view-title{
    background:rgba(13,15,19,.85);
    border:1px solid #292d35;
    padding:10px 15px;
    border-radius:10px;
    pointer-events:auto;
}

.view-title strong{
    display:block;
    font-size:15px;
}

.view-title small{
    color:#777d88;
}

.controls{
    display:flex;
    gap:8px;
    pointer-events:auto;
}

.control{
    border:1px solid #30343d;
    background:#11141a;
    color:white;
    padding:10px 13px;
    border-radius:8px;
    font-size:13px;
}

.control:hover{
    background:#20242c;
}

/* =========================
   RIGHT PANEL
========================= */

.right-panel{
    position:absolute;
    right:20px;
    top:90px;
    width:300px;
    max-height:calc(100vh - 120px);
    background:rgba(13,15,19,.94);
    border:1px solid #292d35;
    border-radius:14px;
    padding:17px;
    overflow-y:auto;
    z-index:5;
}

.panel-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:4px;
}

.panel-subtitle{
    color:#777d88;
    font-size:12px;
    margin-bottom:15px;
}

.muscle-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.muscle{
    border:1px solid #292d35;
    background:#171a20;
    border-radius:8px;
    padding:10px;
    color:#d7d9dd;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    transition:.2s;
}

.muscle:hover{
    background:#22262e;
    border-color:#ff3b30;
}

.muscle.selected{
    background:#38201f;
    border-color:#ff3b30;
    color:white;
}

.muscle .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ff3b30;
}

/* =========================
   EXERCISES
========================= */

.exercise-section{
    margin-top:22px;
}

.exercise-title{
    font-weight:bold;
    margin-bottom:9px;
}

.exercise{
    background:#171a20;
    border:1px solid #292d35;
    padding:10px;
    border-radius:8px;
    margin-bottom:6px;
}

.exercise strong{
    display:block;
    font-size:13px;
}

.exercise span{
    color:#777d88;
    font-size:11px;
}

/* =========================
   LABEL TOGGLE
========================= */

.label-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:15px;
    color:#aaa;
    font-size:12px;
}

input[type="checkbox"]{
    accent-color:#ff3b30;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .sidebar{
        width:210px;
        padding:15px;
    }

    .right-panel{
        width:250px;
    }
}

@media(max-width:700px){

    .sidebar{
        position:absolute;
        left:-250px;
        height:100%;
        transition:.3s;
    }

    .sidebar.open{
        left:0;
    }

    .right-panel{
        width:calc(100% - 30px);
        right:15px;
        top:auto;
        bottom:15px;
        max-height:40vh;
    }

    .topbar{
        left:15px;
        right:15px;
    }

    .mobile-menu{
        display:block!important;
    }
}

.mobile-menu{
    display:none;
}
</style>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    CSS2DRenderer,
    CSS2DObject
} from "three/addons/renderers/CSS2DRenderer.js";


/* =========================================================
   SCENE
========================================================= */

const container = document.getElementById("scene");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x08090c);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    100
);

camera.position.set(
    0,
    1.8,
    7
);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.shadowMap.enabled = true;

container.appendChild(renderer.domElement);


/* LABEL RENDERER */

const labelRenderer = new CSS2DRenderer();

labelRenderer.setSize(
    container.clientWidth,
    container.clientHeight
);

labelRenderer.domElement.style.position="absolute";
labelRenderer.domElement.style.top="0";
labelRenderer.domElement.style.pointerEvents="none";

container.appendChild(labelRenderer.domElement);


/* CONTROLS */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping=true;

controls.target.set(
    0,
    1.8,
    0
);

controls.minDistance=2.8;
controls.maxDistance=11;


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x222222,
        2
    )
);

const keyLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

keyLight.position.set(
    4,
    7,
    5
);

keyLight.castShadow=true;

scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(
    0x999999,
    1.5
);

fillLight.position.set(
    -5,
    3,
    -3
);

scene.add(fillLight);


/* =========================================================
   FLOOR
========================================================= */

const floor = new THREE.Mesh(

    new THREE.CircleGeometry(
        4,
        64
    ),

    new THREE.MeshStandardMaterial({
        color:0x101217,
        roughness:.9
    })

);

floor.rotation.x=-Math.PI/2;
floor.position.y=-1.25;

scene.add(floor);


/* =========================================================
   HUMAN MODEL
========================================================= */

const human = new THREE.Group();

scene.add(human);


/* MATERIALS */

const skinMaterial =
new THREE.MeshStandardMaterial({
    color:0xc58d72,
    roughness:.7
});

const muscleMaterial =
new THREE.MeshStandardMaterial({
    color:0xb92f35,
    roughness:.65,
    metalness:.05
});

const muscleHighlight =
new THREE.MeshStandardMaterial({
    color:0xff453f,
    emissive:0x300000
});


/* BODY PART HELPERS */

function sphere(
    name,
    position,
    scale,
    material=skinMaterial
){

    const geometry =
        new THREE.SphereGeometry(
            1,
            32,
            24
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.name=name;

    mesh.position.set(...position);

    mesh.scale.set(...scale);

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    human.add(mesh);

    return mesh;
}


function capsule(
    name,
    position,
    radius,
    length,
    material=skinMaterial,
    rotation=[0,0,0]
){

    const geometry =
        new THREE.CapsuleGeometry(
            radius,
            length,
            12,
            24
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.name=name;

    mesh.position.set(...position);

    mesh.rotation.set(...rotation);

    mesh.castShadow=true;

    human.add(mesh);

    return mesh;
}

/* =========================================================
   MUSCLES
========================================================= */

const muscles = {};


/*
   Creates visible muscle object
*/

function createMuscle(
    id,
    name,
    group,
    position,
    scale,
    exercises,
    rotation=[0,0,0]
){

    const mesh =
        sphere(
            name,
            position,
            scale,
            muscleMaterial
        );

    mesh.userData={
        id,
        name,
        group,
        exercises,
        originalMaterial:muscleMaterial
    };

    mesh.rotation.set(...rotation);

    muscles[id]=mesh;

    return mesh;
}

/* =========================================================
   LABELS
========================================================= */

const labels=[];

function addLabel(
    text,
    position,
    object
){

    const div=document.createElement("div");

    div.textContent=text;

    div.style.background="rgba(10,10,12,.85)";
    div.style.border="1px solid #ff3b30";
    div.style.color="white";
    div.style.padding="4px 7px";
    div.style.borderRadius="5px";
    div.style.fontSize="11px";
    div.style.whiteSpace="nowrap";

    const label=new CSS2DObject(div);

    label.position.set(...position);

    object.add(label);

    labels.push(label);
}


/* Add labels */

addLabel(
    "Brust",
    [-.75,.8,.25],
    muscles.pec_major
);

    [.5,.4,.2],

);

/* =========================================================
   UI
========================================================= */

const muscleList=
document.getElementById("muscleList");

const exerciseList=
document.getElementById("exerciseList");

const currentTitle=
document.getElementById("currentTitle");

const panelSubtitle=
document.getElementById("panelSubtitle");


function getMusclesByName(name){

    return Object.values(muscles).filter(
        m=>m.userData.name===name
    );

}


function showGroup(group){

    currentTitle.textContent=group;

    panelSubtitle.textContent=
        "Muskeln in diesem Bereich";

    muscleList.innerHTML="";

    const data=groupData[group];

    data.muscles.forEach(name=>{

        const button=
            document.createElement("button");

        button.className="muscle";

        button.innerHTML=`
            <span>${name}</span>
            <span class="dot"></span>
        `;

        button.onclick=()=>{

            const objects=
                getMusclesByName(name);

            highlightMuscles(objects);

        };

        muscleList.appendChild(button);

    });


    exerciseList.innerHTML="";

    data.exercises.forEach(ex=>{

        const div=
            document.createElement("div");

        div.className="exercise";

        div.innerHTML=`
            <strong>${ex[0]}</strong>
            <span>${ex[1]}</span>
        `;

        exerciseList.appendChild(div);

    });


    /* highlight group */

    Object.values(muscles).forEach(m=>{

        if(
            data.muscles.includes(
                m.userData.name
            )
        ){

            m.material=muscleMaterial;

        }else{

            m.material=
                new THREE.MeshStandardMaterial({
                    color:0x552326,
                    roughness:.7
                });

        }

    });

}


/* =========================================================
   HIGHLIGHT
========================================================= */

function highlightMuscles(objects){

    Object.values(muscles).forEach(
        m=>m.material=
            new THREE.MeshStandardMaterial({
                color:0x542124,
                roughness:.7
            })
    );


    objects.forEach(m=>{

        m.material=muscleHighlight;

    });

}


/* =========================================================
   MENU BUTTONS
========================================================= */

document.querySelectorAll(
    ".menu button[data-group]"
).forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document.querySelectorAll(
                ".menu button[data-group]"
            ).forEach(
                b=>b.classList.remove("active")
            );

            button.classList.add("active");

            showGroup(
                button.dataset.group
            );

            document.getElementById(
                "sidebar"
            ).classList.remove("open");

        }
    );

});


/* =========================================================
   LABEL VISIBILITY
========================================================= */

const labelsCheck=
document.getElementById("labelsCheck");

const labelsButton=
document.getElementById("labelsButton");

function updateLabels(){

    labels.forEach(
        l=>{
            l.element.style.display=
                labelsCheck.checked
                ?"block"
                :"none";
        }
    );

}

labelsCheck.addEventListener(
    "change",
    updateLabels
);

labelsButton.onclick=()=>{

    labelsCheck.checked=
        !labelsCheck.checked;

    updateLabels();

};

/* =========================================================
   CLICKABLE 3D MUSCLES
========================================================= */

const raycaster=
    new THREE.Raycaster();

const mouse=
    new THREE.Vector2();

renderer.domElement.addEventListener(
    "pointerdown",
    event=>{

        mouse.x=
            (event.clientX/
            renderer.domElement.clientWidth)*2-1;

        mouse.y=
            -(event.clientY/
            renderer.domElement.clientHeight)*2+1;

        raycaster.setFromCamera(
            mouse,
            camera
        );

        const hits=
            raycaster.intersectObjects(
                Object.values(muscles)
            );

        if(hits.length){

            const muscle=
                hits[0].object;

            highlightMuscles([
                muscle
            ]);

            panelSubtitle.textContent=
                muscle.userData.name;

        }

    }
);

   INITIAL
========================================================= */

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );

    labelRenderer.render(
        scene,
        camera
    );

}

animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            container.clientWidth/
            container.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            container.clientWidth,
            container.clientHeight
        );

        labelRenderer.setSize(
            container.clientWidth,
            container.clientHeight
        );

    }
);

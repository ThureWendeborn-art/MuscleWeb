<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuscleWeb</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #080b10;
  color: #f2f4f7;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
}

/* SIDEBAR */

#sidebar {
  width: 310px;
  min-width: 310px;
  height: 100%;
  background: #0e1218;
  border-right: 1px solid #242b35;
  display: flex;
  flex-direction: column;
  z-index: 20;
}

.logo {
  padding: 22px 20px 18px;
  border-bottom: 1px solid #242b35;
}

.logo h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.5px;
}

.logo p {
  margin: 5px 0 0;
  color: #7f8a99;
  font-size: 12px;
}

.search {
  padding: 15px;
  border-bottom: 1px solid #242b35;
}

.search input {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid #2c3541;
  border-radius: 8px;
  background: #151a22;
  color: white;
  outline: none;
}

.search input:focus {
  border-color: #667385;
}

.section-title {
  padding: 16px 15px 8px;
  font-size: 11px;
  color: #778292;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.groups {
  padding: 0 10px;
}

.group {
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: #b8c0cc;
  padding: 10px 12px;
  border-radius: 7px;
  margin-bottom: 2px;
}

.group:hover,
.group.active {
  background: #1b222c;
  color: white;
}

.muscle-list {
  overflow-y: auto;
  padding: 0 10px 20px;
  flex: 1;
}

.muscle-item {
  padding: 9px 11px;
  margin-bottom: 3px;
  border-radius: 7px;
  background: transparent;
  color: #b8c0cc;
  cursor: pointer;
  font-size: 13px;
}

.muscle-item:hover {
  background: #1a2029;
  color: white;
}

.muscle-item.selected {
  background: #26303c;
  color: white;
}

/* VIEWER */

#viewer {
  position: relative;
  flex: 1;
  height: 100%;
  min-width: 0;
}

#canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.topbar {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
  z-index: 5;
}

.topbar > * {
  pointer-events: auto;
}

.status {
  padding: 9px 13px;
  border: 1px solid #28313c;
  border-radius: 8px;
  background: rgba(12,16,22,.9);
  color: #aeb8c5;
  font-size: 12px;
}

.controls {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.control {
  border: 1px solid #303945;
  background: rgba(14,18,24,.94);
  color: #cbd2db;
  padding: 8px 11px;
  border-radius: 7px;
  font-size: 12px;
}

.control:hover {
  background: #202832;
  color: white;
}

.bottom-controls {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
  z-index: 5;
}

.bottom-controls button {
  width: 38px;
  height: 38px;
  border: 1px solid #303945;
  border-radius: 8px;
  background: rgba(14,18,24,.94);
  color: white;
}

/* INFO PANEL */

#info {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 290px;
  max-width: calc(100% - 36px);
  background: rgba(14,18,24,.96);
  border: 1px solid #303945;
  border-radius: 10px;
  padding: 17px;
  z-index: 6;
  display: none;
}

#info.show {
  display: block;
}

#info h2 {
  margin: 0 0 6px;
  font-size: 18px;
}

#info .type {
  color: #7f8a99;
  font-size: 12px;
  margin-bottom: 13px;
}

.exercise-title {
  color: #aeb8c5;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 7px;
}

.exercise {
  padding: 8px 10px;
  background: #171d25;
  border-radius: 6px;
  margin-bottom: 5px;
  font-size: 12px;
}

.close-info {
  position: absolute;
  top: 9px;
  right: 10px;
  background: transparent;
  border: 0;
  color: #7f8a99;
  font-size: 18px;
}

/* LOADING */

#loading {
  position: absolute;
  inset: 0;
  background: #080b10;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 50;
}

#loading h2 {
  margin: 0 0 8px;
}

#loading p {
  margin: 0;
  color: #7f8a99;
  font-size: 13px;
}

.loader {
  width: 180px;
  height: 3px;
  background: #202631;
  margin-top: 20px;
  overflow: hidden;
  border-radius: 4px;
}

.loader div {
  height: 100%;
  width: 40%;
  background: #d9dee5;
  animation: loading 1.1s infinite;
}

@keyframes loading {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(450%); }
}

/* MOBILE */

#mobileMenu {
  display: none;
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 30;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: 1px solid #303945;
  background: #10151c;
  color: white;
}

@media(max-width: 800px) {
  #sidebar {
    position: absolute;
    left: 0;
    top: 0;
    transform: translateX(-100%);
    transition: transform .2s ease;
    z-index: 25;
    box-shadow: 10px 0 30px rgba(0,0,0,.35);
  }

  #sidebar.open {
    transform: translateX(0);
  }

  #mobileMenu {
    display: block;
  }

  .topbar {
    left: 65px;
  }

  .status {
    display: none;
  }

  .controls .control:nth-child(n+4) {
    display: none;
  }

  #info {
    bottom: 70px;
  }
}
</style>
</head>

<body>

<div id="app">

  <aside id="sidebar">

    <div class="logo">
      <h1>MuscleWeb</h1>
      <p>3D Muscular Anatomy</p>
    </div>

    <div class="search">
      <input id="search" type="text" placeholder="Muskel suchen...">
    </div>

    <div class="section-title">Körperregionen</div>

    <div class="groups">
      <button class="group active" data-group="all">Ganzkörper</button>
      <button class="group" data-group="chest">Brust</button>
      <button class="group" data-group="back">Rücken</button>
      <button class="group" data-group="shoulders">Schultern</button>
      <button class="group" data-group="arms">Arme</button>
      <button class="group" data-group="abs">Bauch</button>
      <button class="group" data-group="glutes">Gesäß</button>
      <button class="group" data-group="legs">Beine</button>
    </div>

    <div class="section-title">Muskeln</div>

    <div id="muscleList" class="muscle-list"></div>

  </aside>

  <main id="viewer">

    <button id="mobileMenu">☰</button>

    <div class="topbar">

      <div class="status" id="status">
        Modell wird geladen...
      </div>

      <div class="controls">
        <button class="control" id="front">Vorne</button>
        <button class="control" id="back">Hinten</button>
        <button class="control" id="side">Seite</button>
        <button class="control" id="reset">Reset</button>
      </div>

    </div>

    <canvas id="canvas"></canvas>

    <div class="bottom-controls">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
    </div>

    <div id="info">

      <button class="close-info" id="closeInfo">×</button>

      <h2 id="infoName">Muskel</h2>

      <div class="type" id="infoType">
        Muskel
      </div>

      <div class="exercise-title">
        Übungen
      </div>

      <div id="exerciseList"></div>

    </div>

    <div id="loading">
      <h2>MuscleWeb</h2>
      <p id="loadingText">3D-Modell wird geladen...</p>

      <div class="loader">
        <div></div>
      </div>
    </div>

  </main>

</div>


<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>


<script>
/*
  MUSCLEWEB
  Uses the open BodyExplorer anatomy model.

  Source:
  Johan Bellander - BodyExplorer
  BodyParts3D
  Z-Anatomy
*/


const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/JohanBellander/BodyExplorer@main/public/anatomy.glb";

const SKELETON_URL =
  "https://cdn.jsdelivr.net/gh/JohanBellander/BodyExplorer@main/public/skeleton.glb";

const MAPPING_URL =
  "https://cdn.jsdelivr.net/gh/JohanBellander/BodyExplorer@main/public/mesh_mapping.json";


/* --------------------------------------------------
   DOM
-------------------------------------------------- */

const canvas = document.getElementById("canvas");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const status = document.getElementById("status");
const muscleList = document.getElementById("muscleList");
const info = document.getElementById("info");
const infoName = document.getElementById("infoName");
const infoType = document.getElementById("infoType");
const exerciseList = document.getElementById("exerciseList");


/* --------------------------------------------------
   THREE SETUP
-------------------------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x080b10);

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);

camera.position.set(0, 0, 4.2);


const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth - 310,
  window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;


/* --------------------------------------------------
   LIGHTING
-------------------------------------------------- */

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x18202a,
  2.2
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
  0xffffff,
  2.5
);

keyLight.position.set(
  3,
  5,
  5
);

scene.add(keyLight);


const fillLight = new THREE.DirectionalLight(
  0x9fb6d3,
  1.1
);

fillLight.position.set(
  -4,
  2,
  2
);

scene.add(fillLight);


const rimLight = new THREE.DirectionalLight(
  0xffffff,
  1.4
);

rimLight.position.set(
  0,
  2,
  -5
);

scene.add(rimLight);


/* --------------------------------------------------
   CONTROLS
-------------------------------------------------- */

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.07;

controls.enablePan = true;

controls.minDistance = 1.2;
controls.maxDistance = 8;

controls.target.set(
  0,
  0,
  0
);


/* --------------------------------------------------
   MODEL
-------------------------------------------------- */

let anatomy = null;
let skeleton = null;

let allMeshes = [];

let selectedMesh = null;

let originalMaterials = new Map();

let meshNames = new Map();


/* --------------------------------------------------
   MUSCLE DATA
-------------------------------------------------- */

const muscleGroups = {

  chest: [
    "pector",
    "brust",
    "pectoralis"
  ],

  back: [
    "latissimus",
    "trapezius",
    "rhomboid",
    "erector",
    "multifidus",
    "back"
  ],

  shoulders: [
    "deltoid",
    "supraspinatus",
    "infraspinatus",
    "shoulder"
  ],

  arms: [
    "biceps",
    "triceps",
    "brachialis",
    "brachioradialis",
    "forearm",
    "flexor",
    "extensor"
  ],

  abs: [
    "rectus",
    "abdomin",
    "oblique",
    "transversus"
  ],

  glutes: [
    "gluteus",
    "gluteal"
  ],

  legs: [
    "quadriceps",
    "vastus",
    "femor",
    "hamstring",
    "biceps femoris",
    "sartorius",
    "gastrocnemius",
    "soleus",
    "tibialis",
    "adductor",
    "calf"
  ]

};


/* --------------------------------------------------
   EXERCISES
-------------------------------------------------- */

const exercises = {

  chest: [
    "Bankdrücken",
    "Schrägbankdrücken",
    "Dips",
    "Liegestütze"
  ],

  back: [
    "Klimmzüge",
    "Latzug",
    "Rudern",
    "Kreuzheben"
  ],

  shoulders: [
    "Schulterdrücken",
    "Seitheben",
    "Reverse Flys",
    "Frontheben"
  ],

  arms: [
    "Bizepscurls",
    "Hammer Curls",
    "Trizepsdrücken",
    "French Press"
  ],

  abs: [
    "Crunches",
    "Hanging Leg Raises",
    "Cable Crunches",
    "Plank"
  ],

  glutes: [
    "Hip Thrusts",
    "Bulgarian Split Squats",
    "Glute Bridges"
  ],

  legs: [
    "Kniebeugen",
    "Beinpresse",
    "Beinbeuger",
    "Beinstrecker",
    "Wadenheben"
  ]

};


/* --------------------------------------------------
   GERMAN NAME CONVERSION
-------------------------------------------------- */

const translations = {

  "pectoralis major":
    "Großer Brustmuskel",

  "pectoralis minor":
    "Kleiner Brustmuskel",

  "deltoid":
    "Deltamuskel",

  "biceps":
    "Bizeps",

  "triceps":
    "Trizeps",

  "brachialis":
    "Armbeuger",

  "trapezius":
    "Trapezmuskel",

  "latissimus":
    "Breiter Rückenmuskel",

  "rectus abdominis":
    "Gerader Bauchmuskel",

  "oblique":
    "Schräger Bauchmuskel",

  "gluteus maximus":
    "Großer Gesäßmuskel",

  "quadriceps":
    "Quadrizeps",

  "hamstring":
    "Oberschenkelbeuger",

  "gastrocnemius":
    "Zwillingswadenmuskel",

  "soleus":
    "Schollenmuskel"

};


/* --------------------------------------------------
   HELPERS
-------------------------------------------------- */

function cleanName(name) {

  if (!name) {
    return "Anatomische Struktur";
  }

  let lower = name
    .toLowerCase()
    .replace(/[_-]/g, " ");

  for (const key in translations) {

    if (lower.includes(key)) {
      return translations[key];
    }

  }

  return name
    .replace(/[_-]/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());

}


function detectGroup(name) {

  const n = name.toLowerCase();

  for (const group in muscleGroups) {

    for (const keyword of muscleGroups[group]) {

      if (n.includes(keyword)) {
        return group;
      }

    }

  }

  return "all";
}


/* --------------------------------------------------
   BODYEXPLORER COORDINATE TRANSFORM
-------------------------------------------------- */

function transformAnatomy(root) {

  const box = new THREE.Box3();

  root.updateMatrixWorld(true);

  root.traverse(obj => {

    if (!obj.isMesh) return;

    obj.geometry.computeBoundingBox();

    const b = obj.geometry.boundingBox;

    if (b) {

      const transformed = b.clone();

      transformed.applyMatrix4(obj.matrixWorld);

      box.union(transformed);

    }

  });


  const size = new THREE.Vector3();

  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);


  /*
    BodyExplorer normalizes the model height.
  */

  const targetHeight = 3.6;

  const scale =
    targetHeight / Math.max(size.x, size.y, size.z);


  root.scale.setScalar(scale);


  root.updateMatrixWorld(true);


  const newBox = new THREE.Box3()
    .setFromObject(root);

  const newCenter = new THREE.Vector3();

  newBox.getCenter(newCenter);


  root.position.sub(newCenter);


  /*
    Put feet slightly below the center
    so the model looks natural in the viewer.
  */

  const finalBox =
    new THREE.Box3().setFromObject(root);

  const finalCenter =
    new THREE.Vector3();

  finalBox.getCenter(finalCenter);

  root.position.y -= finalCenter.y;

}


/* --------------------------------------------------
   MATERIALS
-------------------------------------------------- */

function prepareMesh(mesh) {

  if (!mesh.material) return;

  originalMaterials.set(
    mesh.uuid,
    mesh.material
  );

  const material =
    mesh.material.clone();

  material.transparent = false;

  material.opacity = 1;

  material.side = THREE.DoubleSide;

  mesh.material = material;

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  allMeshes.push(mesh);

}


/* --------------------------------------------------
   LOAD MODEL
-------------------------------------------------- */

async function loadModel() {

  const loader =
    new THREE.GLTFLoader();


  try {

    loadingText.textContent =
      "Lade 3D-Muskelmodell...";


    const gltf =
      await new Promise((resolve, reject) => {

        loader.load(
          MODEL_URL,
          resolve,
          xhr => {

            if (xhr.total) {

              const percent =
                Math.round(
                  xhr.loaded /
                  xhr.total *
                  100
                );

              loadingText.textContent =
                "3D-Modell wird geladen... " +
                percent +
                "%";

            }

          },
          reject
        );

      });


    anatomy = gltf.scene;


    /*
      Apply model transform.
    */

    transformAnatomy(anatomy);


    anatomy.traverse(mesh => {

      if (!mesh.isMesh) return;

      prepareMesh(mesh);

      meshNames.set(
        mesh.uuid,
        cleanName(mesh.name)
      );

    });


    scene.add(anatomy);


    status.textContent =
      allMeshes.length +
      " anatomische Strukturen geladen";


    createMuscleList();


    loadingText.textContent =
      "Modell geladen";


    setTimeout(() => {

      loading.style.display =
        "none";

    }, 500);


  } catch (error) {

    console.error(error);

    loadingText.innerHTML =
      "Das 3D-Modell konnte nicht geladen werden.<br><br>" +
      "Bitte Seite neu laden.";

    status.textContent =
      "Fehler beim Laden des Modells";

  }

}


/* --------------------------------------------------
   MAPPING
-------------------------------------------------- */

async function loadMapping() {

  try {

    const response =
      await fetch(MAPPING_URL);

    if (!response.ok) return;

    const data =
      await response.json();

    console.log(
      "Mesh-Mapping geladen:",
      data
    );

  } catch (e) {

    console.log(
      "Mesh-Mapping optional nicht geladen."
    );

  }

}


/* --------------------------------------------------
   MUSCLE LIST
-------------------------------------------------- */

let currentGroup = "all";


function createMuscleList() {

  muscleList.innerHTML = "";

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allMeshes.filter(mesh => {

      const name =
        meshNames.get(mesh.uuid) ||
        cleanName(mesh.name);

      const raw =
        mesh.name.toLowerCase();

      const group =
        detectGroup(raw);


      const matchesGroup =
        currentGroup === "all" ||
        group === currentGroup;


      const matchesSearch =
        !search ||
        name.toLowerCase()
          .includes(search) ||
        raw.includes(search);


      return matchesGroup &&
             matchesSearch;

    });


  /*
    Do not display hundreds of structures
    at once in the sidebar.
  */

  filtered
    .slice(0, 180)
    .forEach(mesh => {

      const item =
        document.createElement("div");

      item.className =
        "muscle-item";

      item.textContent =
        meshNames.get(mesh.uuid) ||
        cleanName(mesh.name);

      item.onclick = () => {

        selectMesh(mesh);

        focusMesh(mesh);

      };

      muscleList.appendChild(item);

    });


  if (filtered.length > 180) {

    const more =
      document.createElement("div");

    more.style.padding =
      "10px";

    more.style.color =
      "#697585";

    more.style.fontSize =
      "11px";

    more.textContent =
      "+" +
      (filtered.length - 180) +
      " weitere Strukturen";

    muscleList.appendChild(more);

  }

}


/* --------------------------------------------------
   SELECT MESH
-------------------------------------------------- */

function selectMesh(mesh) {

  if (selectedMesh) {

    const old =
      originalMaterials.get(
        selectedMesh.uuid
      );

    if (old) {

      selectedMesh.material =
        old.clone();

    }

  }


  selectedMesh = mesh;


  /*
    Create highlighted material.
  */

  const material =
    mesh.material.clone();


  material.color =
    new THREE.Color(
      0xff5b5b
    );

  material.emissive =
    new THREE.Color(
      0x551111
    );

  material.emissiveIntensity =
    0.65;


  mesh.material =
    material;


  const name =
    meshNames.get(mesh.uuid) ||
    cleanName(mesh.name);


  showInfo(
    name,
    mesh.name
  );


  document
    .querySelectorAll(".muscle-item")
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

      if (
        el.textContent === name
      ) {

        el.classList.add(
          "selected"
        );

      }

    });

}


/* --------------------------------------------------
   FOCUS CAMERA
-------------------------------------------------- */

function focusMesh(mesh) {

  const box =
    new THREE.Box3()
      .setFromObject(mesh);

  const center =
    new THREE.Vector3();

  const size =
    new THREE.Vector3();

  box.getCenter(center);
  box.getSize(size);


  controls.target.copy(center);


  const maxSize =
    Math.max(
      size.x,
      size.y,
      size.z
    );


  const distance =
    Math.max(
      0.45,
      maxSize * 3
    );


  const direction =
    new THREE.Vector3()
      .subVectors(
        camera.position,
        controls.target
      )
      .normalize();


  camera.position.copy(
    center.clone()
      .add(
        direction.multiplyScalar(
          distance
        )
      )
  );


  controls.update();

}


/* --------------------------------------------------
   INFO
-------------------------------------------------- */

function showInfo(name, rawName) {

  infoName.textContent =
    name;

  const group =
    detectGroup(
      rawName.toLowerCase()
    );


  const groupNames = {

    chest: "Brust",
    back: "Rücken",
    shoulders: "Schultern",
    arms: "Arme",
    abs: "Bauch",
    glutes: "Gesäß",
    legs: "Beine",
    all: "Anatomische Struktur"

  };


  infoType.textContent =
    groupNames[group] ||
    "Anatomische Struktur";


  exerciseList.innerHTML = "";


  let list =
    exercises[group];


  if (!list) {

    list = [
      "Keine Übungen hinterlegt"
    ];

  }


  list.forEach(exercise => {

    const div =
      document.createElement("div");

    div.className =
      "exercise";

    div.textContent =
      exercise;

    exerciseList.appendChild(
      div
    );

  });


  info.classList.add("show");

}


/* --------------------------------------------------
   CLICK 3D MODEL
-------------------------------------------------- */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();


function pointerPosition(event) {

  const rect =
    renderer.domElement
      .getBoundingClientRect();


  mouse.x =
    ((event.clientX - rect.left) /
      rect.width) * 2 - 1;


  mouse.y =
    -((event.clientY - rect.top) /
      rect.height) * 2 + 1;

}


renderer.domElement.addEventListener(
  "pointerdown",
  event => {

    pointerPosition(event);

    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hits =
      raycaster.intersectObjects(
        allMeshes,
        true
      );


    if (!hits.length) return;


    let mesh =
      hits[0].object;


    while (
      mesh &&
      !mesh.isMesh
    ) {

      mesh = mesh.parent;

    }


    if (mesh) {

      selectMesh(mesh);

    }

  }
);


/* --------------------------------------------------
   CAMERA VIEWS
-------------------------------------------------- */

function frontView() {

  camera.position.set(
    0,
    0,
    4.2
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}


function backView() {

  camera.position.set(
    0,
    0,
    -4.2
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}


function sideView() {

  camera.position.set(
    4.2,
    0,
    0
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}


function resetView() {

  camera.position.set(
    0,
    0,
    4.2
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}


/* --------------------------------------------------
   BUTTONS
-------------------------------------------------- */

document
  .getElementById("front")
  .onclick = frontView;

document
  .getElementById("back")
  .onclick = backView;

document
  .getElementById("side")
  .onclick = sideView;

document
  .getElementById("reset")
  .onclick = resetView;


document
  .getElementById("zoomIn")
  .onclick = () => {

    camera.position.multiplyScalar(
      0.82
    );

  };


document
  .getElementById("zoomOut")
  .onclick = () => {

    camera.position.multiplyScalar(
      1.22
    );

  };


document
  .getElementById("closeInfo")
  .onclick = () => {

    info.classList.remove(
      "show"
    );

  };


/* --------------------------------------------------
   GROUP FILTERS
-------------------------------------------------- */

document
  .querySelectorAll(".group")
  .forEach(button => {

    button.onclick = () => {

      document
        .querySelectorAll(".group")
        .forEach(b =>
          b.classList.remove(
            "active"
          )
        );


      button.classList.add(
        "active"
      );


      currentGroup =
        button.dataset.group;


      createMuscleList();

    };

  });


/* --------------------------------------------------
   SEARCH
-------------------------------------------------- */

document
  .getElementById("search")
  .addEventListener(
    "input",
    createMuscleList
  );


/* --------------------------------------------------
   MOBILE MENU
-------------------------------------------------- */

document
  .getElementById("mobileMenu")
  .onclick = () => {

    document
      .getElementById("sidebar")
      .classList.toggle("open");

  };


/* --------------------------------------------------
   RESIZE
-------------------------------------------------- */

window.addEventListener(
  "resize",
  () => {

    const sidebarWidth =
      window.innerWidth > 800
        ? 310
        : 0;


    camera.aspect =
      (window.innerWidth - sidebarWidth) /
      window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth -
        sidebarWidth,
      window.innerHeight
    );

  }
);


/* --------------------------------------------------
   ANIMATION
-------------------------------------------------- */

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();


/* --------------------------------------------------
   START
-------------------------------------------------- */

loadMapping();

loadModel();

</script>

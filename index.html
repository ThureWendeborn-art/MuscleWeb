<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MuscleWeb</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080a0d;
    color: white;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
}

/* SIDEBAR */

#sidebar {
    width: 250px;
    min-width: 250px;
    height: 100%;
    background: #101318;
    border-right: 1px solid #292e36;
    padding: 22px 14px;
    overflow-y: auto;
    z-index: 20;
}

.logo {
    padding: 5px 10px 22px;
    border-bottom: 1px solid #292e36;
    margin-bottom: 18px;
}

.logo h1 {
    margin: 0;
    font-size: 25px;
}

.logo p {
    margin: 5px 0 0;
    color: #737b86;
    font-size: 11px;
}

.category-title {
    color: #68717c;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 15px 10px 8px;
    text-transform: uppercase;
}

.region {
    width: 100%;
    border: 0;
    background: transparent;
    color: #aeb5bd;
    text-align: left;
    padding: 11px 12px;
    border-radius: 7px;
    margin-bottom: 2px;
    cursor: pointer;
}

.region:hover {
    background: #1c2128;
    color: white;
}

.region.active {
    background: #292f38;
    color: white;
}

/* MAIN */

#main {
    flex: 1;
    min-width: 0;
    height: 100%;
    position: relative;
}

#viewer {
    position: absolute;
    inset: 0;
}

/* TOP */

#topbar {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 10;
}

#search {
    width: 330px;
    max-width: 45%;
    height: 42px;
    background: rgba(14,17,22,.95);
    border: 1px solid #303640;
    border-radius: 8px;
    padding: 0 13px;
    color: white;
    outline: none;
}

#search::placeholder {
    color: #6f7781;
}

.spacer {
    flex: 1;
}

.top-button {
    height: 42px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid #303640;
    background: rgba(14,17,22,.95);
    color: #d6dbe0;
    cursor: pointer;
}

.top-button.active {
    background: #e0e3e6;
    color: #111318;
}

/* MUSCLE LIST */

#muscle-panel {
    position: absolute;
    left: 16px;
    top: 70px;
    width: 275px;
    max-height: 55%;
    background: rgba(14,17,22,.96);
    border: 1px solid #2d333b;
    border-radius: 10px;
    overflow: hidden;
    z-index: 8;
}

.panel-header {
    padding: 14px;
    border-bottom: 1px solid #2b3037;
}

.panel-title {
    font-size: 16px;
    font-weight: bold;
}

.panel-count {
    margin-top: 5px;
    color: #68717c;
    font-size: 10px;
}

#muscle-list {
    max-height: 350px;
    overflow-y: auto;
}

.muscle {
    padding: 10px 14px;
    border-bottom: 1px solid #20252b;
    color: #aeb5bd;
    font-size: 12px;
    cursor: pointer;
}

.muscle:hover,
.muscle.selected {
    background: #292f38;
    color: white;
}

/* VIEW BUTTONS */

#view-buttons {
    position: absolute;
    right: 16px;
    top: 72px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 8;
}

.view-button {
    width: 48px;
    height: 39px;
    border-radius: 7px;
    border: 1px solid #303640;
    background: rgba(14,17,22,.95);
    color: #d3d8dd;
    cursor: pointer;
}

/* DETAIL */

#detail {
    position: absolute;
    right: 16px;
    bottom: 16px;
    width: 300px;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #2d333b;
    background: rgba(14,17,22,.97);
    display: none;
    z-index: 12;
}

#detail-name {
    font-size: 18px;
    font-weight: bold;
}

#detail-region {
    color: #6d7681;
    font-size: 11px;
    margin-top: 4px;
}

.detail-text {
    color: #929aa4;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 12px;
}

.detail-buttons {
    display: flex;
    gap: 7px;
    margin-top: 12px;
}

.detail-button {
    flex: 1;
    padding: 9px 5px;
    border-radius: 7px;
    border: 1px solid #343b44;
    background: #1b2027;
    color: #d9dde1;
    cursor: pointer;
}

.detail-button.main {
    background: #dfe2e5;
    color: #111318;
}

/* LOADING */

#loading {
    position: absolute;
    inset: 0;
    background: #080a0d;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.loading-box {
    width: 400px;
    max-width: 85%;
    text-align: center;
}

.loading-title {
    font-size: 22px;
    font-weight: bold;
}

#loading-text {
    margin-top: 8px;
    color: #707985;
    font-size: 12px;
}

.progress {
    height: 5px;
    background: #1d2228;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 20px;
}

#progress-bar {
    width: 0%;
    height: 100%;
    background: #dfe2e5;
}

/* MOBILE */

#mobile-menu {
    display: none;
}

@media (max-width: 800px) {

    #sidebar {
        position: absolute;
        left: -260px;
        transition: left .2s;
        box-shadow: 10px 0 30px rgba(0,0,0,.5);
    }

    #sidebar.open {
        left: 0;
    }

    #mobile-menu {
        display: block;
        position: absolute;
        top: 14px;
        left: 14px;
        width: 42px;
        height: 42px;
        z-index: 30;
        border: 1px solid #303640;
        border-radius: 8px;
        background: #101318;
        color: white;
    }

    #topbar {
        left: 67px;
    }

    #search {
        max-width: 40%;
    }

    #muscle-panel {
        width: 240px;
        max-height: 40%;
    }
}
</style>
</head>

<body>

<div id="app">

    <aside id="sidebar">

        <div class="logo">
            <h1>MuscleWeb</h1>
            <p>3D Human Anatomy Explorer</p>
        </div>

        <div class="category-title">

        </div>

        <button class="region active" data-region="all">

        </button>

        <button class="region" data-region="shoulders">

        </button>

        <button class="region" data-region="arms">

        </button>

        <button class="region" data-region="abs">

        </button>

        <button class="region" data-region="legs">
            Beine
        </button>

        <button class="region" data-region="glutes">

        </button>

    </aside>


    <main id="main">

        <button id="mobile-menu">☰</button>

        <div id="viewer"></div>


        <div id="topbar">

            <input
                id="search"

            >

            <div class="spacer"></div>

            <button class="view-button" id="front">

            </button>

            </button>

            <button class="view-button" id="side">

            </button>

            </button>

        <div id="muscle-panel">

            <div class="panel-header">

                <div

                    id="panel-title"

                    Ganzkörper
                </div>

                <div
                    class="panel-count"
                    id="panel-count"
                >

                </div>

            </div>

            <div id="muscle-list"></div>

        </div>


        <div id="detail">

            <div id="detail-name">
                Muskel
            </div>

            <div id="detail-region">
                Körperregion
            </div>

            <div class="detail-text">
                Dieser Muskel wurde ausgewählt.
            </div>

            <div class="detail-buttons">

                <button
                    class="detail-button main"
                    id="focus"
                >
                    Fokussieren
                </button>

                <button
                    class="detail-button"
                    id="isolate"

                    Isolieren
                </button>

            <div class="detail-buttons">

                <button
                    class="detail-button"
                    id="transparent"
                >
                    Durchsichtig
                </button>

                <button
                    class="detail-button"
                    id="show-all"
                >
                    Alles zeigen
                </button>

            </div>

        </div>

    </main>

</div>


<div id="loading">

    <div class="loading-box">

        <div class="loading-title">
            3D-Modell wird geladen
        </div>

        <div id="loading-text">
            Anatomie wird geladen...
        </div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>

    </div>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   GRUNDSETUP
===================================================== */

const viewer =
    document.getElementById("viewer");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x080a0d);


const camera =
    new THREE.PerspectiveCamera(
        45,
        viewer.clientWidth /
        viewer.clientHeight,
        0.01,
        1000
    );

camera.position.set(
    0,
    0,
    7
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

viewer.appendChild(
    renderer.domElement
);


/* =====================================================
   LICHT
===================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x333333,
        2.5
    );

scene.add(ambient);


const directional =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

directional.position.set(
    5,
    8,
    6
);

scene.add(directional);


const directional2 =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

directional2.position.set(
    -5,
    3,
    4
);

scene.add(directional2);


/* =====================================================
   KAMERA
===================================================== */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;
controls.dampingFactor = 0.07;

controls.minDistance = 0.2;
controls.maxDistance = 100;

controls.rotateSpeed = 0.7;
controls.zoomSpeed = 1.2;


/* =====================================================
   MODELLE
===================================================== */

let anatomy = null;
let skeleton = null;

let anatomyMeshes = [];

let selected = null;

let skeletonOn = false;

let currentRegion = "all";


/* =====================================================
   DEUTSCHE NAMEN
===================================================== */

const muscleNames = {

    pectoralismajor: "Großer Brustmuskel",
    pectoralisminor: "Kleiner Brustmuskel",

    deltoid: "Deltamuskel",
    deltoideus: "Deltamuskel",

    trapezius: "Trapezmuskel",

    latissimusdorsi: "Breiter Rückenmuskel",
    latissimus: "Breiter Rückenmuskel",

    rhomboid: "Rautenmuskel",

    erectorspinae: "Rückenstrecker",

    bicepsbrachii: "Bizeps",
    biceps: "Bizeps",

    tricepsbrachii: "Trizeps",
    triceps: "Trizeps",

    brachialis: "Armbeuger",
    brachioradialis: "Oberarm-Speichenmuskel",

    rectusabdominis: "Gerader Bauchmuskel",

    obliquusexternus: "Äußerer schräger Bauchmuskel",
    obliquusexternal: "Äußerer schräger Bauchmuskel",

    obliquusinternus: "Innerer schräger Bauchmuskel",
    obliquusinternal: "Innerer schräger Bauchmuskel",

    transversusabdominis: "Querer Bauchmuskel",

    serratusanterior: "Sägezahnmuskel",

    gluteusmaximus: "Großer Gesäßmuskel",
    gluteusmedius: "Mittlerer Gesäßmuskel",
    gluteusminimus: "Kleiner Gesäßmuskel",

    rectusfemoris: "Gerader Oberschenkelmuskel",
    vastuslateralis: "Äußerer Oberschenkelmuskel",
    vastusmedialis: "Innerer Oberschenkelmuskel",
    vastusintermedius: "Mittlerer Oberschenkelmuskel",

    quadriceps: "Quadrizeps",

    bicepsfemoris: "Bizeps femoris",

    semitendinosus: "Halbsehnenmuskel",
    semimembranosus: "Plattsehnenmuskel",

    sartorius: "Schneidermuskel",

    gastrocnemius: "Zwillingswadenmuskel",
    soleus: "Schollenmuskel",

    tibialisanterior: "Vorderer Schienbeinmuskel",
    tibialisposterior: "Hinterer Schienbeinmuskel",

    adductormagnus: "Großer Adduktor",
    adductorlongus: "Langer Adduktor",
    adductorbrevis: "Kurzer Adduktor",

    gracilis: "Schlanker Muskel",

    supraspinatus: "Obergrätenmuskel",
    infraspinatus: "Untergrätenmuskel",

    teresmajor: "Großer Rundmuskel",
    teresminor: "Kleiner Rundmuskel",

    sternocleidomastoideus: "Kopfwender",

    masseter: "Kaumuskel",
    temporalis: "Schläfenmuskel"
};


/* =====================================================
   NAMEN FUNKTION
===================================================== */

function getMuscleName(object) {

    const original =
        String(object.name || "");

    const clean =
        original
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");

    const keys =
        Object.keys(muscleNames)
        .sort(
            (a, b) =>
                b.length - a.length
        );

    for (const key of keys) {

        if (clean.includes(key)) {
            return muscleNames[key];
        }

    }

    /*
       Falls ein unbekannter Name vorkommt,
       wird er nicht mehr als englischer
       UI-Titel erzwungen.
    */

    return "Muskel";
}


/* =====================================================
   REGION
===================================================== */

function getRegion(object) {

    const text =
        String(object.name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");

    if (
        text.includes("pector")
    ) {
        return "chest";
    }

    if (
        text.includes("trapezi") ||
        text.includes("latiss") ||
        text.includes("rhombo") ||
        text.includes("erector")
    ) {
        return "back";
    }

    if (
        text.includes("delto") ||
        text.includes("supraspin") ||
        text.includes("infraspin") ||
        text.includes("teres")
    ) {
        return "shoulders";
    }

    if (
        text.includes("biceps") ||
        text.includes("triceps") ||
        text.includes("brach")
    ) {
        return "arms";
    }

    if (
        text.includes("rectusab") ||
        text.includes("obliqu") ||
        text.includes("transversusab") ||
        text.includes("serratus")
    ) {
        return "abs";
    }

    if (
        text.includes("glute")
    ) {
        return "glutes";
    }

    if (
        text.includes("femor") ||
        text.includes("vastus") ||
        text.includes("quadriceps") ||
        text.includes("sartorius") ||
        text.includes("gastrocn") ||
        text.includes("soleus") ||
        text.includes("tibialis") ||
        text.includes("adductor") ||
        text.includes("gracilis")
    ) {
        return "legs";
    }

    return "all";
}


/* =====================================================
   ANATOMIE LADEN
===================================================== */

function loadAnatomy() {

    return new Promise(
        (resolve, reject) => {

            const loader =
                new GLTFLoader();

            loader.load(

                "./anatomy.glb",

                function(gltf) {

                    anatomy =
                        gltf.scene;

                    /*
                       Das ist die gleiche Orientierung,
                       die dein vorheriges funktionierendes
                       Modell bereits benutzt hat.
                    */

                    anatomy.rotation.x =
                        -Math.PI / 2;

                    scene.add(
                        anatomy
                    );


                    anatomy.traverse(
                        function(object) {

                            if (!object.isMesh) {
                                return;
                            }

                            object.frustumCulled =
                                false;

                            /*
                               Eigene Materialien,
                               damit das Modell sicher
                               sichtbar bleibt.
                            */

                            object.material =
                                new THREE.MeshStandardMaterial({

                                    color: 0xb85f66,

                                    roughness: 0.75,

                                    metalness: 0.02

                                });


                            object.userData.name =
                                getMuscleName(
                                    object
                                );

                            object.userData.region =
                                getRegion(
                                    object
                                );


                            anatomyMeshes.push(
                                object
                            );

                        }
                    );


                    resolve();

                },

                function(progress) {

                    if (
                        progress.lengthComputable
                    ) {

                        const percent =
                            (
                                progress.loaded /
                                progress.total
                            ) * 100;

                        document
                            .getElementById(
                                "progress-bar"
                            )
                            .style.width =
                                percent + "%";
                    }

                },

                function(error) {

                    console.error(
                        "ANATOMY ERROR:",
                        error
                    );

                    reject(error);

                }

            );

        }
    );
}


/* =====================================================
   ANATOMIE AUSRICHTEN
===================================================== */

function fitAnatomy() {

    const box =
        new THREE.Box3()
        .setFromObject(
            anatomy
        );

    const center =
        new THREE.Vector3();

    box.getCenter(
        center
    );

    const size =
        new THREE.Vector3();

    box.getSize(
        size
    );

    const height =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (height <= 0) {
        return;
    }

    const scale =
        6 / height;

    anatomy.scale.setScalar(
        scale
    );

    /*
       Nach dem Skalieren erneut
       den Mittelpunkt bestimmen.
    */

    const scaledBox =
        new THREE.Box3()
        .setFromObject(
            anatomy
        );

    const scaledCenter =
        new THREE.Vector3();

    scaledBox.getCenter(
        scaledCenter
    );

    anatomy.position.sub(
        scaledCenter
    );
}


/* =====================================================
   SKELETT LADEN
===================================================== */

function loadSkeleton() {

    return new Promise(
        function(resolve) {

            const loader =
                new GLTFLoader();

            loader.load(

                "./skeleton.glb",

                function(gltf) {

                    skeleton =
                        gltf.scene;

                    skeleton.rotation.x =
                        -Math.PI / 2;

                    scene.add(
                        skeleton
                    );

                    /*
                       Das Skelett bekommt zunächst
                       einen neutralen Knochen-Look.
                    */

                    skeleton.traverse(
                        function(object) {

                            if (
                                object.isMesh
                            ) {

                                object.frustumCulled =
                                    false;

                                object.material =
                                    new THREE.MeshStandardMaterial({

                                        color: 0xe3ded2,

                                        roughness: 0.8,

                                        metalness: 0,

                                        transparent: true,

                                        opacity: 0.9,

                                        depthWrite: false

                                    });

                            }

                            if (
                                object.isLine
                            ) {

                                object.material.transparent =
                                    true;

                                object.material.opacity =
                                    0.9;

                            }

                        }
                    );


                    /*
                       Noch nicht anzeigen.
                    */

                    skeleton.visible =
                        false;


                    resolve();

                },

                undefined,

                function(error) {

                    /*
                       Das Skelett darf die
                       Anatomie NICHT blockieren.
                    */

                    console.error(
                        "SKELETON ERROR:",
                        error
                    );

                    skeleton = null;

                    resolve();

                }

            );

        }
    );
}


/* =====================================================
   SKELETT AN ANATOMIE ANPASSEN
===================================================== */

function fitSkeleton() {

    if (!skeleton) {
        return;
    }

    /*
       Zuerst Skeleton zurücksetzen.
    */

    skeleton.scale.set(
        1,
        1,
        1
    );

    skeleton.position.set(
        0,
        0,
        0
    );


    /*
       Größe des Skeletts bestimmen.
    */

    const skeletonBox =
        new THREE.Box3()
        .setFromObject(
            skeleton
        );

    const skeletonSize =
        new THREE.Vector3();

    skeletonBox.getSize(
        skeletonSize
    );


    const skeletonHeight =
        Math.max(
            skeletonSize.x,
            skeletonSize.y,
            skeletonSize.z
        );


    if (
        skeletonHeight <= 0
    ) {
        return;
    }


    /*
       Anatomie-Größe bestimmen.
    */

    const anatomyBox =
        new THREE.Box3()
        .setFromObject(
            anatomy
        );

    const anatomySize =
        new THREE.Vector3();

    anatomyBox.getSize(
        anatomySize
    );


    const anatomyHeight =
        Math.max(
            anatomySize.x,
            anatomySize.y,
            anatomySize.z
        );


    /*
       Das Skeleton bekommt dieselbe
       Höhe wie die Anatomie.
    */

    skeleton.scale.setScalar(
        anatomyHeight /
        skeletonHeight
    );


    /*
       Mittelpunkt des Skeletts.
    */

    const finalSkeletonBox =
        new THREE.Box3()
        .setFromObject(
            skeleton
        );

    const skeletonCenter =
        new THREE.Vector3();

    finalSkeletonBox.getCenter(
        skeletonCenter
    );


    /*
       Mittelpunkt der Anatomie.
    */

    const finalAnatomyBox =
        new THREE.Box3()
        .setFromObject(
            anatomy
        );

    const anatomyCenter =
        new THREE.Vector3();

    finalAnatomyBox.getCenter(
        anatomyCenter
    );


    /*
       Das Skelett wird exakt auf
       die Mitte der Anatomie gesetzt.
    */

    skeleton.position.add(
        anatomyCenter
        .clone()
        .sub(
            skeletonCenter
        )
    );
}


/* =====================================================
   MUSKEL-LISTE
===================================================== */

function buildMuscleList() {

    const list =
        document.getElementById(
            "muscle-list"
        );

    list.innerHTML = "";

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const unique =
        new Map();


    for (
        const mesh
        of anatomyMeshes
    ) {

        if (
            currentRegion !== "all" &&
            mesh.userData.region !==
            currentRegion
        ) {
            continue;
        }


        const name =
            mesh.userData.name;


        if (
            search &&
            !name
                .toLowerCase()
                .includes(search)
        ) {
            continue;
        }


        if (
            name === "Muskel"
        ) {
            continue;
        }


        if (
            !unique.has(name)
        ) {
            unique.set(
                name,
                mesh
            );
        }

    }


    document.getElementById(
        "panel-count"
    ).textContent =
        unique.size +
        " Muskeln";


    unique.forEach(
        function(mesh, name) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "muscle";

            item.textContent =
                name;

            if (
                selected &&
                selected.userData.name ===
                name
            ) {
                item.classList.add(
                    "selected"
                );
            }

            item.onclick =
                function() {

                    selectMuscle(
                        mesh
                    );

                };

            list.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   MUSKEL AUSWÄHLEN
===================================================== */

function selectMuscle(mesh) {

    resetMaterials();

    selected =
        mesh;


    mesh.material.color.set(
        0xf0a0a5
    );

    mesh.material.emissive.set(
        0x42151a
    );

    mesh.material.emissiveIntensity =
        0.5;


    document.getElementById(
        "detail"
    ).style.display =
        "block";


    document.getElementById(
        "detail-name"
    ).textContent =
        mesh.userData.name;


    const regions = {

        chest: "Brust",

        back: "Rücken",

        shoulders: "Schultern",

        arms: "Arme",

        abs: "Bauch",

        legs: "Beine",

        glutes: "Gesäß",

        all: "Körper"

    };


    document.getElementById(
        "detail-region"
    ).textContent =
        regions[
            mesh.userData.region
        ];


    buildMuscleList();

    focusMuscle(
        mesh
    );
}


/* =====================================================
   MATERIALIEN ZURÜCKSETZEN
===================================================== */

function resetMaterials() {

    anatomyMeshes.forEach(
        function(mesh) {

            mesh.visible =
                true;

            mesh.material.color.set(
                0xb85f66
            );

            mesh.material.emissive.set(
                0x000000
            );

            mesh.material.emissiveIntensity =
                0;

            mesh.material.transparent =
                skeletonOn;

            mesh.material.opacity =
                skeletonOn
                    ? 0.72
                    : 1;

            mesh.material.depthWrite =
                !skeletonOn;

        }
    );
}


/* =====================================================
   SKELETT BUTTON
===================================================== */

document.getElementById(
    "skeleton-button"
).onclick =
function() {

    if (!skeleton) {

        alert(
            "skeleton.glb wurde nicht geladen. Bitte überprüfe, dass skeleton.glb direkt neben index.html liegt."
        );

        return;
    }


    skeletonOn =
        !skeletonOn;


    skeleton.visible =
        skeletonOn;


    if (skeletonOn) {

        anatomyMeshes.forEach(
            function(mesh) {

                mesh.material.transparent =
                    true;

                mesh.material.opacity =
                    0.72;

                mesh.material.depthWrite =
                    false;

            }
        );

    } else {

        resetMaterials();

    }


    document
        .getElementById(
            "skeleton-button"
        )
        .classList.toggle(
            "active",
            skeletonOn
        );

};


/* =====================================================
   FOKUS
===================================================== */

function focusMuscle(mesh) {

    const box =
        new THREE.Box3()
        .setFromObject(
            mesh
        );

    const center =
        new THREE.Vector3();

    box.getCenter(
        center
    );

    const size =
        new THREE.Vector3();

    box.getSize(
        size
    );

    const distance =
        Math.max(
            size.x,
            size.y,
            size.z
        ) * 4;


    camera.position.set(
        center.x,
        center.y,
        center.z +
        Math.max(
            distance,
            1
        )
    );

    controls.target.copy(
        center
    );

    controls.update();
}


/* =====================================================
   ISOLIEREN
===================================================== */

document.getElementById(
    "isolate"
).onclick =
function() {

    if (!selected) {
        return;
    }

    anatomyMeshes.forEach(
        function(mesh) {

            if (
                mesh === selected
            ) {

                mesh.visible =
                    true;

                mesh.material.opacity =
                    1;

            } else {

                mesh.material.transparent =
                    true;

                mesh.material.opacity =
                    0.04;

            }

        }
    );

};


/* =====================================================
   DURCHSICHTIG
===================================================== */

document.getElementById(
    "transparent"
).onclick =
function() {

    if (!selected) {
        return;
    }

    selected.material.transparent =
        true;

    selected.material.opacity =
        0.15;

};


/* =====================================================
   ALLES ZEIGEN
===================================================== */

document.getElementById(
    "show-all"
).onclick =
function() {

    selected =
        null;

    resetMaterials();

    document.getElementById(
        "detail"
    ).style.display =
        "none";

    buildMuscleList();

};


/* =====================================================
   ANSICHTEN
===================================================== */

document.getElementById(
    "front"
).onclick =
function() {

    camera.position.set(
        0,
        0,
        7
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

};


document.getElementById(
    "back"
).onclick =
function() {

    camera.position.set(
        0,
        0,
        -7
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

};


document.getElementById(
    "side"
).onclick =
function() {

    camera.position.set(
        7,
        0,
        0
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

};


document.getElementById(
    "reset"
).onclick =
function() {

    selected =
        null;

    resetMaterials();

    document.getElementById(
        "detail"
    ).style.display =
        "none";

    camera.position.set(
        0,
        0,
        7
    );

    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

    buildMuscleList();

};


/* =====================================================
   ZOOM
===================================================== */

document.getElementById(
    "zoom-in"
).onclick =
function() {

    const direction =
        new THREE.Vector3()
        .subVectors(
            camera.position,
            controls.target
        )
        .normalize();

    const distance =
        camera.position.distanceTo(
            controls.target
        );

    const newDistance =
        Math.max(
            distance * 0.7,
            0.2
        );

    camera.position.copy(
        controls.target
            .clone()
            .add(
                direction.multiplyScalar(
                    newDistance
                )
            )
    );

};


document.getElementById(
    "zoom-out"
).onclick =
function() {

    const direction =
        new THREE.Vector3()
        .subVectors(
            camera.position,
            controls.target
        )
        .normalize();

    const distance =
        camera.position.distanceTo(
            controls.target
        );

    const newDistance =
        Math.min(
            distance * 1.4,
            100
        );

    camera.position.copy(
        controls.target
            .clone()
            .add(
                direction.multiplyScalar(
                    newDistance
                )
            )
    );

};


/* =====================================================
   SUCHE
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    buildMuscleList
);


/* =====================================================
   REGIONEN
===================================================== */

document.querySelectorAll(
    ".region"
).forEach(
    function(button) {

        button.onclick =
        function() {

            document.querySelectorAll(
                ".region"
            ).forEach(
                function(b) {

                    b.classList.remove(
                        "active"
                    );

                }
            );


            button.classList.add(
                "active"
            );


            currentRegion =
                button.dataset.region;


            const names = {

                all: "Ganzkörper",

                chest: "Brust",

                back: "Rücken",

                shoulders: "Schultern",

                arms: "Arme",

                abs: "Bauch",

                legs: "Beine",

                glutes: "Gesäß"

            };


            document.getElementById(
                "panel-title"
            ).textContent =
                names[
                    currentRegion
                ];


            buildMuscleList();

        };

    }
);


/* =====================================================
   DOPPELKLICK
===================================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "dblclick",
    function(event) {

        const rect =
            renderer.domElement
            .getBoundingClientRect();


        mouse.x =
            (
                (event.clientX -
                 rect.left) /
                rect.width
            ) * 2 - 1;


        mouse.y =
            -(
                (event.clientY -
                 rect.top) /
                rect.height
            ) * 2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                anatomyMeshes,
                true
            );


        if (
            hits.length > 0
        ) {

            selectMuscle(
                hits[0].object
            );

        }

    }
);


/* =====================================================
   MOBILE
===================================================== */

document.getElementById(
    "mobile-menu"
).onclick =
function() {

    document.getElementById(
        "sidebar"
    ).classList.toggle(
        "open"
    );

};


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            viewer.clientWidth /
            viewer.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            viewer.clientWidth,
            viewer.clientHeight
        );

    }
);


/* =====================================================
   RENDER
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   START
===================================================== */

async function start() {

    try {

        document.getElementById(
            "loading-text"
        ).textContent =
            "Anatomie wird geladen...";


        /*
           1. Anatomie zuerst.
           Wenn diese funktioniert,
           wird sie sofort sichtbar.
        */

        await loadAnatomy();


        fitAnatomy();


        /*
           Jetzt ist die Anatomie bereits
           korrekt auf dem Bildschirm.
        */

        document.getElementById(
            "loading-text"
        ).textContent =
            "Skelett wird geladen...";


        /*
           2. Skelett separat.
           Ein Fehler hier zerstört NICHT
           die Anatomie.
        */

        await loadSkeleton();


        /*
           3. Skelett an Anatomie ausrichten.
        */

        fitSkeleton();


        /*
           4. Oberfläche.
        */

        buildMuscleList();


        camera.position.set(
            0,
            0,
            7
        );

        controls.target.set(
            0,
            0,
            0
        );

        controls.update();


        /*
           Loading entfernen.
        */

        const loading =
            document.getElementById(
                "loading"
            );

        loading.style.opacity =
            "0";

        setTimeout(
            function() {

                loading.style.display =
                    "none";

            },
            400
        );


    } catch (error) {

        console.error(
            "START ERROR:",
            error
        );


        /*
           Falls anatomy.glb selbst
           nicht geladen werden kann,
           zeigen wir den echten Fehler
           statt ewig "Laden" anzuzeigen.
        */

        document.getElementById(
            "loading-text"
        ).textContent =
            "Fehler beim Laden";


        document.getElementById(
            "progress-bar"
        ).style.width =
            "100%";

        alert(
            "anatomy.glb konnte nicht geladen werden. Bitte überprüfe, dass anatomy.glb direkt neben index.html liegt."
        );

    }

}

start();

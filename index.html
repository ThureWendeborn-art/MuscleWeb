<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MuscleWeb – 3D Anatomie</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Inter, Arial, sans-serif;
    background: #0b0d10;
    color: #f3f4f6;
}

button, input {
    font: inherit;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
}

/* SIDEBAR */

#sidebar {
    width: 290px;
    height: 100%;
    background: #111419;
    border-right: 1px solid #252a31;
    display: flex;
    flex-direction: column;
    z-index: 10;
}

.logo {
    padding: 24px 22px 18px;
    border-bottom: 1px solid #252a31;
}

.logo-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.logo-subtitle {
    margin-top: 5px;
    font-size: 12px;
    color: #858c96;
}

.search {
    padding: 15px;
    border-bottom: 1px solid #252a31;
}

.search input {
    width: 100%;
    height: 40px;
    padding: 0 13px;
    border-radius: 8px;
    border: 1px solid #303640;
    outline: none;
    background: #191d23;
    color: white;
}

.search input:focus {
    border-color: #59636f;
}

.categories {
    padding: 12px;
    overflow-y: auto;
}

.category {
    width: 100%;
    padding: 11px 13px;
    margin-bottom: 4px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #b9bec6;
    text-align: left;
    cursor: pointer;
    transition: 0.15s;
}

.category:hover {
    background: #1b2027;
    color: white;
}

.category.active {
    background: #252b33;
    color: white;
}

.category-title {
    font-size: 14px;
    font-weight: 600;
}

.category-count {
    float: right;
    color: #747c87;
    font-size: 12px;
}

/* MAIN */

#main {
    flex: 1;
    height: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

/* TOP BAR */

#topbar {
    height: 65px;
    flex-shrink: 0;
    border-bottom: 1px solid #252a31;
    background: #101318;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.top-title {
    font-size: 16px;
    font-weight: 600;
}

.top-actions {
    display: flex;
    gap: 7px;
}

.control {
    height: 36px;
    min-width: 36px;
    padding: 0 11px;
    border: 1px solid #303640;
    border-radius: 7px;
    background: #181c22;
    color: #c9ced5;
    cursor: pointer;
}

.control:hover {
    background: #222830;
    color: white;
}

.control.active {
    background: #303740;
    color: white;
}

/* VIEWER */

#viewer {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #1b2026 0%, #101318 45%, #090b0e 100%);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* LOADING */

#loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #0b0d10;
    z-index: 20;
}

.loading-title {
    font-size: 20px;
    font-weight: 600;
}

.loading-text {
    margin-top: 8px;
    color: #858c96;
    font-size: 13px;
}

.progress {
    margin-top: 18px;
    width: min(360px, 70vw);
    height: 5px;
    border-radius: 10px;
    overflow: hidden;
    background: #262b31;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #e5e7eb;
    transition: width 0.15s;
}

#error {
    display: none;
    max-width: 600px;
    padding: 25px;
    text-align: center;
}

#error-title {
    color: #ff7d7d;
    font-size: 19px;
    font-weight: 600;
}

#error-message {
    margin-top: 12px;
    color: #aeb4bd;
    font-size: 13px;
    line-height: 1.6;
}

/* VIEW CONTROLS */

.viewer-controls {
    position: absolute;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
}

.viewer-button {
    width: 42px;
    height: 42px;
    border-radius: 7px;
    border: 1px solid #343a42;
    background: rgba(20, 24, 29, 0.92);
    color: #d9dde2;
    cursor: pointer;
}

.viewer-button:hover {
    background: #252b32;
    color: white;
}

/* INFO PANEL */

#info {
    position: absolute;
    left: 18px;
    bottom: 18px;
    width: 290px;
    max-width: calc(100% - 90px);
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #303640;
    background: rgba(16, 19, 24, 0.94);
    backdrop-filter: blur(10px);
    display: none;
    z-index: 5;
}

.info-name {
    font-size: 16px;
    font-weight: 700;
}

.info-region {
    margin-top: 4px;
    color: #8d95a0;
    font-size: 12px;
}

.info-description {
    margin-top: 12px;
    color: #b9bec6;
    font-size: 12px;
    line-height: 1.55;
}

.info-actions {
    display: flex;
    gap: 7px;
    margin-top: 13px;
}

.info-button {
    flex: 1;
    padding: 8px;
    border: 1px solid #353b43;
    border-radius: 6px;
    background: #1c2128;
    color: #dce0e5;
    cursor: pointer;
    font-size: 12px;
}

.info-button:hover {
    background: #282e36;
}

/* LABELS */

.muscle-label {
    position: absolute;
    padding: 4px 7px;
    border-radius: 5px;
    border: 1px solid #414852;
    background: rgba(10, 12, 15, 0.88);
    color: white;
    font-size: 10px;
    pointer-events: none;
    white-space: nowrap;
    display: none;
}

/* RIGHT PANEL */

#rightPanel {
    width: 300px;
    height: 100%;
    border-left: 1px solid #252a31;
    background: #111419;
    display: flex;
    flex-direction: column;
    z-index: 8;
}

.panel-header {
    padding: 20px;
    border-bottom: 1px solid #252a31;
}

.panel-title {
    font-size: 16px;
    font-weight: 700;
}

.panel-subtitle {
    margin-top: 5px;
    color: #7f8791;
    font-size: 12px;
}

.muscle-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.muscle-item {
    width: 100%;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #b9bec6;
    text-align: left;
    padding: 10px;
    cursor: pointer;
    margin-bottom: 2px;
}

.muscle-item:hover {
    background: #1b2027;
    color: white;
}

.muscle-item.selected {
    background: #293039;
    color: white;
}

.muscle-item-name {
    font-size: 13px;
}

.muscle-item-type {
    margin-top: 3px;
    color: #707985;
    font-size: 10px;
}

/* EXERCISES */

#exercisePanel {
    border-top: 1px solid #252a31;
    padding: 15px;
    max-height: 240px;
    overflow-y: auto;
}

.exercise-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 9px;
}

.exercise {
    padding: 8px 0;
    color: #aeb5be;
    font-size: 12px;
    border-bottom: 1px solid #20252b;
}

.exercise:last-child {
    border-bottom: 0;
}

/* MOBILE */

#mobileMenu {
    display: none;
}

@media (max-width: 900px) {

    #sidebar {
        position: fixed;
        left: -300px;
        top: 0;
        transition: left 0.2s;
        box-shadow: 10px 0 30px rgba(0,0,0,0.4);
    }

    #sidebar.open {
        left: 0;
    }

    #rightPanel {
        position: fixed;
        right: -310px;
        top: 0;
        transition: right 0.2s;
        box-shadow: -10px 0 30px rgba(0,0,0,0.4);
    }

    #rightPanel.open {
        right: 0;
    }

    #mobileMenu {
        display: block;
    }

    .top-title {
        display: none;
    }

    #topbar {
        justify-content: space-between;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- LINKES MENÜ -->

    <aside id="sidebar">

        <div class="logo">
            <div class="logo-title">MuscleWeb</div>
            <div class="logo-subtitle">3D Muskulatur & Training</div>
        </div>

        <div class="search">
            <input
                id="search"
                type="text"
                placeholder="Muskel suchen..."
                autocomplete="off"
            >
        </div>

        <div class="categories">

            <button class="category active" data-region="Alle">
                <span class="category-title">Ganzkörper</span>
                <span class="category-count" id="count-Alle">0</span>
            </button>

            <button class="category" data-region="Brust">
                <span class="category-title">Brust</span>
                <span class="category-count" id="count-Brust">0</span>
            </button>

            <button class="category" data-region="Rücken">
                <span class="category-title">Rücken</span>
                <span class="category-count" id="count-Rücken">0</span>
            </button>

            <button class="category" data-region="Schultern">
                <span class="category-title">Schultern</span>
                <span class="category-count" id="count-Schultern">0</span>
            </button>

            <button class="category" data-region="Arme">
                <span class="category-title">Arme</span>
                <span class="category-count" id="count-Arme">0</span>
            </button>

            <button class="category" data-region="Bauch">
                <span class="category-title">Bauch</span>
                <span class="category-count" id="count-Bauch">0</span>
            </button>

            <button class="category" data-region="Beine">
                <span class="category-title">Beine</span>
                <span class="category-count" id="count-Beine">0</span>
            </button>

            <button class="category" data-region="Gesäß">
                <span class="category-title">Gesäß</span>
                <span class="category-count" id="count-Gesäß">0</span>
            </button>

        </div>
    </aside>


    <!-- HAUPTBEREICH -->

    <main id="main">

        <header id="topbar">

            <button class="control" id="mobileMenu">
                Menü
            </button>

            <div class="top-title" id="currentRegion">
                Ganzkörper
            </div>

            <div class="top-actions">

                <button class="control" id="front">
                    Vorne
                </button>

                <button class="control" id="back">
                    Hinten
                </button>

                <button class="control" id="side">
                    Seite
                </button>

                <button class="control" id="reset">
                    Reset
                </button>

                <button class="control" id="labels">
                    Beschriftungen
                </button>

                <button class="control" id="rightMenu">
                    Muskeln
                </button>

            </div>

        </header>


        <section id="viewer">

            <div id="loading">

                <div class="loading-title">
                    3D-Modell wird geladen
                </div>

                <div class="loading-text" id="loadingText">
                    anatomy.glb wird geladen...
                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div id="error">

                    <div id="error-title">

                    </div>

                    <div id="error-message"></div>

                </div>

            </div>


            <div class="viewer-controls">

                <button class="viewer-button" id="zoomIn">
                    +
                </button>

                <button class="viewer-button" id="zoomOut">
                    −
                </button>

                <button class="viewer-button" id="showAll">
                    Alle
                </button>

            </div>


            <div id="info">

                <div class="info-name" id="infoName">
                    Muskel
                </div>

                <div class="info-region" id="infoRegion">
                    Region
                </div>

                <div class="info-description" id="infoDescription">
                    Klicke auf einen Muskel, um ihn auszuwählen.
                </div>

                <div class="info-actions">

                    <button class="info-button" id="isolate">
                        Isolieren
                    </button>

                    <button class="info-button" id="hide">
                        Ausblenden
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- RECHTES MENÜ -->

    <aside id="rightPanel">

        <div class="panel-header">

            <div class="panel-title">
                Muskeln
            </div>

            <div class="panel-subtitle" id="panelSubtitle">
                Anatomische Strukturen
            </div>

        </div>

        <div class="muscle-list" id="muscleList"></div>

        <div id="exercisePanel">

            <div class="exercise-title">
                Übungen
            </div>

            <div id="exerciseList">
                Wähle einen Muskel aus.
            </div>

        </div>

    </aside>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


/* ============================================================
   GRUNDLAGEN
============================================================ */

const viewer = document.getElementById("viewer");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x0b0d10);


const camera = new THREE.PerspectiveCamera(
    35,
    viewer.clientWidth / viewer.clientHeight,
    0.01,
    1000
);

camera.position.set(0, 1.5, 3.8);


const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

viewer.appendChild(renderer.domElement);


/* ============================================================
   LICHT
============================================================ */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x20242a,
    2.4
);

scene.add(ambient);


const keyLight = new THREE.DirectionalLight(
    0xffffff,
    3.2
);

keyLight.position.set(
    3,
    5,
    5
);

keyLight.castShadow = true;

scene.add(keyLight);


const fillLight = new THREE.DirectionalLight(
    0xffffff,
    1.5
);

fillLight.position.set(
    -4,
    2,
    3
);

scene.add(fillLight);


const backLight = new THREE.DirectionalLight(
    0xffffff,
    1.8
);

backLight.position.set(
    0,
    4,
    -5
);

scene.add(backLight);


/* ============================================================
   CONTROLS
============================================================ */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.08;

controls.enablePan = false;

controls.minDistance = 0.5;

controls.maxDistance = 10;

controls.target.set(
    0,
    1.3,
    0
);


/* ============================================================
   VARIABLEN
============================================================ */

let model = null;

let meshes = [];

let selectedMesh = null;

let selectedOriginalMaterial = null;

let labelsVisible = false;

let currentRegion = "Alle";

let isolated = false;

let modelCenter = new THREE.Vector3();

let modelSize = new THREE.Vector3();


/* ============================================================
   REGIONEN
============================================================ */

const regionKeywords = {

    Brust: [
        "pect",
        "chest",
        "thorax",
        "mamm",
        "pector",
        "stern"
    ],

    Rücken: [
        "lat",
        "dorsi",
        "trapez",
        "rhombo",
        "erector",
        "multifid",
        "back",
        "spine",
        "vertebr"
    ],

    Schultern: [
        "deltoid",
        "delto",
        "supraspin",
        "infraspin",
        "teres",
        "shoulder"
    ],

    Arme: [
        "biceps",
        "triceps",
        "brachial",
        "brachio",
        "forearm",
        "flexor",
        "extensor",
        "pronator",
        "supinator",
        "hand",
        "wrist"
    ],

    Bauch: [
        "rectus",
        "abdomin",
        "oblique",
        "transvers",
        "quadratus",
        "serratus"
    ],

    Beine: [
        "quadriceps",
        "quad",
        "femor",
        "hamstring",
        "sartorius",
        "tibial",
        "gastrocn",
        "soleus",
        "adductor",
        "gracilis",
        "vastus",
        "calf",
        "leg",
        "perone",
        "fibular"
    ],

    Gesäß: [
        "glute",
        "piriform",
        "buttock"
    ]

};


function detectRegion(name) {

    const n = name.toLowerCase();

    for (const region in regionKeywords) {

        for (const keyword of regionKeywords[region]) {

            if (n.includes(keyword)) {
                return region;
            }

        }

    }

    return "Sonstiges";
}


/* ============================================================
   DEUTSCHE NAMEN
============================================================ */

const translations = {

    pectoralis: "Großer Brustmuskel",
    pectoralismajor: "Großer Brustmuskel",
    pectoralisminor: "Kleiner Brustmuskel",

    biceps: "Bizeps",
    bicepsbrachii: "Bizeps",

    triceps: "Trizeps",
    tricepsbrachii: "Trizeps",

    deltoid: "Deltamuskel",

    trapezius: "Trapezmuskel",

    latissimus: "Breiter Rückenmuskel",

    latissimusdorsi: "Breiter Rückenmuskel",

    rectusabdominis: "Gerader Bauchmuskel",

    obliquus: "Schräger Bauchmuskel",

    transversusabdominis: "Querer Bauchmuskel",

    gluteusmaximus: "Großer Gesäßmuskel",

    gluteusmedius: "Mittlerer Gesäßmuskel",

    quadriceps: "Vierköpfiger Oberschenkelmuskel",

    rectusfemoris: "Gerader Oberschenkelmuskel",

    sartorius: "Schneidermuskel",

    gastrocnemius: "Zwillingswadenmuskel",

    soleus: "Schollenmuskel",

    tibialisanterior: "Vorderer Schienbeinmuskel",

    brachialis: "Armbeuger",

    brachioradialis: "Oberarm-Speichenmuskel",

    rhomboid: "Rautenmuskel",

    erectorspinae: "Rückenstrecker",

    serratus: "Sägezahnmuskel"

};


function getGermanName(original) {

    const clean = original
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");

    for (const key in translations) {

        if (clean.includes(key)) {
            return translations[key];
        }

    }

    return original
        .replace(/_/g, " ")
        .replace(/-/g, " ");
}


/* ============================================================
   ÜBUNGEN
============================================================ */

const exercises = {

    Brust: [
        "Bankdrücken",
        "Schrägbankdrücken",
        "Liegestütze",
        "Kabelzug-Fliegende"
    ],

    Rücken: [
        "Klimmzüge",
        "Latzug",
        "Rudern",
        "Kreuzheben"
    ],

    Schultern: [
        "Schulterdrücken",
        "Seitheben",
        "Reverse Flys"
    ],

    Arme: [
        "Bizepscurls",
        "Hammercurls",
        "Trizepsdrücken",
        "French Press"
    ],

    Bauch: [
        "Crunches",
        "Beinheben",
        "Plank",
        "Kabel-Crunches"
    ],

    Beine: [
        "Kniebeugen",
        "Beinpresse",
        "Beinstrecker",
        "Beinbeuger",
        "Wadenheben"
    ],

    Gesäß: [
        "Hip Thrusts",
        "Ausfallschritte",
        "Bulgarian Split Squats"
    ],

    Sonstiges: [
        "Keine Übungsdaten vorhanden."
    ]

};


/* ============================================================
   MATERIAL VERWALTUNG
============================================================ */

function createHighlightMaterial(mesh) {

    const material = mesh.material.clone();

    material.color = new THREE.Color(0xffffff);

    material.emissive = new THREE.Color(0x555555);

    material.emissiveIntensity = 0.65;

    return material;

}


function selectMesh(mesh) {

    if (selectedMesh === mesh) {
        return;
    }

    restoreSelected();

    selectedMesh = mesh;

    selectedOriginalMaterial = mesh.material;

    mesh.material = createHighlightMaterial(mesh);

    updateInfo(mesh);

    updateMuscleListSelection(mesh);

}


function restoreSelected() {

    if (
        selectedMesh &&
        selectedOriginalMaterial
    ) {

        selectedMesh.material =
            selectedOriginalMaterial;

    }

    selectedMesh = null;

    selectedOriginalMaterial = null;

}


/* ============================================================
   INFO
============================================================ */

function updateInfo(mesh) {

    const panel =
        document.getElementById("info");

    const name =
        document.getElementById("infoName");

    const region =
        document.getElementById("infoRegion");

    const description =
        document.getElementById("infoDescription");

    const german =
        getGermanName(mesh.name);

    const detected =
        detectRegion(mesh.name);

    name.textContent = german;

    region.textContent =
        detected === "Sonstiges"
            ? "Anatomische Struktur"
            : detected;

    description.textContent =
        "Diese Struktur ist Teil des 3D-Anatomiemodells. Du kannst sie isolieren, ausblenden oder die Ansicht drehen, um ihre Lage besser zu untersuchen.";

    panel.style.display = "block";

    showExercises(detected);

}


/* ============================================================
   ÜBUNGEN ANZEIGEN
============================================================ */

function showExercises(region) {

    const list =
        document.getElementById("exerciseList");

    const data =
        exercises[region] ||
        exercises.Sonstiges;

    list.innerHTML = "";

    data.forEach(exercise => {

        const div =
            document.createElement("div");

        div.className = "exercise";

        div.textContent = exercise;

        list.appendChild(div);

    });

}


/* ============================================================
   MODELL LADEN
============================================================ */

const loader = new GLTFLoader();


loader.load(

    "./anatomy.glb",

    function(gltf) {

        model = gltf.scene;

        scene.add(model);


        /*
         * BodyExplorer verwendet eine andere
         * Koordinatenausrichtung.
         *
         * Deshalb wird das Modell hier entsprechend
         * ausgerichtet.
         */

        model.rotation.x = -Math.PI / 2;


        model.traverse(object => {

            if (!object.isMesh) {
                return;
            }

            object.castShadow = true;

            object.receiveShadow = true;


            if (object.material) {

                if (
                    object.material.isMeshStandardMaterial ||
                    object.material.isMeshPhysicalMaterial
                ) {

                    object.material.roughness = 0.72;

                    object.material.metalness = 0.0;

                }

            }


            object.userData.originalMaterial =
                object.material;

            object.userData.region =
                detectRegion(object.name);

            meshes.push(object);

        });


        if (meshes.length === 0) {

            throw new Error(
                "Das Modell wurde geladen, enthält aber keine 3D-Meshes."
            );

        }


        fitModel();


        updateCounts();

        updateMuscleList();


        document.getElementById("loading")
            .style.display = "none";

    },


    function(progress) {

        if (progress.total) {

            const percent =
                Math.round(
                    progress.loaded /
                    progress.total *
                    100
                );

            document.getElementById("progressBar")
                .style.width =
                percent + "%";

            document.getElementById("loadingText")
                .textContent =
                "3D-Modell wird geladen – " +
                percent +
                "%";

        } else {

            document.getElementById("loadingText")
                .textContent =
                "3D-Modell wird geladen...";

        }

    },


    function(error) {

        console.error(
            "Fehler beim Laden von anatomy.glb:",
            error
        );

        document.getElementById("loadingText")
            .style.display = "none";

        document.querySelector(".progress")
            .style.display = "none";

        document.getElementById("error")
            .style.display = "block";

        document.getElementById("error-message")
            .textContent =
            "Die Datei anatomy.glb konnte nicht geladen werden. " +
            "Prüfe, ob sie im gleichen GitHub-Ordner wie index.html liegt. " +
            "Technischer Fehler: " +
            (error?.message || error);

    }

);


/* ============================================================
   MODELL ZENTRIEREN
============================================================ */

function fitModel() {

    if (!model) {
        return;
    }


    const box =
        new THREE.Box3()
            .setFromObject(model);

    const size =
        box.getSize(new THREE.Vector3());

    const center =
        box.getCenter(new THREE.Vector3());


    model.position.sub(center);


    /*
     * Nach dem Zentrieren erneut messen.
     */

    const box2 =
        new THREE.Box3()
            .setFromObject(model);

    const size2 =
        box2.getSize(new THREE.Vector3());

    modelSize.copy(size2);

    const maxDimension =
        Math.max(
            size2.x,
            size2.y,
            size2.z
        );


    const distance =
        maxDimension /
        (2 *
        Math.tan(
            THREE.MathUtils.degToRad(
                camera.fov / 2
            )
        ));


    camera.position.set(
        0,
        maxDimension * 0.15,
        distance * 1.25
    );


    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


/* ============================================================
   MUSKEL-LISTE
============================================================ */

function updateMuscleList() {

    const list =
        document.getElementById("muscleList");

    list.innerHTML = "";


    let filtered =
        meshes.filter(mesh => {

            if (
                currentRegion !== "Alle" &&
                mesh.userData.region !== currentRegion
            ) {

                return false;

            }

            const search =
                document.getElementById("search")
                    .value
                    .toLowerCase()
                    .trim();

            if (!search) {
                return true;
            }

            const name =
                getGermanName(mesh.name)
                    .toLowerCase();

            const original =
                mesh.name.toLowerCase();

            return (
                name.includes(search) ||
                original.includes(search)
            );

        });


    /*
     * Einige GLB-Dateien besitzen viele
     * technische Hilfs-Meshes. Diese werden
     * möglichst weit nach hinten verschoben.
     */

    filtered.sort((a, b) => {

        const ar =
            a.userData.region === "Sonstiges";

        const br =
            b.userData.region === "Sonstiges";

        if (ar !== br) {
            return ar ? 1 : -1;
        }

        return getGermanName(a.name)
            .localeCompare(
                getGermanName(b.name),
                "de"
            );

    });


    filtered.forEach(mesh => {

        const item =
            document.createElement("button");

        item.className =
            "muscle-item";


        if (mesh === selectedMesh) {
            item.classList.add("selected");
        }


        const name =
            document.createElement("div");

        name.className =
            "muscle-item-name";

        name.textContent =
            getGermanName(mesh.name);


        const type =
            document.createElement("div");

        type.className =
            "muscle-item-type";

        type.textContent =
            mesh.userData.region;


        item.appendChild(name);

        item.appendChild(type);


        item.addEventListener(
            "click",
            () => {

                selectMesh(mesh);

                focusMesh(mesh);

            }
        );


        list.appendChild(item);

    });


    document.getElementById("panelSubtitle")
        .textContent =
        filtered.length +
        " Strukturen";
}


function updateMuscleListSelection(mesh) {

    document
        .querySelectorAll(".muscle-item")
        .forEach(item => {

            item.classList.remove("selected");

        });


    /*
     * Liste neu zeichnen, damit die Auswahl
     * korrekt markiert wird.
     */

    updateMuscleList();

}


/* ============================================================
   REGION-ZÄHLER
============================================================ */

function updateCounts() {

    const regions = [
        "Alle",
        "Brust",
        "Rücken",
        "Schultern",
        "Arme",
        "Bauch",
        "Beine",
        "Gesäß"
    ];


    regions.forEach(region => {

        const count =
            region === "Alle"
                ? meshes.length
                : meshes.filter(
                    mesh =>
                    mesh.userData.region === region
                ).length;


        const element =
            document.getElementById(
                "count-" + region
            );


        if (element) {
            element.textContent = count;
        }

    });

}


/* ============================================================
   MUSKEL FOKUSSIEREN
============================================================ */

function focusMesh(mesh) {

    const box =
        new THREE.Box3()
            .setFromObject(mesh);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );


    controls.target.copy(center);


    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    /*
     * Nicht zu nah an sehr kleine Strukturen.
     */

    const distance =
        Math.max(
            max * 4,
            0.7
        );


    const direction =
        new THREE.Vector3()
            .subVectors(
                camera.position,
                controls.target
            )
            .normalize();


    camera.position.copy(
        center.clone()
            .add(
                direction.multiplyScalar(
                    distance
                )
            )
    );


    controls.update();

}


/* ============================================================
   ISOLIEREN
============================================================ */

document
    .getElementById("isolate")
    .addEventListener(
        "click",
        () => {

            if (!selectedMesh) {
                return;
            }

            isolated = true;


            meshes.forEach(mesh => {

                if (mesh === selectedMesh) {

                    mesh.visible = true;

                } else {

                    mesh.visible = false;

                }

            });

        }
    );


/* ============================================================
   AUSBLENDEN
============================================================ */

document
    .getElementById("hide")
    .addEventListener(
        "click",
        () => {

            if (!selectedMesh) {
                return;
            }

            selectedMesh.visible = false;

            restoreSelected();

            document.getElementById("info")
                .style.display = "none";

        }
    );


/* ============================================================
   ALLE ANZEIGEN
============================================================ */

function showEverything() {

    isolated = false;

    meshes.forEach(mesh => {

        mesh.visible = true;

    });

}


document
    .getElementById("showAll")
    .addEventListener(
        "click",
        showEverything
    );


/* ============================================================
   REGIONEN
============================================================ */

document
    .querySelectorAll(".category")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".category")
                    .forEach(b =>
                        b.classList.remove("active")
                    );


                button.classList.add("active");


                currentRegion =
                    button.dataset.region;


                document
                    .getElementById("currentRegion")
                    .textContent =
                    currentRegion === "Alle"
                        ? "Ganzkörper"
                        : currentRegion;


                updateMuscleList();

            }
        );

    });


/* ============================================================
   SUCHE
============================================================ */

document
    .getElementById("search")
    .addEventListener(
        "input",
        updateMuscleList
    );


/* ============================================================
   3D CLICK
============================================================ */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        const rect =
            renderer.domElement
                .getBoundingClientRect();


        mouse.x =
            (
                event.clientX -
                rect.left
            ) /
            rect.width *
            2 -
            1;


        mouse.y =
            -(
                event.clientY -
                rect.top
            ) /
            rect.height *
            2 +
            1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                meshes,
                true
            );


        if (hits.length === 0) {
            return;
        }


        let hit =
            hits[0].object;


        /*
         * Falls das getroffene Objekt ein
         * Unterobjekt ist, suchen wir das
         * eigentliche Mesh.
         */

        if (!hit.isMesh) {
            return;
        }


        selectMesh(hit);

    }
);


/* ============================================================
   KAMERA-ANSICHTEN
============================================================ */

function setView(type) {

    if (!modelSize.x &&
        !modelSize.y &&
        !modelSize.z) {
        return;
    }


    const max =
        Math.max(
            modelSize.x,
            modelSize.y,
            modelSize.z
        );


    const distance =
        max * 1.7;


    if (type === "front") {

        camera.position.set(
            0,
            0,
            distance
        );

    }


    if (type === "back") {

        camera.position.set(
            0,
            0,
            -distance
        );

    }


    if (type === "side") {

        camera.position.set(
            distance,
            0,
            0
        );

    }


    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


document
    .getElementById("front")
    .addEventListener(
        "click",
        () => setView("front")
    );


document
    .getElementById("back")
    .addEventListener(
        "click",
        () => setView("back")
    );


document
    .getElementById("side")
    .addEventListener(
        "click",
        () => setView("side")
    );


/* ============================================================
   RESET
============================================================ */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        () => {

            showEverything();

            restoreSelected();

            document.getElementById("info")
                .style.display = "none";

            fitModel();

        }
    );


/* ============================================================
   ZOOM
============================================================ */

document
    .getElementById("zoomIn")
    .addEventListener(
        "click",
        () => {

            const direction =
                new THREE.Vector3()
                    .subVectors(
                        camera.position,
                        controls.target
                    )
                    .multiplyScalar(0.8);


            camera.position.copy(
                controls.target
                    .clone()
                    .add(direction)
            );

        }
    );


document
    .getElementById("zoomOut")
    .addEventListener(
        "click",
        () => {

            const direction =
                new THREE.Vector3()
                    .subVectors(
                        camera.position,
                        controls.target
                    )
                    .multiplyScalar(1.25);


            camera.position.copy(
                controls.target
                    .clone()
                    .add(direction)
            );

        }
    );


/* ============================================================
   BESCHRIFTUNGEN
============================================================ */

document
    .getElementById("labels")
    .addEventListener(
        "click",
        () => {

            labelsVisible =
                !labelsVisible;


            document
                .getElementById("labels")
                .classList.toggle(
                    "active",
                    labelsVisible
                );

        }
    );


/* ============================================================
   MOBILE MENÜS
============================================================ */

document
    .getElementById("mobileMenu")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

        }
    );


document
    .getElementById("rightMenu")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("rightPanel")
                .classList.toggle("open");

        }
    );


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            viewer.clientWidth /
            viewer.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            viewer.clientWidth,
            viewer.clientHeight
        );

    }
);


/* ============================================================
   ANIMATION
============================================================ */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

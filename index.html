<title>MuscleWeb</title>

<style>
* {

}

html, body {

  width: 100%;
  height: 100%;
  overflow: hidden;

#app {

/* SIDEBAR */

#sidebar {

<script type="module">

import * as THREE from "three";

import {
  OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
  GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* ==================================================
   MODEL URLs
================================================== */

const ANATOMY_URL =
"https://cdn.jsdelivr.net/gh/JohanBellander/BodyExplorer@main/public/anatomy.glb";

const SKELETON_URL =
"https://cdn.jsdelivr.net/gh/JohanBellander/BodyExplorer@main/public/skeleton.glb";


/* ==================================================
   ELEMENTS
================================================== */

const canvas =
document.getElementById("canvas");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");

const progressBar =
document.getElementById("progressBar");

const status =
document.getElementById("status");

const muscleList =
document.getElementById("muscleList");

const info =
document.getElementById("info");

const infoName =
document.getElementById("infoName");

const infoType =
document.getElementById("infoType");

const exerciseList =
document.getElementById("exerciseList");


/* ==================================================
   SCENE
================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x080b10);


const camera =
new THREE.PerspectiveCamera(
  35,
  1,
  0.1,
  200
);


camera.position.set(
  0,
  0,
  36
);


const renderer =
new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: "high-performance"
});


renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;


function resize() {

  const width =
    document.getElementById("viewer")
      .clientWidth;

  const height =
    document.getElementById("viewer")
      .clientHeight;

  camera.aspect =
    width / height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height,
    false
  );

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* ==================================================
   LIGHT
================================================== */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x202733,
    2.2
  )
);


const light1 =
new THREE.DirectionalLight(
  0xffffff,
  3
);

light1.position.set(
  5,
  8,
  8
);

scene.add(light1);


const light2 =
new THREE.DirectionalLight(
  0xb8c9df,
  1.3
);

light2.position.set(
  -5,
  4,
  4
);

scene.add(light2);


const light3 =
new THREE.DirectionalLight(
  0xffffff,
  1.4
);

light3.position.set(
  0,
  5,
  -8
);

scene.add(light3);


/* ==================================================
   ORBIT CONTROLS
================================================== */

const controls =
new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.enablePan = true;

controls.minDistance = 8;
controls.maxDistance = 80;

controls.target.set(
  0,
  0,
  0
);

controls.update();


/* ==================================================
   MATERIALS
================================================== */

const muscleMaterial =
new THREE.MeshStandardMaterial({

  color: 0x9f3028,

  roughness: 0.62,

  metalness: 0,

  side: THREE.DoubleSide

});


const tendonMaterial =
new THREE.MeshStandardMaterial({

  color: 0xe1d7c1,

  roughness: 0.5,

  metalness: 0,

  side: THREE.DoubleSide

});


const boneMaterial =
new THREE.MeshStandardMaterial({

  color: 0xe6dfcf,

  roughness: 0.6,

  transparent: true,

  opacity: 0.55,

  depthWrite: false,

  side: THREE.DoubleSide

});


const selectedMaterial =
new THREE.MeshStandardMaterial({

  color: 0xff8a72,

  roughness: 0.45,

  emissive: 0x44100b,

  emissiveIntensity: 0.7,

  side: THREE.DoubleSide

});


/* ==================================================
   MODEL STORAGE
================================================== */

const body =
new THREE.Group();

const skeleton =
new THREE.Group();

scene.add(body);

body.add(skeleton);


let muscleMeshes = [];

let selectedMesh = null;


/* ==================================================
   NAME / GROUP HELPERS
================================================== */

function readableName(name) {

  if (!name) {
    return "Anatomische Struktur";
  }

  return name

    .replaceAll("_", " ")

    .replace(/\s+/g, " ")

    .trim()

    .replace(/\b\w/g, c =>
      c.toUpperCase()
    );

}


function classify(name) {

  const n =
    name.toLowerCase();


  if (
    n.includes("pector") ||
    n.includes("breast")
  ) return "chest";


  if (
    n.includes("latissimus") ||
    n.includes("trapezius") ||
    n.includes("rhomboid") ||
    n.includes("erector") ||
    n.includes("multifidus")
  ) return "back";


  if (
    n.includes("deltoid") ||
    n.includes("supraspinatus") ||
    n.includes("infraspinatus")
  ) return "shoulders";


  if (
    n.includes("biceps") ||
    n.includes("triceps") ||
    n.includes("brachialis") ||
    n.includes("brachioradialis") ||
    n.includes("flexor") ||
    n.includes("extensor")
  ) return "arms";


  if (
    n.includes("rectus abdominis") ||
    n.includes("oblique") ||
    n.includes("abdominal") ||
    n.includes("transversus")
  ) return "abs";


  if (
    n.includes("gluteus")
  ) return "glutes";


  if (
    n.includes("quadriceps") ||
    n.includes("vastus") ||
    n.includes("femor") ||
    n.includes("hamstring") ||
    n.includes("sartorius") ||
    n.includes("gastrocnemius") ||
    n.includes("soleus") ||
    n.includes("tibialis") ||
    n.includes("adductor")
  ) return "legs";


  return "all";

}


/* ==================================================
   EXERCISES
================================================== */

const exerciseData = {

  chest: [
    "Bankdrücken",
    "Schrägbankdrücken",
    "Dips",
    "Liegestütze"
  ],

  back: [

  ],

  ],

  arms: [

    "Hammer Curls",

    "French Press"
  ],

  abs: [
    "Crunches",
    "Hanging Leg Raises",
    "Cable Crunches",
    "Plank"
  ],

  glutes: [
    "Hip Thrusts",
    "Glute Bridges",
    "Bulgarian Split Squats"
  ],

  legs: [
    "Kniebeugen",
    "Beinpresse",
    "Beinbeuger",
    "Beinstrecker",
    "Wadenheben"
  ]

};


/* ==================================================
   IMPORTANT:
   BODYEXPLORER COORDINATE TRANSFORM
================================================== */

function transformGeometry(
  geometry,
  center,
  scaleFactor
) {

  const positions =
    geometry.getAttribute(
      "position"
    );


  if (positions) {

    const array =
      positions.array;


    for (
      let i = 0;
      i < array.length;
      i += 3
    ) {

      const x =
        array[i];

      const y =
        array[i + 1];

      const z =
        array[i + 2];


      /*
        BP3D:

        X = left/right
        Y = front/back
        Z = bottom/top

        Three.js:

        X = left/right
        Y = up
        Z = front
      */

      array[i] =
        (x - center.x)
        * scaleFactor;

      array[i + 1] =
        (z - center.z)
        * scaleFactor;

      array[i + 2] =
        -(y - center.y)
        * scaleFactor;

    }


    positions.needsUpdate =
      true;

  }


  const normals =
    geometry.getAttribute(
      "normal"
    );


  if (normals) {

    const array =
      normals.array;


    for (
      let i = 0;
      i < array.length;
      i += 3
    ) {

      const x =
        array[i];

      const y =
        array[i + 1];

      const z =
        array[i + 2];


      array[i] = x;

      array[i + 1] = z;

      array[i + 2] = -y;

    }


    normals.needsUpdate =
      true;

  }


  geometry.computeBoundingBox();

  geometry.computeBoundingSphere();

}


/* ==================================================
   LOAD GLB
================================================== */

function loadGLB(
  loader,
  url,
  progressStart,
  progressEnd
) {

  return new Promise(
    (resolve, reject) => {

      loader.load(

        url,

        gltf => {

          resolve(gltf);

        },

        event => {

          if (
            event.total &&
            event.total > 0
          ) {

            const local =
              event.loaded /
              event.total;

            const percent =
              progressStart +
              local *
              (progressEnd -
               progressStart);

            progressBar.style.width =
              percent + "%";

            loadingText.textContent =
              "3D-Modell wird geladen... " +
              Math.round(percent) +
              "%";

          }

        },

        error => {

          reject(error);

        }

      );

    }
  );

}


/* ==================================================
   LOAD BODY
================================================== */

async function loadBody() {

  try {

    const loader =
      new GLTFLoader();


    loadingText.textContent =
      "Lade Anatomie...";


    /*
      Load anatomy first.
    */

    const anatomyGLTF =
      await loadGLB(
        loader,
        ANATOMY_URL,
        0,
        70
      );


    const anatomyRoot =
      anatomyGLTF.scene;


    /*
      Find original BP3D bounding box.
    */

    const anatomyBox =
      new THREE.Box3()
        .setFromObject(
          anatomyRoot
        );


    const anatomyCenter =
      anatomyBox.getCenter(
        new THREE.Vector3()
      );


    const anatomySize =
      anatomyBox.getSize(
        new THREE.Vector3()
      );


    /*
      The original BodyExplorer
      uses approximately 30 units
      as body height.
    */

    const targetHeight = 30;


    const scaleFactor =
      targetHeight /
      anatomySize.z;


    /*
      Process every anatomical mesh.
    */

    let count = 0;


    anatomyRoot.traverse(
      child => {

        if (!child.isMesh)
          return;


        const geometry =
          child.geometry.clone();


        transformGeometry(
          geometry,
          anatomyCenter,
          scaleFactor
        );


        const rawName =
          child.name ||
          "Anatomische Struktur";


        const lower =
          rawName.toLowerCase();


        const isTendon =
          lower.includes("tendon") ||
          lower.includes("ligament") ||
          lower.includes("retinaculum") ||
          lower.includes("membrane");


        const material =
          isTendon
            ? tendonMaterial
            : muscleMaterial;


        const mesh =
          new THREE.Mesh(
            geometry,
            material
          );


        mesh.userData.rawName =
          rawName;


        mesh.userData.name =
          readableName(
            rawName
          );


        mesh.userData.group =
          classify(
            rawName
          );


        mesh.userData.originalMaterial =
          material;


        mesh.renderOrder = 1;


        body.add(mesh);

        muscleMeshes.push(mesh);

        count++;

      }
    );


    /*
      Load skeleton too.
    */

    loadingText.textContent =
      "Lade Skelett...";


    try {

      const skeletonGLTF =
        await loadGLB(
          loader,
          SKELETON_URL,
          70,
          100
        );


      skeletonGLTF.scene.traverse(
        child => {

          if (!child.isMesh)
            return;


          const geometry =
            child.geometry.clone();


          transformGeometry(
            geometry,
            anatomyCenter,
            scaleFactor
          );


          const bone =
            new THREE.Mesh(
              geometry,
              boneMaterial
            );


          bone.renderOrder = 0;


          skeleton.add(bone);

        }
      );

    } catch (skeletonError) {

      console.log(
        "Skelett konnte nicht geladen werden.",
        skeletonError
      );

    }


    /*
      Center body.
    */

    const finalBox =
      new THREE.Box3()
        .setFromObject(
          body
        );


    const finalCenter =
      finalBox.getCenter(
        new THREE.Vector3()
      );


    body.position.sub(
      finalCenter
    );


    /*
      Build sidebar.
    */

    buildMuscleList();


    status.textContent =
      count +
      " anatomische Strukturen";


    progressBar.style.width =
      "100%";


    loadingText.textContent =
      "Fertig";


    setTimeout(
      () => {
        loading.style.display =
          "none";
      },
      500
    );


  } catch (error) {

    console.error(
      "MODEL ERROR:",
      error
    );


    loadingText.innerHTML =
      "Fehler beim Laden des 3D-Modells.<br>" +
      "Bitte Seite einmal neu laden.";


    status.textContent =
      "Modell konnte nicht geladen werden";

  }

}


/* ==================================================
   SIDEBAR
================================================== */

let currentGroup = "all";


function buildMuscleList() {

  muscleList.innerHTML = "";


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    muscleMeshes.filter(
      mesh => {

        const name =
          mesh.userData.name
            .toLowerCase();


        const raw =
          mesh.userData.rawName
            .toLowerCase();


        const group =
          mesh.userData.group;


        const correctGroup =
          currentGroup === "all" ||
          group === currentGroup;


        const correctSearch =
          !search ||
          name.includes(search) ||
          raw.includes(search);


        return (
          correctGroup &&
          correctSearch
        );

      }
    );


  /*
    Limit sidebar rendering
    for iPad performance.
  */

  filtered
    .slice(0, 200)
    .forEach(mesh => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "muscle";


      element.textContent =
        mesh.userData.name;


      element.onclick =
        () => {

          selectMuscle(mesh);

          focusMuscle(mesh);

        };


      muscleList.appendChild(
        element
      );

    });

}


/* ==================================================
   SELECT MUSCLE
================================================== */

function selectMuscle(mesh) {

  if (selectedMesh) {

    selectedMesh.material =
      selectedMesh.userData
        .originalMaterial;

  }


  selectedMesh = mesh;


  mesh.material =
    selectedMaterial;


  const name =
    mesh.userData.name;


  infoName.textContent =
    name;


  const group =
    mesh.userData.group;


  const groupNames = {

    chest: "Brust",

    back: "Rücken",

    shoulders: "Schultern",

    arms: "Arme",

    abs: "Bauch",

    glutes: "Gesäß",

    legs: "Beine",

    all: "Anatomische Struktur"

  };


  infoType.textContent =
    groupNames[group] ||
    "Anatomische Struktur";


  exerciseList.innerHTML = "";


  const exercises =
    exerciseData[group];


  if (exercises) {

    exercises.forEach(
      exercise => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "exercise";

        div.textContent =
          exercise;

        exerciseList.appendChild(
          div
        );

      }
    );

  } else {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "exercise";

    div.textContent =
      "Für diese Struktur sind noch keine Übungen hinterlegt.";

    exerciseList.appendChild(
      div
    );

  }


  info.classList.add(
    "show"
  );

}


/* ==================================================
   FOCUS MUSCLE
================================================== */

function focusMuscle(mesh) {

  const box =
    new THREE.Box3()
      .setFromObject(mesh);


  const center =
    box.getCenter(
      new THREE.Vector3()
    );


  const size =
    box.getSize(
      new THREE.Vector3()
    );


  const maxSize =
    Math.max(
      size.x,
      size.y,
      size.z
    );


  controls.target.copy(
    center
  );


  const distance =
    Math.max(
      maxSize * 4,
      4
    );


  const direction =
    new THREE.Vector3()
      .subVectors(
        camera.position,
        controls.target
      )
      .normalize();


  camera.position.copy(
    center.clone()
      .add(
        direction.multiplyScalar(
          distance
        )
      )
  );


  controls.update();

}


/* ==================================================
   3D CLICK
================================================== */

const raycaster =
new THREE.Raycaster();

const mouse =
new THREE.Vector2();


renderer.domElement.addEventListener(
  "pointerdown",
  event => {

    const rect =
      renderer.domElement
        .getBoundingClientRect();


    mouse.x =
      ((event.clientX -
        rect.left) /
        rect.width) *
        2 - 1;


    mouse.y =
      -((event.clientY -
        rect.top) /
        rect.height) *
        2 + 1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hits =
      raycaster.intersectObjects(
        muscleMeshes,
        false
      );


    if (hits.length) {

      selectMuscle(
        hits[0].object
      );

    }

  }
);


/* ==================================================
   CAMERA
================================================== */

function frontView() {

  camera.position.set(
    0,
    0,
    36
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}


function backView() {

  camera.position.set(
    0,
    0,
    -36
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}


function sideView() {

  camera.position.set(
    36,
    0,
    0
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}


function resetView() {

  camera.position.set(
    0,
    0,
    36
  );

  controls.target.set(
    0,
    0,
    0
  );

  controls.update();

}

================================================== */

document.getElementById(

document.getElementById(

document

        .forEach(b =>
          b.classList.remove(

        );


      button.classList.add(

      );

      buildMuscleList();

  });


/* ==================================================
   SEARCH
================================================== */

document.getElementById(
  "search"
).addEventListener(
  "input",
  buildMuscleList
);


/* ==================================================
   MOBILE MENU
================================================== */

document.getElementById(
  "mobileMenu"
).onclick = () => {

  document.getElementById(
    "sidebar"
  ).classList.toggle(

  );

};


/* ==================================================
   ANIMATION
================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();


/* ==================================================
   START
================================================== */

loadBody();

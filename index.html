<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MuscleWeb</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0d10;
    color: #f2f3f5;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font-family: inherit;
}

#app {
    display: flex;
    width: 100%;
    height: 100%;
}

/* =========================
   LINKES MENÜ
========================= */

#sidebar {
    width: 270px;
    flex-shrink: 0;
    background: #111419;
    border-right: 1px solid #292e35;
    overflow-y: auto;
    z-index: 10;
}

.logo {
    padding: 24px 20px;
    border-bottom: 1px solid #292e35;
}

.logo h1 {
    margin: 0;
    font-size: 23px;
}

.logo p {
    margin: 6px 0 0;
    color: #858c96;
    font-size: 12px;
}

.search {
    padding: 14px;
    border-bottom: 1px solid #292e35;
}

.search input {
    width: 100%;
    height: 40px;
    border: 1px solid #343a43;
    border-radius: 8px;
    outline: none;
    background: #191d23;
    color: white;
    padding: 0 12px;
}

.categories {
    padding: 10px;
}

.category {
    width: 100%;
    border: 0;
    border-radius: 7px;
    padding: 11px 12px;
    margin-bottom: 3px;
    text-align: left;
    background: transparent;
    color: #aeb4bd;
    cursor: pointer;
}

.category:hover,
.category.active {
    background: #252b33;
    color: white;
}

.category-count {
    float: right;
    color: #6f7782;
}

/* =========================
   HAUPTBEREICH
========================= */

#main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

#topbar {
    height: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: #101318;
    border-bottom: 1px solid #292e35;
}

#currentRegion {
    font-size: 16px;
    font-weight: bold;
}

.top-buttons {
    display: flex;
    gap: 6px;
}

.control {
    height: 36px;
    padding: 0 11px;
    border: 1px solid #353b44;
    border-radius: 7px;
    background: #191d23;
    color: #cdd1d7;
    cursor: pointer;
}

.control:hover,
.control.active {
    background: #2a3038;
    color: white;
}

/* =========================
   3D VIEWER
========================= */

#viewer {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at center,
            #20252b 0%,
            #111419 48%,
            #080a0d 100%
        );
}

canvas {
    display: block;
}

/* =========================
   LOADING
========================= */

#loading {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0b0d10;
}

#loadingTitle {
    font-size: 20px;
    font-weight: bold;
}

#loadingText {
    margin-top: 8px;
    color: #858c96;
    font-size: 13px;
}

.progress {
    width: min(350px, 70vw);
    height: 5px;
    margin-top: 18px;
    background: #292e35;
    border-radius: 10px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #e7e9ec;
}

/* =========================
   3D BUTTONS
========================= */

.viewer-controls {
    position: absolute;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
}

.viewer-button {
    width: 44px;
    height: 44px;
    border: 1px solid #363c45;
    border-radius: 7px;
    background: rgba(18, 22, 27, 0.94);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.viewer-button:hover {
    background: #292f37;
}

/* =========================
   INFO
========================= */

#info {
    position: absolute;
    left: 18px;
    bottom: 18px;
    width: 290px;
    padding: 16px;
    display: none;
    background: rgba(16, 19, 24, 0.95);
    border: 1px solid #353b44;
    border-radius: 9px;
    z-index: 5;
}

#infoName {
    font-size: 16px;
    font-weight: bold;
}

#infoRegion {
    margin-top: 4px;
    color: #858c96;
    font-size: 12px;
}

#infoDescription {
    margin-top: 12px;
    color: #b8bec6;
    font-size: 12px;
    line-height: 1.5;
}

.info-buttons {
    display: flex;
    gap: 7px;
    margin-top: 13px;
}

.info-button {
    flex: 1;
    padding: 8px;
    border: 1px solid #383e47;
    border-radius: 6px;
    background: #1b2026;
    color: white;
    cursor: pointer;
}

/* =========================
   RECHTES MENÜ
========================= */

#rightPanel {
    width: 290px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: #111419;
    border-left: 1px solid #292e35;
}

.panel-header {
    padding: 19px;
    border-bottom: 1px solid #292e35;
}

.panel-title {
    font-size: 16px;
    font-weight: bold;
}

.panel-subtitle {
    margin-top: 5px;
    color: #7f8791;
    font-size: 12px;
}

#muscleList {
    flex: 1;
    overflow-y: auto;
    padding: 9px;
}

.muscle-item {
    width: 100%;
    padding: 10px;
    margin-bottom: 2px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #b9bec6;
    text-align: left;
    cursor: pointer;
}

.muscle-item:hover,
.muscle-item.selected {
    background: #292f37;
    color: white;
}

.muscle-type {
    margin-top: 3px;
    color: #707985;
    font-size: 10px;
}

#exercisePanel {
    padding: 14px;
    border-top: 1px solid #292e35;
    max-height: 230px;
    overflow-y: auto;
}

.exercise-title {
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: bold;
}

.exercise {
    padding: 7px 0;
    border-bottom: 1px solid #22272e;
    color: #aeb5be;
    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

#mobileMenu {
    display: none;
}

@media(max-width: 1000px) {

    #sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        transition: 0.2s;
    }

    #sidebar.open {
        left: 0;
    }

    #rightPanel {
        position: fixed;
        right: -300px;
        top: 0;
        bottom: 0;
        transition: 0.2s;
        z-index: 30;
    }

    #rightPanel.open {
        right: 0;
    }

    #mobileMenu {
        display: block;
    }

    #currentRegion {
        display: none;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- LINKES MENÜ -->

    <aside id="sidebar">

        <div class="logo">
            <h1>MuscleWeb</h1>
            <p>3D Muskulatur & Training</p>
        </div>

        <div class="search">
            <input
                id="search"
                type="text"
                placeholder="Muskel suchen..."
            >
        </div>

        <div class="categories">

            <button class="category active" data-region="Alle">
                Ganzkörper
                <span class="category-count" id="countAlle">0</span>
            </button>

            <button class="category" data-region="Brust">
                Brust
                <span class="category-count" id="countBrust">0</span>
            </button>

            <button class="category" data-region="Rücken">
                Rücken
                <span class="category-count" id="countRücken">0</span>
            </button>

            <button class="category" data-region="Schultern">
                Schultern
                <span class="category-count" id="countSchultern">0</span>
            </button>

            <button class="category" data-region="Arme">
                Arme
                <span class="category-count" id="countArme">0</span>
            </button>

            <button class="category" data-region="Bauch">
                Bauch
                <span class="category-count" id="countBauch">0</span>
            </button>

            <button class="category" data-region="Beine">
                Beine
                <span class="category-count" id="countBeine">0</span>
            </button>

            <button class="category" data-region="Gesäß">
                Gesäß
                <span class="category-count" id="countGesäß">0</span>
            </button>

        </div>

    </aside>


    <!-- MITTE -->

    <main id="main">

        <header id="topbar">

            <button
                class="control"
                id="mobileMenu"
            >
                Menü
            </button>

            <div id="currentRegion">
                Ganzkörper
            </div>

            <div class="top-buttons">

                <button class="control" id="front">
                    Vorne
                </button>

                <button class="control" id="back">
                    Hinten
                </button>

                <button class="control" id="side">
                    Seite
                </button>

                <button class="control" id="reset">
                    Reset
                </button>

                <button class="control" id="rightMenu">
                    Muskeln
                </button>

            </div>

        </header>


        <section id="viewer">

            <div id="loading">

                <div id="loadingTitle">
                    3D-Modell wird geladen
                </div>

                <div id="loadingText">
                    anatomy.glb wird geladen...
                </div>

                <div class="progress">
                    <div id="progressBar"></div>
                </div>

            </div>


            <div class="viewer-controls">

                <button
                    class="viewer-button"
                    id="zoomIn"
                    title="Hineinzoomen"
                >
                    +
                </button>

                <button
                    class="viewer-button"
                    id="zoomOut"
                    title="Herauszoomen"
                >
                    −
                </button>

                <button
                    class="viewer-button"
                    id="showAll"
                    title="Alles anzeigen"
                >
                    A
                </button>

            </div>


            <div id="info">

                <div id="infoName">
                    Muskel
                </div>

                <div id="infoRegion">
                    Region
                </div>

                <div id="infoDescription">
                    Wähle eine anatomische Struktur aus.
                </div>

                <div class="info-buttons">

                    <button
                        class="info-button"
                        id="isolate"
                    >
                        Isolieren
                    </button>

                    <button
                        class="info-button"
                        id="hide"
                    >
                        Ausblenden
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- RECHTES MENÜ -->

    <aside id="rightPanel">

        <div class="panel-header">

            <div class="panel-title">
                Muskeln
            </div>

            <div
                class="panel-subtitle"
                id="panelSubtitle"
            >
                Anatomische Strukturen
            </div>

        </div>

        <div id="muscleList"></div>

        <div id="exercisePanel">

            <div class="exercise-title">
                Übungen
            </div>

            <div id="exerciseList">
                Wähle einen Muskel aus.
            </div>

        </div>

    </aside>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================
   SZENE
========================= */

const viewer =
    document.getElementById("viewer");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x0b0d10);


/* =========================
   KAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        35,
        viewer.clientWidth /
        viewer.clientHeight,
        0.01,
        1000
    );

camera.position.set(
    0,
    0,
    4
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

viewer.appendChild(
    renderer.domElement
);


/* =========================
   LICHT
========================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x20242a,
        2.5
    )
);

const light1 =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light1.position.set(
    4,
    5,
    5
);

scene.add(light1);


const light2 =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

light2.position.set(
    -4,
    2,
    3
);

scene.add(light2);


/* =========================
   ORBIT CONTROLS
========================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.08;

controls.enablePan = false;


/*
 * WICHTIG:
 *
 * Vorher war maxDistance = 10.
 * Jetzt kann man bis 100 herauszoomen.
 */

controls.minDistance = 0.1;

controls.maxDistance = 100;

controls.zoomSpeed = 1.2;

controls.rotateSpeed = 0.7;

controls.target.set(
    0,
    0,
    0
);


/* =========================
   VARIABLEN
========================= */

let model = null;

let meshes = [];

let selectedMesh = null;

let selectedMaterial = null;

let currentRegion = "Alle";

let modelSize = 1;


/* =========================
   REGIONEN
========================= */

const keywords = {

    Brust: [
        "pect",
        "chest",
        "mamm",
        "thorax"
    ],

    Rücken: [
        "lat",
        "dorsi",
        "trapez",
        "rhombo",
        "erector",
        "multifid",
        "back"
    ],

    Schultern: [
        "deltoid",
        "supraspin",
        "infraspin",
        "teres",
        "shoulder"
    ],

    Arme: [
        "biceps",
        "triceps",
        "brachial",
        "brachio",
        "flexor",
        "extensor",
        "pronator",
        "supinator",
        "forearm"
    ],

    Bauch: [
        "rectus",
        "abdomin",
        "oblique",
        "transvers",
        "serratus"
    ],

    Beine: [
        "quadriceps",
        "quad",
        "femor",
        "hamstring",
        "sartorius",
        "tibial",
        "gastrocn",
        "soleus",
        "adductor",
        "gracilis",
        "vastus",
        "calf",
        "perone",
        "fibular"
    ],

    Gesäß: [
        "glute",
        "piriform",
        "buttock"
    ]

};


function detectRegion(name) {

    const n =
        name.toLowerCase();

    for (
        const region in keywords
    ) {

        for (
            const word of keywords[region]
        ) {

            if (
                n.includes(word)
            ) {
                return region;
            }

        }

    }

    return "Sonstiges";
}


/* =========================
   NAMEN
========================= */

function germanName(name) {

    const n =
        name.toLowerCase()
            .replace(
                /[^a-z0-9]/g,
                ""
            );

    const names = {

        pectoralismajor:
            "Großer Brustmuskel",

        pectoralisminor:
            "Kleiner Brustmuskel",

        pectoralis:
            "Brustmuskel",

        biceps:
            "Bizeps",

        triceps:
            "Trizeps",

        deltoid:
            "Deltamuskel",

        trapezius:
            "Trapezmuskel",

        latissimus:
            "Breiter Rückenmuskel",

        rectusabdominis:
            "Gerader Bauchmuskel",

        oblique:
            "Schräger Bauchmuskel",

        gluteusmaximus:
            "Großer Gesäßmuskel",

        gluteusmedius:
            "Mittlerer Gesäßmuskel",

        quadriceps:
            "Vierköpfiger Oberschenkelmuskel",

        rectusfemoris:
            "Gerader Oberschenkelmuskel",

        sartorius:
            "Schneidermuskel",

        gastrocnemius:
            "Zwillingswadenmuskel",

        soleus:
            "Schollenmuskel",

        brachialis:
            "Armbeuger",

        brachioradialis:
            "Oberarm-Speichenmuskel",

        rhomboid:
            "Rautenmuskel",

        erectorspinae:
            "Rückenstrecker"

    };


    for (
        const key in names
    ) {

        if (
            n.includes(key)
        ) {
            return names[key];
        }

    }

    return name
        .replaceAll("_", " ")
        .replaceAll("-", " ");
}


/* =========================
   ÜBUNGEN
========================= */

const exercises = {

    Brust: [
        "Bankdrücken",
        "Schrägbankdrücken",
        "Liegestütze",
        "Fliegende"
    ],

    Rücken: [
        "Klimmzüge",
        "Latzug",
        "Rudern",
        "Kreuzheben"
    ],

    Schultern: [
        "Schulterdrücken",
        "Seitheben",
        "Reverse Flys"
    ],

    Arme: [
        "Bizepscurls",
        "Hammercurls",
        "Trizepsdrücken"
    ],

    Bauch: [
        "Crunches",
        "Beinheben",
        "Plank",
        "Kabel-Crunches"
    ],

    Beine: [
        "Kniebeugen",
        "Beinpresse",
        "Beinstrecker",
        "Beinbeuger",
        "Wadenheben"
    ],

    Gesäß: [
        "Hip Thrusts",
        "Ausfallschritte",
        "Bulgarian Split Squats"
    ]

};


/* =========================
   MODELL LADEN
========================= */

const loader =
    new GLTFLoader();

loader.load(

    "./anatomy.glb",

    function(gltf) {

        model =
            gltf.scene;

        scene.add(model);


        /*
         * BodyExplorer-Modell ausrichten
         */

        model.rotation.x =
            -Math.PI / 2;


        meshes = [];


        model.traverse(
            object => {

                if (
                    !object.isMesh
                ) {
                    return;
                }


                object.castShadow =
                    true;

                object.receiveShadow =
                    true;


                if (
                    object.material
                ) {

                    object.material =
                        object.material.clone();

                    object.material.roughness =
                        0.7;

                    object.material.metalness =
                        0;

                }


                object.userData.region =
                    detectRegion(
                        object.name
                    );


                meshes.push(object);

            }
        );


        fitModel();

        updateCounts();

        updateList();


        document
            .getElementById("loading")
            .style.display = "none";

    },


    function(progress) {

        if (
            progress.total
        ) {

            const percent =
                Math.round(
                    progress.loaded /
                    progress.total *
                    100
                );

            document
                .getElementById(
                    "progressBar"
                )
                .style.width =
                percent + "%";

            document
                .getElementById(
                    "loadingText"
                )
                .textContent =
                "3D-Modell wird geladen – " +
                percent +
                "%";

        }

    },


    function(error) {

        console.error(
            error
        );

        document
            .getElementById(
                "loadingTitle"
            )
            .textContent =
            "Fehler beim Laden";

        document
            .getElementById(
                "loadingText"
            )
            .textContent =
            "anatomy.glb konnte nicht geladen werden.";

    }

);


/* =========================
   MODELL EINPASSEN
========================= */

function fitModel() {

    const box =
        new THREE.Box3()
            .setFromObject(model);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    model.position.sub(
        center
    );


    const box2 =
        new THREE.Box3()
            .setFromObject(model);

    const size =
        box2.getSize(
            new THREE.Vector3()
        );


    modelSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const distance =
        modelSize * 1.5;


    camera.position.set(
        0,
        0,
        distance
    );


    controls.target.set(
        0,
        0,
        0
    );

    controls.update();

}


/* =========================
   MUSKEL AUSWÄHLEN
========================= */

function selectMesh(mesh) {

    restoreSelection();


    selectedMesh =
        mesh;


    selectedMaterial =
        mesh.material;


    const material =
        mesh.material.clone();


    material.emissive =
        new THREE.Color(
            0x555555
        );

    material.emissiveIntensity =
        0.7;


    mesh.material =
        material;


    document
        .getElementById(
            "info"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "infoName"
        )
        .textContent =
        germanName(
            mesh.name
        );


    document
        .getElementById(
            "infoRegion"
        )
        .textContent =
        mesh.userData.region;


    showExercises(
        mesh.userData.region
    );


    updateList();

}


/* =========================
   AUSWAHL ZURÜCKSETZEN
========================= */

function restoreSelection() {

    if (
        selectedMesh &&
        selectedMaterial
    ) {

        selectedMesh.material =
            selectedMaterial;

    }

    selectedMesh = null;

    selectedMaterial = null;

}


/* =========================
   ÜBUNGEN
========================= */

function showExercises(region) {

    const list =
        document.getElementById(
            "exerciseList"
        );

    list.innerHTML = "";


    const data =
        exercises[region] ||
        [
            "Keine Übungen hinterlegt."
        ];


    data.forEach(
        exercise => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "exercise";

            div.textContent =
                exercise;

            list.appendChild(
                div
            );

        }
    );

}


/* =========================
   MUSKELLISTE
========================= */

function updateList() {

    const list =
        document.getElementById(
            "muscleList"
        );

    list.innerHTML = "";


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    let filtered =
        meshes.filter(
            mesh => {

                if (
                    currentRegion !==
                    "Alle" &&
                    mesh.userData.region !==
                    currentRegion
                ) {
                    return false;
                }


                if (!search) {
                    return true;
                }


                return (
                    germanName(
                        mesh.name
                    )
                    .toLowerCase()
                    .includes(search)
                    ||
                    mesh.name
                        .toLowerCase()
                        .includes(search)
                );

            }
        );


    filtered.forEach(
        mesh => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "muscle-item";


            if (
                mesh ===
                selectedMesh
            ) {

                button.classList.add(
                    "selected"
                );

            }


            const name =
                document.createElement(
                    "div"
                );

            name.textContent =
                germanName(
                    mesh.name
                );


            const type =
                document.createElement(
                    "div"
                );

            type.className =
                "muscle-type";

            type.textContent =
                mesh.userData.region;


            button.appendChild(
                name
            );

            button.appendChild(
                type
            );


            button.addEventListener(
                "click",
                () => {

                    selectMesh(
                        mesh
                    );

                    focusMesh(
                        mesh
                    );

                }
            );


            list.appendChild(
                button
            );

        }
    );


    document
        .getElementById(
            "panelSubtitle"
        )
        .textContent =
        filtered.length +
        " Strukturen";

}


/* =========================
   MUSKEL FOKUS
========================= */

function focusMesh(mesh) {

    const box =
        new THREE.Box3()
            .setFromObject(mesh);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const distance =
        Math.max(
            Math.max(
                size.x,
                size.y,
                size.z
            ) * 4,
            0.5
        );


    const direction =
        new THREE.Vector3()
            .subVectors(
                camera.position,
                controls.target
            )
            .normalize();


    controls.target.copy(
        center
    );


    camera.position.copy(
        center.clone().add(
            direction.multiplyScalar(
                distance
            )
        )
    );


    controls.update();

}


/* =========================
   3D CLICK
========================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        const rect =
            renderer.domElement
                .getBoundingClientRect();


        mouse.x =
            (
                event.clientX -
                rect.left
            ) /
            rect.width *
            2 -
            1;


        mouse.y =
            -(
                event.clientY -
                rect.top
            ) /
            rect.height *
            2 +
            1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                meshes,
                true
            );


        if (
            hits.length
        ) {

            selectMesh(
                hits[0].object
            );

        }

    }
);


/* =========================
   REGIONEN
========================= */

document
    .querySelectorAll(
        ".category"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(
                            b =>
                            b.classList
                                .remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    currentRegion =
                        button.dataset.region;


                    document
                        .getElementById(
                            "currentRegion"
                        )
                        .textContent =
                        currentRegion ===
                        "Alle"
                            ? "Ganzkörper"
                            : currentRegion;


                    updateList();

                }
            );

        }
    );


/* =========================
   SUCHE
========================= */

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        updateList
    );


/* =========================
   ISOLIEREN
========================= */

document
    .getElementById(
        "isolate"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !selectedMesh
            ) {
                return;
            }


            meshes.forEach(
                mesh => {

                    mesh.visible =
                        mesh ===
                        selectedMesh;

                }
            );

        }
    );


/* =========================
   AUSBLENDEN
========================= */

document
    .getElementById(
        "hide"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !selectedMesh
            ) {
                return;
            }


            selectedMesh.visible =
                false;


            restoreSelection();


            document
                .getElementById(
                    "info"
                )
                .style.display =
                "none";

        }
    );


/* =========================
   ALLES ANZEIGEN
========================= */

document
    .getElementById(
        "showAll"
    )
    .addEventListener(
        "click",
        () => {

            meshes.forEach(
                mesh => {

                    mesh.visible =
                        true;

                }
            );

        }
    );


/* =========================
   ZOOM REIN
========================= */

document
    .getElementById(
        "zoomIn"
    )
    .addEventListener(
        "click",
        () => {

            const direction =
                new THREE.Vector3()
                    .subVectors(
                        camera.position,
                        controls.target
                    )
                    .normalize();


            const distance =
                camera.position.distanceTo(
                    controls.target
                );


            const newDistance =
                Math.max(
                    distance * 0.75,
                    0.1
                );


            camera.position.copy(
                controls.target
                    .clone()
                    .add(
                        direction.multiplyScalar(
                            newDistance
                        )
                    )
            );


            controls.update();

        }
    );


/* =========================
   ZOOM RAUS
========================= */

document
    .getElementById(
        "zoomOut"
    )
    .addEventListener(
        "click",
        () => {

            const direction =
                new THREE.Vector3()
                    .subVectors(
                        camera.position,
                        controls.target
                    )
                    .normalize();


            const distance =
                camera.position.distanceTo(
                    controls.target
                );


            /*
             * Hier ist jetzt 100
             * das Maximum.
             */

            const newDistance =
                Math.min(
                    distance * 1.35,
                    100
                );


            camera.position.copy(
                controls.target
                    .clone()
                    .add(
                        direction.multiplyScalar(
                            newDistance
                        )
                    )
            );


            controls.update();

        }
    );


/* =========================
   VORDERANSICHT
========================= */

document
    .getElementById(
        "front"
    )
    .addEventListener(
        "click",
        () => {

            camera.position.set(
                0,
                0,
                modelSize * 1.7
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();

        }
    );


/* =========================
   RÜCKANSICHT
========================= */

document
    .getElementById(
        "back"
    )
    .addEventListener(
        "click",
        () => {

            camera.position.set(
                0,
                0,
                -modelSize * 1.7
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();

        }
    );


/* =========================
   SEITENANSICHT
========================= */

document
    .getElementById(
        "side"
    )
    .addEventListener(
        "click",
        () => {

            camera.position.set(
                modelSize * 1.7,
                0,
                0
            );

            controls.target.set(
                0,
                0,
                0
            );

            controls.update();

        }
    );


/* =========================
   RESET
========================= */

document
    .getElementById(
        "reset"
    )
    .addEventListener(
        "click",
        () => {

            meshes.forEach(
                mesh => {

                    mesh.visible =
                        true;

                }
            );


            restoreSelection();


            document
                .getElementById(
                    "info"
                )
                .style.display =
                "none";


            fitModel();

        }
    );


/* =========================
   MOBILE MENÜ
========================= */

document
    .getElementById(
        "mobileMenu"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "sidebar"
                )
                .classList.toggle(
                    "open"
                );

        }
    );


document
    .getElementById(
        "rightMenu"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "rightPanel"
                )
                .classList.toggle(
                    "open"
                );

        }
    );


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            viewer.clientWidth /
            viewer.clientHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            viewer.clientWidth,
            viewer.clientHeight
        );

    }
);


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>

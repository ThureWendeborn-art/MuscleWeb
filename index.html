<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   SCENE
===================================================== */

const viewer =
    document.getElementById("viewer");

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x07090c);


const camera =
    new THREE.PerspectiveCamera(
        45,
        viewer.clientWidth /
        viewer.clientHeight,
        0.01,
        1000
    );

camera.position.set(
    0,
    0,
    7
);


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

viewer.appendChild(
    renderer.domElement
);


/* =====================================================
   LICHT
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x30333a,
        2.5
    )
);

const light1 =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light1.position.set(
    5,8,6
);

scene.add(light1);


const light2 =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

light2.position.set(
    -5,3,4
);

scene.add(light2);


/* =====================================================
   CONTROLS
===================================================== */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;
controls.dampingFactor = .07;

controls.enablePan = true;
controls.screenSpacePanning = true;

controls.minDistance = .1;
controls.maxDistance = 100;

controls.rotateSpeed = .7;
controls.zoomSpeed = 1.2;


/* =====================================================
   MODELLE
===================================================== */

let anatomyModel = null;
let skeletonModel = null;

let modelMeshes = [];

let selectedMesh = null;

let skeletonVisible = false;
let labelsVisible = false;

let currentRegion = "all";


/* =====================================================
   NAMEN
===================================================== */

const names = {

    pectoralismajor:"Großer Brustmuskel",
    pectoralisminor:"Kleiner Brustmuskel",

    deltoid:"Deltamuskel",
    deltoideus:"Deltamuskel",

    trapezius:"Trapezmuskel",

    latissimusdorsi:"Breiter Rückenmuskel",
    latissimus:"Breiter Rückenmuskel",

    rhomboid:"Rautenmuskel",

    erectorspinae:"Rückenstrecker",

    bicepsbrachii:"Bizeps",
    biceps:"Bizeps",

    tricepsbrachii:"Trizeps",
    triceps:"Trizeps",

    brachialis:"Armbeuger",
    brachioradialis:"Oberarm-Speichenmuskel",

    rectusabdominis:"Gerader Bauchmuskel",

    obliquusexternus:"Äußerer schräger Bauchmuskel",
    obliquusexternal:"Äußerer schräger Bauchmuskel",

    obliquusinternus:"Innerer schräger Bauchmuskel",
    obliquusinternal:"Innerer schräger Bauchmuskel",

    transversusabdominis:"Querer Bauchmuskel",

    serratusanterior:"Sägezahnmuskel",

    gluteusmaximus:"Großer Gesäßmuskel",
    gluteusmedius:"Mittlerer Gesäßmuskel",
    gluteusminimus:"Kleiner Gesäßmuskel",

    rectusfemoris:"Gerader Oberschenkelmuskel",
    vastuslateralis:"Äußerer Oberschenkelmuskel",
    vastusmedialis:"Innerer Oberschenkelmuskel",
    vastusintermedius:"Mittlerer Oberschenkelmuskel",

    quadriceps:"Quadrizeps",

    bicepsfemoris:"Bizeps femoris",

    semitendinosus:"Halbsehnenmuskel",
    semimembranosus:"Plattsehnenmuskel",

    sartorius:"Schneidermuskel",

    gastrocnemius:"Zwillingswadenmuskel",
    soleus:"Schollenmuskel",

    tibialisanterior:"Vorderer Schienbeinmuskel",
    tibialisposterior:"Hinterer Schienbeinmuskel",

    peroneuslongus:"Langer Wadenbeinmuskel",
    peroneusbrevis:"Kurzer Wadenbeinmuskel",

    adductormagnus:"Großer Adduktor",
    adductorlongus:"Langer Adduktor",
    adductorbrevis:"Kurzer Adduktor",
    adductorminimus:"Kleiner Adduktor",

    gracilis:"Schlanker Muskel",

    pectineus:"Kammmuskel",

    supraspinatus:"Obergrätenmuskel",
    infraspinatus:"Untergrätenmuskel",

    teresmajor:"Großer Rundmuskel",
    teresminor:"Kleiner Rundmuskel",

    subscapularis:"Unterschulterblattmuskel",

    sternocleidomastoideus:"Kopfwender",

    masseter:"Kaumuskel",
    temporalis:"Schläfenmuskel"

};


/* =====================================================
   WICHTIGE MUSKELN
===================================================== */

const important = [

    "pectoralis",
    "deltoid",
    "trapezius",
    "latissimus",
    "rhomboid",
    "erector",

    "biceps",
    "triceps",
    "brachialis",
    "brachioradialis",

    "rectusab",
    "obliquus",
    "transversusab",
    "serratus",

    "gluteus",

    "quadriceps",
    "rectusfemoris",
    "vastus",

    "bicepsfemoris",
    "semitendinosus",
    "semimembranosus",

    "sartorius",

    "gastrocnemius",
    "soleus",

    "tibialisanterior",

    "adductor",
    "gracilis",

    "supraspinatus",
    "infraspinatus",

    "teresmajor",
    "teresminor",

    "sternocleidomastoideus"

];


/* =====================================================
   ÜBUNGEN
===================================================== */

const exercises = {

    chest:[
        "Bankdrücken",
        "Schrägbankdrücken",
        "Dips",
        "Liegestütze"
    ],

    back:[
        "Klimmzüge",
        "Latzug",
        "Rudern",
        "Kreuzheben"
    ],

    shoulders:[
        "Schulterdrücken",
        "Seitheben",
        "Frontheben",
        "Reverse Flys"
    ],

    arms:[
        "Bizeps-Curls",
        "Hammer Curls",
        "Trizepsdrücken",
        "Dips"
    ],

    abs:[
        "Crunches",
        "Beinheben",
        "Plank",
        "Cable Crunches"
    ],

    legs:[
        "Kniebeugen",
        "Beinpresse",
        "Beinstrecker",
        "Beinbeuger"
    ],

    glutes:[
        "Hip Thrusts",
        "Ausfallschritte",
        "Bulgarian Split Squats",
        "Kniebeugen"
    ]

};


/* =====================================================
   NAMEN ERMITTELN
===================================================== */

function cleanName(mesh){

    const raw =
        (mesh.name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"");


    const keys =
        Object.keys(names)
        .sort(
            (a,b)=>b.length-a.length
        );


    for(const key of keys){

        if(raw.includes(key)){
            return names[key];
        }

    }


    return (mesh.name || "Muskel")
        .replace(/_/g," ")
        .replace(/-/g," ");

}


/* =====================================================
   REGION
===================================================== */

function getRegion(mesh){

    const text =
        (
            (mesh.name || "")+
            " "+
            (mesh.parent?.name || "")
        ).toLowerCase();


    if(
        text.includes("pector") ||
        text.includes("chest")
    ){
        return "chest";
    }


    if(
        text.includes("trapez") ||
        text.includes("latiss") ||
        text.includes("rhombo") ||
        text.includes("erector")
    ){
        return "back";
    }


    if(
        text.includes("delto") ||
        text.includes("shoulder") ||
        text.includes("supraspin") ||
        text.includes("infraspin") ||
        text.includes("teres")
    ){
        return "shoulders";
    }


    if(
        text.includes("biceps") ||
        text.includes("triceps") ||
        text.includes("brach") ||
        text.includes("pronator") ||
        text.includes("supinator") ||
        text.includes("flexor") ||
        text.includes("extensor")
    ){
        return "arms";
    }


    if(
        text.includes("rectusab") ||
        text.includes("obliqu") ||
        text.includes("transvers") ||
        text.includes("serratus")
    ){
        return "abs";
    }


    if(
        text.includes("glute")
    ){
        return "glutes";
    }


    if(
        text.includes("femor") ||
        text.includes("quadriceps") ||
        text.includes("vastus") ||
        text.includes("hamstring") ||
        text.includes("gastrocn") ||
        text.includes("soleus") ||
        text.includes("tibial") ||
        text.includes("adductor") ||
        text.includes("sartorius") ||
        text.includes("gracilis") ||
        text.includes("pectineus")
    ){
        return "legs";
    }


    return "all";

}


/* =====================================================
   WICHTIG?
===================================================== */

function isImportant(mesh){

    const text =
        (mesh.name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"");


    return important.some(
        key=>text.includes(key)
    );

}


/* =====================================================
   ANATOMIE LADEN
===================================================== */

function loadAnatomy(){

    return new Promise(
        (resolve,reject)=>{

            const loader =
                new GLTFLoader();


            loader.load(

                "./anatomy.glb",

                gltf=>{

                    anatomyModel =
                        gltf.scene;


                    /*
                        Gleiche Rotation für beide GLBs.
                    */

                    anatomyModel.rotation.x =
                        -Math.PI/2;


                    scene.add(
                        anatomyModel
                    );


                    anatomyModel.traverse(
                        object=>{

                            if(!object.isMesh){
                                return;
                            }


                            object.frustumCulled =
                                false;


                            object.material =
                                new THREE.MeshStandardMaterial({

                                    color:0xb86167,

                                    roughness:.72,

                                    metalness:.02,

                                    transparent:false,

                                    opacity:1,

                                    depthWrite:true

                                });


                            object.userData.displayName =
                                cleanName(object);


                            object.userData.region =
                                getRegion(object);


                            object.userData.important =
                                isImportant(object);


                            modelMeshes.push(
                                object
                            );

                        }
                    );


                    resolve();

                },

                event=>{

                    if(event.lengthComputable){

                        const percentage =
                            event.loaded /
                            event.total *
                            100;


                        document.getElementById(
                            "progress"
                        ).style.width =
                            percentage+"%";

                    }

                },

                error=>{
                    reject(error);
                }

            );

        }
    );

}


/* =====================================================
   SKELETT LADEN
===================================================== */

function loadSkeleton(){

    return new Promise(
        resolve=>{

            const loader =
                new GLTFLoader();


            loader.load(

                "./skeleton.glb",

                gltf=>{

                    skeletonModel =
                        gltf.scene;


                    /*
                        Exakt gleiche Rotation.
                    */

                    skeletonModel.rotation.x =
                        -Math.PI/2;


                    skeletonModel.traverse(
                        object=>{

                            if(!object.isMesh){
                                return;
                            }


                            object.frustumCulled =
                                false;


                            object.material =
                                new THREE.MeshStandardMaterial({

                                    color:0xe3ded2,

                                    roughness:.8,

                                    metalness:0,

                                    transparent:true,

                                    opacity:.85,

                                    depthWrite:false,

                                    depthTest:true

                                });


                            object.renderOrder=0;

                        }
                    );


                    skeletonModel.visible=false;


                    scene.add(
                        skeletonModel
                    );


                    resolve();

                },

                undefined,

                error=>{

                    console.error(
                        "Skelett konnte nicht geladen werden:",
                        error
                    );

                    resolve();

                }

            );

        }
    );

}


/* =====================================================
   GEMEINSAME AUSRICHTUNG
===================================================== */

function alignModels(){

    /*
        WICHTIGER FIX:

        Wir bestimmen den Mittelpunkt der Anatomie
        NACH der Rotation.

        Danach bekommt BEIDE Modelle:
        - denselben Maßstab
        - dieselbe Position
        - dieselbe Rotation
    */


    const box =
        new THREE.Box3()
        .setFromObject(
            anatomyModel
        );


    const center =
        new THREE.Vector3();

    box.getCenter(
        center
    );


    const size =
        new THREE.Vector3();

    box.getSize(
        size
    );


    const height =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(height<=0){
        return;
    }


    const scale =
        6/height;


    /*
        Ganz wichtig:

        position = -center * scale

        NICHT einfach -center.
    */

    const finalPosition =
        center.clone()
        .multiplyScalar(-scale);


    anatomyModel.scale.setScalar(
        scale
    );

    skeletonModel.scale.setScalar(
        scale
    );


    anatomyModel.position.copy(
        finalPosition
    );

    skeletonModel.position.copy(
        finalPosition
    );


    /*
        Sicherheitscheck:
        exakt gleiche Rotation.
    */

    skeletonModel.rotation.copy(
        anatomyModel.rotation
    );

}


/* =====================================================
   MUSKEL-LISTE
===================================================== */

function buildMuscleList(){

    const list =
        document.getElementById(
            "muscle-list"
        );


    list.innerHTML="";


    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    const unique =
        new Map();


    for(const mesh of modelMeshes){

        if(!mesh.userData.important){
            continue;
        }


        if(
            currentRegion !== "all" &&
            mesh.userData.region !== currentRegion
        ){
            continue;
        }


        const name =
            mesh.userData.displayName;


        if(
            search &&
            !name
                .toLowerCase()
                .includes(search)
        ){
            continue;
        }


        if(!unique.has(name)){
            unique.set(
                name,
                mesh
            );
        }

    }


    document.getElementById(
        "muscle-count"
    ).textContent =
        unique.size+
        (unique.size===1
            ?" Muskel"
            :" Muskeln");


    for(
        const [name,mesh]
        of unique
    ){

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "muscle-item";


        item.textContent =
            name;


        if(
            selectedMesh &&
            selectedMesh.userData.displayName === name
        ){
            item.classList.add(
                "active"
            );
        }


        item.onclick =
            ()=>selectMesh(mesh);


        list.appendChild(
            item
        );

    }

}


/* =====================================================
   MUSKEL AUSWÄHLEN
===================================================== */

function selectMesh(mesh){

    selectedMesh =
        mesh;


    restoreMuscles();


    mesh.material.color.set(
        0xf0a0a6
    );


    mesh.material.emissive.set(
        0x42151a
    );


    mesh.material.emissiveIntensity =
        .45;


    document.getElementById(
        "detail-panel"
    ).style.display =
        "block";


    document.getElementById(
        "detail-name"
    ).textContent =
        mesh.userData.displayName;


    const regionNames = {

        chest:"Brust",
        back:"Rücken",
        shoulders:"Schultern",
        arms:"Arme",
        abs:"Bauch",
        legs:"Beine",
        glutes:"Gesäß"

    };


    document.getElementById(
        "detail-region"
    ).textContent =
        regionNames[
            mesh.userData.region
        ] || "Körper";


    const list =
        document.getElementById(
            "exercise-list"
        );


    list.innerHTML="";


    (
        exercises[
            mesh.userData.region
        ] || []
    ).forEach(
        exercise=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "exercise";


            div.textContent =
                exercise;


            list.appendChild(
                div
            );

        }
    );


    buildMuscleList();


    focusMesh(
        mesh
    );

}


/* =====================================================
   MUSKELN ZURÜCKSETZEN
===================================================== */

function restoreMuscles(){

    modelMeshes.forEach(
        mesh=>{

            mesh.material.color.set(
                0xb86167
            );

            mesh.material.emissive.set(
                0x000000
            );

            mesh.material.emissiveIntensity =
                0;

            mesh.material.transparent =
                skeletonVisible;

            mesh.material.opacity =
                skeletonVisible
                    ?0.82
                    :1;

            mesh.material.depthWrite =
                !skeletonVisible;

        }
    );

}


/* =====================================================
   SKELETT
===================================================== */

function toggleSkeleton(){

    if(!skeletonModel){
        alert(
            "skeleton.glb konnte nicht geladen werden."
        );
        return;
    }


    skeletonVisible =
        !skeletonVisible;


    skeletonModel.visible =
        skeletonVisible;


    if(skeletonVisible){

        modelMeshes.forEach(
            mesh=>{

                mesh.material.transparent =
                    true;

                mesh.material.opacity =
                    .82;

                mesh.material.depthWrite =
                    false;

            }
        );

    }else{

        restoreMuscles();

    }


    const button =
        document.getElementById(
            "skeletonBtn"
        );


    button.classList.toggle(
        "active",
        skeletonVisible
    );


    button.textContent =
        skeletonVisible
            ?"Skelett an"
            :"Skelett";

}


/* =====================================================
   FOKUS
===================================================== */

function focusMesh(mesh){

    const box =
        new THREE.Box3()
        .setFromObject(
            mesh
        );


    const center =
        new THREE.Vector3();

    box.getCenter(
        center
    );


    const size =
        new THREE.Vector3();

    box.getSize(
        size
    );


    const distance =
        Math.max(
            size.x,
            size.y,
            size.z
        )*4;


    camera.position.set(
        center.x,
        center.y,
        center.z+
        Math.max(
            distance,
            1
        )
    );


    controls.target.copy(
        center
    );


    controls.update();

}


/* =====================================================
   ISOLIEREN
===================================================== */

function isolateSelected(){

    if(!selectedMesh){
        return;
    }


    modelMeshes.forEach(
        mesh=>{

            if(mesh===selectedMesh){

                mesh.material.transparent =
                    false;

                mesh.material.opacity =
                    1;

            }else{

                mesh.material.transparent =
                    true;

                mesh.material.opacity =
                    .06;

            }

        }
    );

}


/* =====================================================
   DURCHSICHTIG
===================================================== */

function transparentSelected(){

    if(!selectedMesh){
        return;
    }


    selectedMesh.material.transparent =
        true;

    selectedMesh.material.opacity =
        .08;

}


/* =====================================================
   ALLES
===================================================== */

function showAll(){

    modelMeshes.forEach(
        mesh=>{
            mesh.visible=true;
        }
    );


    selectedMesh=null;


    document.getElementById(
        "detail-panel"
    ).style.display =
        "none";


    restoreMuscles();

    buildMuscleList();

}


/* =====================================================
   ANSICHTEN
===================================================== */

function front(){

    camera.position.set(
        0,0,7
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


function back(){

    camera.position.set(
        0,0,-7
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


function side(){

    camera.position.set(
        7,0,0
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


function reset(){

    showAll();

    camera.position.set(
        0,0,7
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


/* =====================================================
   ZOOM
===================================================== */

function zoom(factor){

    const direction =
        new THREE.Vector3()
        .subVectors(
            camera.position,
            controls.target
        )
        .normalize();


    const distance =
        camera.position.distanceTo(
            controls.target
        );


    const newDistance =
        Math.min(
            Math.max(
                distance*factor,
                .1
            ),
            100
        );


    camera.position.copy(
        controls.target
        .clone()
        .add(
            direction.multiplyScalar(
                newDistance
            )
        );

}


/* =====================================================
   LABELS
===================================================== */

const labels = new Map();


function createLabels(){

    for(const mesh of modelMeshes){

        if(!mesh.userData.important){
            continue;
        }


        const label =
            document.createElement(
                "div"
            );


        label.className =
            "muscle-label";


        label.textContent =
            mesh.userData.displayName;


        viewer.appendChild(
            label
        );


        labels.set(
            mesh,
            label
        );

    }

}


function updateLabels(){

    labels.forEach(
        (label,mesh)=>{

            if(
                !labelsVisible ||
                !mesh.visible
            ){

                label.classList.remove(
                    "visible"
                );

                return;

            }


            const box =
                new THREE.Box3()
                .setFromObject(
                    mesh
                );


            const center =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            const p =
                center.clone()
                .project(camera);


            if(p.z>1){

                label.classList.remove(
                    "visible"
                );

                return;

            }


            label.style.left =
                (
                    (p.x*.5+.5)*
                    viewer.clientWidth
                )+"px";


            label.style.top =
                (
                    (-p.y*.5+.5)*
                    viewer.clientHeight
                )+"px";


            label.classList.add(
                "visible"
            );


            label.classList.toggle(
                "selected",
                mesh===selectedMesh
            );

        }
    );

}


/* =====================================================
   REGIONEN
===================================================== */

document.querySelectorAll(
    ".region-btn"
).forEach(
    button=>{

        button.onclick =
            ()=>{

                document.querySelectorAll(
                    ".region-btn"
                ).forEach(
                    b=>{
                        b.classList.remove(
                            "active"
                        );
                    }
                );


                button.classList.add(
                    "active"
                );


                currentRegion =
                    button.dataset.region;


                const regionNames = {

                    all:"Ganzkörper",
                    chest:"Brust",
                    back:"Rücken",
                    shoulders:"Schultern",
                    arms:"Arme",
                    abs:"Bauch",
                    legs:"Beine",
                    glutes:"Gesäß"

                };


                document.getElementById(
                    "panel-title"
                ).textContent =
                    regionNames[
                        currentRegion
                    ];


                buildMuscleList();

            };

    }
);


/* =====================================================
   EVENTS
===================================================== */

document.getElementById(
    "search"
).oninput =
    buildMuscleList;


document.getElementById(
    "skeletonBtn"
).onclick =
    toggleSkeleton;


document.getElementById(
    "frontBtn"
).onclick =
    front;


document.getElementById(
    "backBtn"
).onclick =
    back;


document.getElementById(
    "sideBtn"
).onclick =
    side;


document.getElementById(
    "resetBtn"
).onclick =
    reset;


document.getElementById(
    "zoomInBtn"
).onclick =
    ()=>zoom(.7);


document.getElementById(
    "zoomOutBtn"
).onclick =
    ()=>zoom(1.4);


document.getElementById(
    "labelsBtn"
).onclick =
    ()=>{

        labelsVisible =
            !labelsVisible;


        document.getElementById(
            "labelsBtn"
        ).classList.toggle(
            "active",

        );

    };


document.getElementById(
    "focusBtn"
).onclick =
    ()=>{
        if(selectedMesh){
            focusMesh(
                selectedMesh
            );
        }
    };


document.getElementById(
    "isolateBtn"
).onclick =
    isolateSelected;


document.getElementById(
    "transparentBtn"
).onclick =
    transparentSelected;


document.getElementById(
    "showAllBtn"
).onclick =
    showAll;


document.getElementById(
    "mobile-menu"
).onclick =
    ()=>{
        document.getElementById(
            "sidebar"
        ).classList.toggle(
            "open"
        );
    };


/* =====================================================
   DOPPELKLICK AUF MUSKEL
===================================================== */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "dblclick",
    event=>{

        const rect =
            renderer.domElement
            .getBoundingClientRect();


        pointer.x =
            (
                (event.clientX-rect.left)/
                rect.width
            )*2-1;


        pointer.y =
            -(
                (event.clientY-rect.top)/
                rect.height
            )*2+1;


        raycaster.setFromCamera(
            pointer,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                modelMeshes.filter(
                    mesh=>mesh.visible
                ),
                true
            );


        if(!hits.length){
            return;
        }


        let mesh =
            hits[0].object;


        while(
            mesh &&
            !mesh.userData.displayName &&
            mesh.parent
        ){
            mesh =
                mesh.parent;
        }


        if(
            mesh &&
            mesh.userData.displayName
        ){
            selectMesh(mesh);
        }

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            viewer.clientWidth /
            viewer.clientHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            viewer.clientWidth,
            viewer.clientHeight
        );

    }
);


/* =====================================================
   RENDER
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    controls.update();

    updateLabels();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        document.getElementById(
            "loadingText"
        ).textContent =
            "Anatomie wird geladen...";


        await loadAnatomy();


        document.getElementById(
            "loadingText"
        ).textContent =
            "Skelett wird geladen...";


        await loadSkeleton();


        /*
            JETZT kommt der entscheidende
            gemeinsame Alignment-Schritt.
        */

        if(
            anatomyModel &&
            skeletonModel
        ){

            alignModels();

        }


        createLabels();

        buildMuscleList();


        camera.position.set(
            0,
            0,
            7
        );


        controls.target.set(
            0,
            0,
            0
        );


        controls.update();


        document.getElementById(
            "loadingText"
        ).textContent =
            "Fertig";


        setTimeout(
            ()=>{
                const loading =
                    document.getElementById(
                        "loading"
                    );

                loading.style.opacity =
                    "0";


                setTimeout(
                    ()=>{
                        loading.style.display =
                            "none";
                    },
                    450
                );

            },
            200
        );


    }catch(error){

        console.error(error);


        document.getElementById(
            "loadingText"
        ).textContent =
            "Fehler beim Laden";


        const errorBox =
            document.getElementById(
                "error-box"
            );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "anatomy.glb oder skeleton.glb konnte nicht geladen werden. Bitte überprüfe, dass beide Dateien direkt neben index.html liegen.";

    }

}

start();

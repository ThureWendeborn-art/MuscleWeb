<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>MuscleWeb – 3D Anatomie</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07090c;
    color:#f4f5f7;
    font-family:Inter,Arial,Helvetica,sans-serif;
}

button,input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

#app{
    width:100%;
    height:100%;
    display:flex;
}

/* ================= SIDEBAR ================= */

#sidebar{
    width:270px;
    min-width:270px;
    height:100%;
    background:#0d1014;
    border-right:1px solid #252a31;
    display:flex;
    flex-direction:column;
    z-index:30;
}

.logo{
    padding:25px 22px 21px;
    border-bottom:1px solid #242930;
}

.logo-title{
    font-size:25px;
    font-weight:800;
    letter-spacing:-.7px;
}

.logo-subtitle{
    color:#747d89;
    font-size:12px;
    margin-top:5px;
}

.section-title{
    padding:20px 18px 9px;
    color:#69727e;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.region-list{
    padding:0 10px;
}

.region-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#aeb5bf;
    text-align:left;
    padding:12px 13px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:2px;
    transition:.15s;
}

.region-btn:hover{
    background:#181d23;
    color:white;
}

.region-btn.active{
    background:#252b34;
    color:#fff;
}

.sidebar-bottom{
    margin-top:auto;
    padding:16px;
    border-top:1px solid #242930;
}

.small-info{
    color:#626b76;
    font-size:10px;
    line-height:1.55;
}

/* ================= MAIN ================= */

#main{
    flex:1;
    min-width:0;
    height:100%;
    position:relative;
}

#viewer{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* ================= TOP ================= */

#topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:75px;
    padding:15px 18px;
    display:flex;
    align-items:center;
    gap:9px;
    z-index:10;
    pointer-events:none;
}

#search{
    width:min(380px,43vw);
    height:43px;
    padding:0 14px;
    border:1px solid #2a3038;
    border-radius:9px;
    background:rgba(14,17,22,.94);
    color:white;
    outline:none;
    pointer-events:auto;
}

#search::placeholder{
    color:#69727d;
}

#search:focus{
    border-color:#4c5561;
}

.top-space{
    flex:1;
}

.top-btn{
    height:43px;
    padding:0 14px;
    border:1px solid #2a3038;
    border-radius:9px;
    background:rgba(14,17,22,.94);
    color:#d9dde2;
    cursor:pointer;
    pointer-events:auto;
}

.top-btn:hover{
    background:#1b2027;
}

/* ================= MUSCLE PANEL ================= */

#muscle-panel{
    position:absolute;
    top:88px;
    left:18px;
    width:300px;
    max-height:calc(100% - 110px);
    background:rgba(13,16,21,.96);
    border:1px solid #292f37;
    border-radius:12px;
    overflow:hidden;
    z-index:8;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.panel-header{
    padding:15px 15px 12px;
    border-bottom:1px solid #292f37;
}

.panel-title{
    font-size:16px;
    font-weight:750;
}

.panel-subtitle{
    margin-top:4px;
    color:#69727d;
    font-size:11px;
}

#muscle-count{
    margin-top:8px;
    color:#59626d;
    font-size:10px;
}

#muscle-list{
    overflow-y:auto;
    max-height:450px;
}

#muscle-list::-webkit-scrollbar{
    width:5px;
}

#muscle-list::-webkit-scrollbar-thumb{
    background:#343b45;
    border-radius:10px;
}

.muscle-item{
    padding:11px 15px;
    border-bottom:1px solid #1d2228;
    color:#aeb5bd;
    font-size:12px;
    cursor:pointer;
    transition:.12s;
}

.muscle-item:hover{
    background:#191e25;
    color:white;
}

.muscle-item.active{
    background:#292f38;
    color:white;
}

/* ================= DETAIL ================= */

#detail-panel{
    position:absolute;
    right:18px;
    bottom:18px;
    width:310px;
    background:rgba(13,16,21,.97);
    border:1px solid #2a3038;
    border-radius:12px;
    padding:17px;
    z-index:12;
    display:none;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.detail-name{
    font-size:19px;
    font-weight:750;
    line-height:1.2;
}

.detail-region{
    color:#707985;
    font-size:11px;
    margin-top:5px;
}

.detail-description{
    color:#929aa5;
    font-size:11px;
    line-height:1.5;
    margin-top:12px;
}

.detail-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.detail-btn{
    flex:1;
    padding:10px 7px;
    border:1px solid #353c46;
    border-radius:8px;
    background:#1b2027;
    color:#e2e5e8;
    cursor:pointer;
    font-size:11px;
}

.detail-btn:hover{
    background:#282e37;
}

.detail-btn.primary{
    background:#d9dde2;
    color:#101318;
    border-color:#d9dde2;
}

.exercise-title{
    margin-top:17px;
    color:#69727d;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
}

.exercise{
    margin-top:7px;
    padding:9px 10px;
    background:#191e24;
    border-radius:7px;
    color:#bfc5cc;
    font-size:11px;
}

/* ================= VIEW BUTTONS ================= */

#view-controls{
    position:absolute;
    right:18px;
    top:90px;
    display:flex;
    flex-direction:column;
    gap:7px;
    z-index:8;
}

.view-btn{
    width:46px;
    height:40px;
    border:1px solid #2a3038;
    border-radius:8px;
    background:rgba(13,16,21,.94);
    color:#cdd2d8;
    cursor:pointer;
    font-size:11px;
}

.view-btn:hover{
    background:#1c2128;
}

/* ================= LOADING ================= */

#loading{
    position:absolute;
    inset:0;
    background:#07090c;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .45s;
}

.loading-box{
    width:min(430px,84vw);
    text-align:center;
}

.loading-title{
    font-size:22px;
    font-weight:750;
}

.loading-text{
    margin-top:8px;
    color:#737c87;
    font-size:12px;
}

.progress-container{
    margin-top:22px;
    height:5px;
    background:#1b2026;
    border-radius:5px;
    overflow:hidden;
}

#progress{
    width:0%;
    height:100%;
    background:#d8dce1;
    transition:width .15s;
}

#error-box{
    display:none;
    margin-top:18px;
    padding:12px;
    background:#21171a;
    border:1px solid #4b3338;
    border-radius:8px;
    color:#d7adb4;
    font-size:11px;
    line-height:1.5;
}

/* ================= MOBILE ================= */

#mobile-menu{
    display:none;
}

@media(max-width:850px){

    #sidebar{
        position:absolute;
        left:-280px;
        top:0;
        transition:left .25s;
        box-shadow:15px 0 40px rgba(0,0,0,.45);
    }

    #sidebar.open{
        left:0;
    }

    #mobile-menu{
        display:block;
        position:absolute;
        left:14px;
        top:14px;
        width:43px;
        height:43px;
        z-index:40;
        border:1px solid #2a3038;
        border-radius:9px;
        background:rgba(13,16,21,.95);
        color:white;
    }

    #topbar{
        left:68px;
    }

    #search{
        width:40vw;
    }

    #muscle-panel{
        left:12px;
        top:auto;
        bottom:12px;
        width:260px;
        max-height:280px;
    }

    #muscle-list{
        max-height:190px;
    }

    #detail-panel{
        right:12px;
        bottom:12px;
        width:280px;
    }
}

@media(max-width:600px){

    .top-btn{
        padding:0 8px;
        font-size:10px;
    }

    #search{
        width:43vw;
    }

    #detail-panel{
        display:none!important;
    }
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   THREE SETUP
===================================================== */

const viewer=document.getElementById("viewer");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x07090c);


const camera=new THREE.PerspectiveCamera(
    45,
    viewer.clientWidth/viewer.clientHeight,
    0.01,
    1000
);

camera.position.set(0,0,7);


const renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.outputColorSpace=THREE.SRGBColorSpace;

viewer.appendChild(renderer.domElement);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x252830,
        2.5
    )
);

const light1=new THREE.DirectionalLight(
    0xffffff,
    3
);

light1.position.set(5,8,6);

scene.add(light1);


const light2=new THREE.DirectionalLight(
    0xffffff,
    1.5
);

light2.position.set(-5,3,4);

scene.add(light2);


const light3=new THREE.DirectionalLight(
    0xffffff,
    1.2
);

light3.position.set(0,4,-7);

scene.add(light3);


/* =====================================================
   CONTROLS
===================================================== */

const controls=new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=.07;

controls.enablePan=true;
controls.screenSpacePanning=true;

controls.minDistance=.1;
controls.maxDistance=100;

controls.zoomSpeed=1.25;
controls.rotateSpeed=.7;
controls.panSpeed=.8;


/* =====================================================
   VARIABLES
===================================================== */

let model=null;

let modelMeshes=[];

let selectedMesh=null;

let currentRegion="all";

let labelsVisible=false;


/* =====================================================
   MUSKEL-DATEN
===================================================== */

const names={

    pectoralismajor:"Großer Brustmuskel",
    pectoralisminor:"Kleiner Brustmuskel",

    deltoid:"Deltamuskel",
    deltoideus:"Deltamuskel",

    trapezius:"Trapezmuskel",
    latissimusdorsi:"Breiter Rückenmuskel",
    latissimus:"Breiter Rückenmuskel",

    rhomboid:"Rautenmuskel",
    erectorspinae:"Rückenstrecker",

    bicepsbrachii:"Bizeps",
    biceps:"Bizeps",

    tricepsbrachii:"Trizeps",
    triceps:"Trizeps",

    brachialis:"Armbeuger",
    brachioradialis:"Oberarm-Speichenmuskel",

    rectusabdominis:"Gerader Bauchmuskel",

    obliquusexternus:"Äußerer schräger Bauchmuskel",
    obliquusexternal:"Äußerer schräger Bauchmuskel",

    obliquusinternus:"Innerer schräger Bauchmuskel",

    transversusabdominis:"Querer Bauchmuskel",

    serratusanterior:"Sägezahnmuskel",

    gluteusmaximus:"Großer Gesäßmuskel",
    gluteusmedius:"Mittlerer Gesäßmuskel",
    gluteusminimus:"Kleiner Gesäßmuskel",

    rectusfemoris:"Gerader Oberschenkelmuskel",
    vastuslateralis:"Äußerer Oberschenkelmuskel",
    vastusmedialis:"Innerer Oberschenkelmuskel",
    vastusintermedius:"Mittlerer Oberschenkelmuskel",

    quadriceps:"Quadrizeps",

    bicepsfemoris:"Bizeps femoris",

    semitendinosus:"Halbsehnenmuskel",
    semimembranosus:"Plattsehnenmuskel",

    sartorius:"Schneidermuskel",

    gastrocnemius:"Zwillingswadenmuskel",
    soleus:"Schollenmuskel",

    tibialisanterior:"Vorderer Schienbeinmuskel",

    adductormagnus:"Großer Adduktor",
    adductorlongus:"Langer Adduktor",

    gracilis:"Schlanker Muskel"

};


/* =====================================================
   ÜBUNGEN
===================================================== */

const exercises={

    chest:[
        "Bankdrücken",
        "Schrägbankdrücken",
        "Dips",
        "Liegestütze"
    ],

    back:[
        "Klimmzüge",
        "Latzug",
        "Rudern",
        "Kreuzheben"
    ],

    shoulders:[
        "Schulterdrücken",
        "Seitheben",
        "Frontheben",
        "Reverse Flys"
    ],

    arms:[
        "Bizeps-Curls",
        "Hammer Curls",
        "Trizepsdrücken",
        "Dips"
    ],

    abs:[
        "Crunches",
        "Beinheben",
        "Plank",
        "Cable Crunches"
    ],

    legs:[
        "Kniebeugen",
        "Beinpresse",
        "Beinstrecker",
        "Beinbeuger"
    ],

    glutes:[
        "Hip Thrusts",
        "Bulgarian Split Squats",
        "Ausfallschritte",
        "Kniebeugen"
    ]

};


/* =====================================================
   BEKANNTE MUSKEL-SCHLÜSSEL
===================================================== */

const importantMuscles=[

    "pectoralis",
    "deltoid",
    "trapezius",
    "latissimus",
    "rhomboid",
    "erector",
    "biceps",
    "triceps",
    "brachialis",
    "brachioradialis",
    "rectusab",
    "obliquus",
    "transversusab",
    "serratus",
    "gluteus",
    "quadriceps",
    "rectusfemoris",
    "vastus",
    "bicepsfemoris",
    "semitendinosus",
    "semimembranosus",
    "sartorius",
    "gastrocnemius",
    "soleus",
    "tibialisanterior",
    "adductor",
    "gracilis"

];


/* =====================================================
   NAMEN
===================================================== */

function getCleanName(mesh){

    let raw=(mesh.name||"")
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"");

    for(const key of Object.keys(names)){

        if(raw.includes(key)){
            return names[key];
        }

    }

    return mesh.name
        .replace(/_/g," ")
        .replace(/-/g," ");

}


/* =====================================================
   IST WICHTIGER MUSKEL?
===================================================== */

function isImportant(mesh){

    const text=(mesh.name||"")
        .toLowerCase()
        .replace(/[^a-z0-9]/g,"");

    return importantMuscles.some(
        key=>text.includes(key)
    );

}


/* =====================================================
   REGION
===================================================== */

function getRegion(mesh){

    const text=(
        (mesh.name||"")+" "+
        (mesh.parent?.name||"")
    ).toLowerCase();

    if(
        text.includes("pector")||
        text.includes("chest")
    ){
        return "chest";
    }

    if(
        text.includes("trapez")||
        text.includes("latiss")||
        text.includes("rhombo")||
        text.includes("erector")||
        text.includes("dorsi")
    ){
        return "back";
    }

    if(
        text.includes("delto")||
        text.includes("shoulder")||
        text.includes("supraspin")||
        text.includes("infraspin")
    ){
        return "shoulders";
    }

    if(
        text.includes("biceps")||
        text.includes("triceps")||
        text.includes("brach")||
        text.includes("forearm")||
        text.includes("pronator")||
        text.includes("supinator")
    ){
        return "arms";
    }

    if(
        text.includes("rectusab")||
        text.includes("obliqu")||
        text.includes("transvers")||
        text.includes("serratus")
    ){
        return "abs";
    }

    if(
        text.includes("glute")||
        text.includes("buttock")
    ){
        return "glutes";
    }

    if(
        text.includes("femor")||
        text.includes("quadriceps")||
        text.includes("vastus")||
        text.includes("hamstring")||
        text.includes("gastrocn")||
        text.includes("soleus")||
        text.includes("tibial")||
        text.includes("adductor")||
        text.includes("sartorius")
    ){
        return "legs";
    }

    return "all";

}


/* =====================================================
   MATERIAL
===================================================== */

function createMaterial(){

    return new THREE.MeshStandardMaterial({

        color:0xb86167,

        roughness:.72,

        metalness:.02,

        transparent:false,

        opacity:1,

        depthWrite:true

    });

}


/* =====================================================
   MODELL LADEN
===================================================== */

function loadModel(){

    const loader=new GLTFLoader();

    loader.load(

        "./anatomy.glb",

        function(gltf){

            model=gltf.scene;

            /*
                BodyExplorer verwendet eine
                andere Achsenausrichtung.
            */

            model.rotation.x=-Math.PI/2;

            scene.add(model);


            model.traverse(object=>{

                if(!object.isMesh){
                    return;
                }

                object.frustumCulled=false;

                object.material=createMaterial();

                object.userData.region=
                    getRegion(object);

                object.userData.displayName=
                    getCleanName(object);

                object.userData.important=
                    isImportant(object);

                modelMeshes.push(object);

            });


            /*
                Modell zentrieren
            */

            let box=
                new THREE.Box3()
                .setFromObject(model);

            let center=
                new THREE.Vector3();

            box.getCenter(center);

            model.position.sub(center);


            /*
                Skalieren
            */

            let size=
                new THREE.Vector3();

            box.getSize(size);

            let height=Math.max(
                size.x,
                size.y,
                size.z
            );

            if(height>0){

                model.scale.setScalar(
                    6/height
                );

            }


            /*
                erneut zentrieren
            */

            box=
                new THREE.Box3()
                .setFromObject(model);

            center=
                new THREE.Vector3();

            box.getCenter(center);

            model.position.sub(center);


            camera.position.set(
                0,0,7
            );

            controls.target.set(
                0,0,0
            );

            controls.update();


            buildMuscleList();

            hideLoading();

        },

        function(event){

            if(event.lengthComputable){

                const percent=
                    event.loaded/event.total*100;

                document.getElementById(
                    "progress"
                ).style.width=
                    percent+"%";

                document.getElementById(
                    "loadingText"
                ).textContent=
                    "3D-Modell wird geladen... "+
                    Math.round(percent)+"%";

            }

        },

        function(error){

            console.error(error);

            document.getElementById(
                "loadingTitle"
            ).textContent=
                "Fehler beim Laden";

            document.getElementById(
                "loadingText"
            ).textContent=
                "Die anatomy.glb konnte nicht verarbeitet werden.";

            document.getElementById(
                "error-box"
            ).style.display="block";

            document.getElementById(
                "error-box"
            ).textContent=
                "Die Datei ist erreichbar, aber der 3D-Loader konnte sie nicht verarbeiten.";

        }

    );

}


/* =====================================================
   LOADING AUS
===================================================== */

function hideLoading(){

    const loading=
        document.getElementById("loading");

    loading.style.opacity="0";

    setTimeout(
        ()=>loading.style.display="none",
        450
    );

}


/* =====================================================
   MUSKEL-LISTE
===================================================== */

function buildMuscleList(){

    const list=
        document.getElementById(
            "muscle-list"
        );

    list.innerHTML="";


    const search=
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    const unique=new Map();


    for(const mesh of modelMeshes){

        /*
            Nur größere/sinnvolle Muskeln
            anzeigen.
        */

        if(!mesh.userData.important){
            continue;
        }


        if(
            currentRegion!=="all" &&
            mesh.userData.region!==currentRegion
        ){
            continue;
        }


        const name=
            mesh.userData.displayName;


        if(
            search &&
            !name.toLowerCase()
                .includes(search)
        ){
            continue;
        }


        if(!unique.has(name)){
            unique.set(name,mesh);
        }

    }


    document.getElementById(
        "muscle-count"
    ).textContent=
        unique.size+
        (unique.size===1
            ?" Muskel"
            :" Muskeln");


    if(unique.size===0){

        const empty=
            document.createElement("div");

        empty.className="muscle-item";

        empty.textContent=
            "Keine passenden Muskeln gefunden.";

        empty.style.cursor="default";

        list.appendChild(empty);

        return;

    }


    for(const [name,mesh] of unique){

        const item=
            document.createElement("div");

        item.className="muscle-item";

        item.textContent=name;


        if(
            selectedMesh &&
            selectedMesh.userData.displayName===name
        ){
            item.classList.add("active");
        }


        item.onclick=()=>selectMesh(mesh);


        list.appendChild(item);

    }

}


/* =====================================================
   MUSKEL AUSWÄHLEN
===================================================== */

function selectMesh(mesh){

    if(!mesh){
        return;
    }


    /*
        Vorherige Hervorhebung entfernen
    */

    restoreAllMaterials();


    selectedMesh=mesh;


    /*
        Alle sichtbaren Muskeln etwas abdunkeln
    */

    modelMeshes.forEach(object=>{

        if(!object.visible){
            return;
        }

        if(object===mesh){

            object.material.color.set(
                0xf0a0a6
            );

            object.material.emissive.set(
                0x42151a
            );

            object.material.emissiveIntensity=.45;

        }else{

            object.material.color.set(
                0x8f5559
            );

            object.material.emissive.set(
                0x000000
            );

        }

    });


    /*
        Detailpanel
    */

    document.getElementById(
        "detail-panel"
    ).style.display="block";


    document.getElementById(
        "detail-name"
    ).textContent=
        mesh.userData.displayName;


    const regionName={

        chest:"Brust",
        back:"Rücken",
        shoulders:"Schultern",
        arms:"Arme",
        abs:"Bauch",
        legs:"Beine",
        glutes:"Gesäß"

    };


    document.getElementById(
        "detail-region"
    ).textContent=
        regionName[
            mesh.userData.region
        ]||"Körper";


    document.getElementById(
        "detail-description"
    ).textContent=
        "Ausgewählter Muskel. Fokussiere ihn oder blende die oberflächlichen Strukturen aus, um tieferliegende Muskeln zu untersuchen.";


    /*
        Übungen
    */

    const list=
        document.getElementById(
            "exercise-list"
        );

    list.innerHTML="";


    const region=
        exercises[
            mesh.userData.region
        ]||
        exercises.arms;


    region.forEach(exercise=>{

        const div=
            document.createElement("div");

        div.className="exercise";

        div.textContent=exercise;

        list.appendChild(div);

    });


    buildMuscleList();

}


/* =====================================================
   MATERIALIEN ZURÜCK
===================================================== */

function restoreAllMaterials(){

    modelMeshes.forEach(mesh=>{

        if(!mesh.material){
            return;
        }

        mesh.material.color.set(
            0xb86167
        );

        mesh.material.emissive.set(
            0x000000
        );

        mesh.material.emissiveIntensity=0;

        mesh.material.transparent=false;

        mesh.material.opacity=1;

        mesh.material.depthWrite=true;

    });

}


/* =====================================================
   FOKUS
===================================================== */

function focusMesh(mesh){

    if(!mesh){
        return;
    }


    const box=
        new THREE.Box3()
        .setFromObject(mesh);


    const center=
        new THREE.Vector3();

    box.getCenter(center);


    const size=
        new THREE.Vector3();

    box.getSize(size);


    const largest=
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const distance=
        Math.max(
            largest*4,
            1.1
        );


    const direction=
        new THREE.Vector3(
            0,
            0,
            1
        );


    camera.position.copy(
        center.clone().add(
            direction.multiplyScalar(
                distance
            )
        )
    );


    controls.target.copy(
        center
    );

    controls.update();

}


/* =====================================================
   ISOLIEREN
===================================================== */

function isolateSelected(){

    if(!selectedMesh){
        return;
    }


    modelMeshes.forEach(mesh=>{

        if(mesh===selectedMesh){

            mesh.visible=true;

            mesh.material.transparent=false;

            mesh.material.opacity=1;

        }else{

            /*
                Andere Muskeln werden nicht komplett
                gelöscht, sondern durchsichtig.
            */

            mesh.visible=true;

            mesh.material.transparent=true;

            mesh.material.opacity=.06;

            mesh.material.depthWrite=false;

        }

    });


    /*
        ausgewählten Muskel deutlich hervorheben
    */

    selectedMesh.material.transparent=false;

    selectedMesh.material.opacity=1;

    selectedMesh.material.color.set(
        0xf2a2a7
    );

}


/* =====================================================
   DURCHSICHTIG
===================================================== */

function makeSelectedTransparent(){

    if(!selectedMesh){
        return;
    }


    selectedMesh.material.transparent=true;

    selectedMesh.material.opacity=.12;

    selectedMesh.material.depthWrite=false;


    /*
        Dadurch werden Strukturen dahinter
        sichtbar.
    */

}


/* =====================================================
   ALLES ZEIGEN
===================================================== */

function showEverything(){

    modelMeshes.forEach(mesh=>{

        mesh.visible=true;

        mesh.material.transparent=false;

        mesh.material.opacity=1;

        mesh.material.depthWrite=true;

    });


    selectedMesh=null;

    restoreAllMaterials();

    document.getElementById(
        "detail-panel"
    ).style.display="none";


    buildMuscleList();

}


/* =====================================================
   ANSICHTEN
===================================================== */

function frontView(){

    camera.position.set(
        0,0,7
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


function backView(){

    camera.position.set(
        0,0,-7
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


function sideView(){

    camera.position.set(
        7,0,0
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


function resetView(){

    showEverything();

    camera.position.set(
        0,0,7
    );

    controls.target.set(
        0,0,0
    );

    controls.update();

}


/* =====================================================
   ZOOM
===================================================== */

function zoomIn(){

    const direction=
        new THREE.Vector3();

    direction.subVectors(
        camera.position,
        controls.target
    ).normalize();


    const distance=
        camera.position.distanceTo(
            controls.target
        );


    const newDistance=
        Math.max(
            distance*.7,
            .1
        );


    camera.position.copy(
        controls.target.clone().add(
            direction.multiplyScalar(
                newDistance
            )
        )
    );

}


function zoomOut(){

    const direction=
        new THREE.Vector3();

    direction.subVectors(
        camera.position,
        controls.target
    ).normalize();


    const distance=
        camera.position.distanceTo(
            controls.target
        );


    const newDistance=
        Math.min(
            distance*1.35,
            100
        );


    camera.position.copy(
        controls.target.clone().add(
            direction.multiplyScalar(
                newDistance
            )
        )
    );

}


/* =====================================================
   REGION BUTTONS
===================================================== */

document.querySelectorAll(
    ".region-btn"
).forEach(button=>{

            document.querySelectorAll(

            };


            document.getElementById(

        }
    );

});


/* =====================================================
   SUCHE
===================================================== */

document.getElementById(
    "search"
).addEventListener(

);

/* =====================================================
   3D CLICK
===================================================== */

const raycaster=
    new THREE.Raycaster();

const pointer=
    new THREE.Vector2();


renderer.domElement.addEventListener(
    "dblclick",
    event=>{

        const rect=
            renderer.domElement
            .getBoundingClientRect();


        pointer.x=
            ((event.clientX-rect.left)/
            rect.width)*2-1;


        pointer.y=
            -((event.clientY-rect.top)/
            rect.height)*2+1;


        raycaster.setFromCamera(
            pointer,
            camera
        );


        const hits=
            raycaster.intersectObjects(
                modelMeshes.filter(
                    mesh=>mesh.visible
                ),
                true
            );


        if(!hits.length){
            return;
        }


        let mesh=hits[0].object;


        while(
            mesh &&
            !mesh.userData.displayName &&
            mesh.parent
        ){
            mesh=mesh.parent;
        }


        if(
            mesh &&
            mesh.userData.displayName
        ){
            selectMesh(mesh);
        }

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        const width=
            viewer.clientWidth;

        const height=
            viewer.clientHeight;


        camera.aspect=
            width/height;

        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );

    }
);


/* =====================================================
   RENDER
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   START
===================================================== */

loadModel();
